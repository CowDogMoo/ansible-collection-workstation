---
- name: Set OS-specific facts
  ansible.builtin.set_fact:
    logging_is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
    logging_is_linux: "{{ ansible_facts['os_family'] in ['Debian', 'RedHat'] }}"
    logging_user_scope_linux: "{{ ansible_facts['os_family'] in ['Debian', 'RedHat'] and not logging_logrotate_config_dir.startswith('/etc') }}"

- name: Check if logrotate binary exists
  ansible.builtin.stat:
    path: "{{ logging_logrotate_binary }}"
  register: logging_logrotate_check

- name: Install logrotate on macOS
  community.general.homebrew:
    name: logrotate
    state: present
  when:
    - logging_is_macos
    - not (logging_logrotate_check.stat.exists | default(false))

- name: Install logrotate on Linux (Debian-based)
  ansible.builtin.apt:
    name: logrotate
    state: present
    update_cache: true
  become: true
  when:
    - logging_is_linux
    - ansible_facts['os_family'] == "Debian"
    - not (logging_logrotate_check.stat.exists | default(false))

- name: Install logrotate on Linux (RedHat-based)
  ansible.builtin.dnf:
    name: logrotate
    state: present
  become: true
  when:
    - logging_is_linux
    - ansible_facts['os_family'] == "RedHat"
    - not (logging_logrotate_check.stat.exists | default(false))

- name: Ensure logging directories exist
  ansible.builtin.file:
    path: "{{ item.path | regex_replace('^~', ansible_facts['user_dir'] | default(ansible_facts['env']['HOME'])) }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default(ansible_facts['user_id']) }}"
    group: "{{ item.group | default(ansible_facts['user_gid'] | default(ansible_facts['user_id'])) }}"
  loop: "{{ logging_directories }}"
  become: "{{ logging_is_linux and item.path.startswith('/var') | default(false) }}"
  when: logging_directories | length > 0

- name: Ensure parent directory for logrotate config exists on macOS
  ansible.builtin.file:
    path: "{{ logging_logrotate_config_dir | dirname }}"
    state: directory
    mode: "0755"
  when:
    - logging_is_macos
    - logging_rotation_configs | length > 0

- name: Ensure logrotate config directory exists
  ansible.builtin.file:
    path: "{{ logging_logrotate_config_dir }}"
    state: directory
    mode: "0755"
  become: "{{ logging_is_linux and logging_logrotate_config_dir.startswith('/etc') }}"
  when: logging_rotation_configs | length > 0

- name: Ensure olddir directories exist for log rotation
  ansible.builtin.file:
    path: "{{ item.olddir | regex_replace('^~', ansible_facts['user_dir'] | default(ansible_facts['env']['HOME'])) }}"
    state: directory
    mode: "0755"
    owner: "{{ item.owner | default(ansible_facts['user_id']) }}"
    group: "{{ item.group | default(ansible_facts['user_gid'] | default(ansible_facts['user_id'])) }}"
  loop: "{{ logging_rotation_configs | selectattr('olddir', 'defined') | list }}"
  become: "{{ logging_is_linux and item.olddir.startswith('/var') | default(false) }}"

# Handle multiple log rotation configurations
- name: Setup log rotation configurations
  ansible.builtin.template:
    src: logrotate.j2
    dest: "{{ logging_logrotate_config_dir }}/{{ item.name | default(item.path.split('/')[-2]) }}"
    mode: "0644"
  become: "{{ logging_is_linux and logging_logrotate_config_dir.startswith('/etc') }}"
  loop: "{{ logging_rotation_configs }}"
  vars:
    log_rotation_config: "{{ item }}"
  when: logging_rotation_configs | length > 0

- name: Ensure logrotate state directory exists on macOS
  ansible.builtin.file:
    path: "{{ logging_logrotate_state_file | dirname }}"
    state: directory
    mode: "0755"
  when:
    - logging_is_macos
    - logging_rotation_configs | length > 0

- name: Create logrotate state file on macOS
  ansible.builtin.file:
    path: "{{ logging_logrotate_state_file }}"
    state: touch
    mode: "0644"
  when:
    - logging_is_macos
    - logging_rotation_configs | length > 0
  changed_when: false

- name: Create LaunchAgent directory on macOS
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents"
    state: directory
    mode: "0755"
  when:
    - logging_is_macos
    - logging_rotation_configs | length > 0

- name: Create LaunchAgent for logrotate on macOS
  ansible.builtin.template:
    src: com.logging.logrotate.plist.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ logging_launchagent_label }}.plist"
    mode: "0644"
  when:
    - logging_is_macos
    - logging_rotation_configs | length > 0

- name: Unload existing LaunchAgent if present
  ansible.builtin.command:
    cmd: launchctl unload {{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ logging_launchagent_label }}.plist
  when:
    - logging_is_macos
    - logging_rotation_configs | length > 0
  failed_when: false
  changed_when: false

- name: Load LaunchAgent for logrotate on macOS
  ansible.builtin.command:
    cmd: launchctl load -w {{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ logging_launchagent_label }}.plist
  when:
    - logging_is_macos
    - logging_rotation_configs | length > 0
  changed_when: false

- name: Ensure logrotate's own log directory exists
  ansible.builtin.file:
    path: "{{ logging_logrotate_log_path }}"
    state: directory
    mode: "0755"
  when:
    - logging_is_macos
    - logging_rotation_configs | length > 0

# System logrotate only reads /etc/logrotate.d, so configs written to a
# user-scope directory on Linux need their own scheduler — a systemd user
# timer, mirroring the LaunchAgent used on macOS.
- name: Ensure systemd user unit directory exists
  ansible.builtin.file:
    path: "{{ (ansible_facts['user_dir'] | default(ansible_facts['env']['HOME'])) }}/.config/systemd/user"
    state: directory
    mode: "0755"
  when:
    - logging_user_scope_linux
    - logging_rotation_configs | length > 0

- name: Install systemd user units for logrotate
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ (ansible_facts['user_dir'] | default(ansible_facts['env']['HOME'])) }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - logrotate.service
    - logrotate.timer
  when:
    - logging_user_scope_linux
    - logging_rotation_configs | length > 0

# `systemctl --user` needs a reachable user session bus; containers and bare
# SSH sessions without lingering don't have one, so probe before enabling.
# The command exercises the same bus connection the systemd_service module
# uses, which no module can probe — hence the noqa.
- name: Check for a reachable systemd user session # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl --user show-environment
  register: logging_systemd_user_session
  changed_when: false
  failed_when: false
  when:
    - logging_user_scope_linux
    - logging_rotation_configs | length > 0

- name: Enable and start the logrotate user timer
  ansible.builtin.systemd_service:
    name: logrotate.timer
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  when:
    - logging_user_scope_linux
    - logging_rotation_configs | length > 0
    - logging_systemd_user_session.rc | default(1) == 0
