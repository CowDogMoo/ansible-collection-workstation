---
herdr_username: "{{ ansible_facts['user_id'] | default(ansible_facts['user']) }}"
herdr_usergroup: "{{ (ansible_facts['user_gid'] | default('staff')) if ansible_facts['os_family'] == 'Darwin' else herdr_username }}"
herdr_user_home: >-
  {{ (ansible_facts['user_dir'] | default(ansible_facts['env']['HOME']))
     if (herdr_username == (ansible_facts['user_id'] | default(ansible_facts['user']) | default('')))
     else ((ansible_facts['os_family'] == 'Darwin') | ternary('/Users/' + herdr_username,
           (herdr_username == 'root') | ternary('/root', '/home/' + herdr_username))) }}

# Whether to install the herdr binary (set false on hosts where herdr is built from source).
herdr_install: true

# How to install herdr: "binary" downloads the pinned, checksum-verified release
# binary from GitHub; "homebrew" installs the herdr formula (macOS/Linuxbrew),
# which tracks the formula's version rather than herdr_version. Defaults to
# homebrew on macOS, so it does not end up with a second copy in ~/.local/bin,
# and to binary everywhere else.
herdr_install_method: "{{ (ansible_facts['os_family'] == 'Darwin') | ternary('homebrew', 'binary') }}"

# Release of herdr to install with the binary method. Changing it also requires a
# matching entry in herdr_checksums.
herdr_version: "0.9.3"

# Directory the herdr binary is installed into. Matches the upstream installer's
# ~/.local/bin, except for root on Linux, which gets /usr/local/bin so the binary
# lands on the default PATH.
herdr_install_dir: >-
  {{ ((ansible_facts['os_family'] != 'Darwin') and (herdr_username == 'root'))
     | ternary('/usr/local/bin', herdr_user_home + '/.local/bin') }}

# Path to an existing herdr binary; empty finds it automatically.
herdr_binary_path: ""

# Agent integrations to install when the agent is present. claude and
# antigravity-cli get only the hook script; their roles register it.
herdr_integrations:
  - claude
  - antigravity-cli
  - codex

# herdr only reads another directory when HERDR_CONFIG_PATH points at it.
herdr_config_dir: "{{ herdr_user_home }}/.config/herdr"

# Controller directory of agent-detection overrides to copy.
herdr_agent_detection_src_dir: ""

# Render config.toml with only the settings that differ from herdr's defaults.
herdr_manage_config: true
herdr_backup_config: true

# Opt-in tmux-style keybindings.
herdr_tmux_keybindings: false

# Opt-in cheatsheet (prefix+/) and split-rotation (prefix+space) helpers.
herdr_manage_helpers: false
# Installed on Linux when helpers are enabled.
herdr_helper_dependencies:
  - less
  - python3

herdr_create_herder_alias: true

# config.toml settings, defaulting to herdr's own except onboarding.
herdr_onboarding: false
herdr_toast_delivery: "off"
herdr_show_agent_labels_on_pane_borders: false
herdr_confirm_close: true
herdr_agent_panel_sort: "spaces"
herdr_status_indicators: "dots"
herdr_theme_name: "catppuccin"
herdr_theme_auto_switch: false
herdr_prefix: "ctrl+b"

# SHA-256 digests of the official release assets, keyed by version then asset name.
# Taken from the GitHub release metadata for each tag.
herdr_checksums:
  "0.9.3":
    herdr-linux-aarch64: "4de7aa3e25678812e92960de64f7c2aaa1bca1f0f80a3c5e559837e231e1f5c0"
    herdr-linux-x86_64: "18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7"
    herdr-macos-aarch64: "5173a3e0ae42d5d1ab7ebfa5d5e6329f7c3d23f8e1a3677c7ce3231da2884157"
    herdr-macos-x86_64: "db62d548ff3e832b087a96b1894a08d26be3905f1830309cd556783f215d4054"

# Map ansible_facts['architecture'] to herdr release asset architectures
herdr_arch_map:
  x86_64: x86_64
  amd64: x86_64
  aarch64: aarch64
  arm64: aarch64

# Map ansible_facts['system'] to herdr release asset operating systems
herdr_os_map:
  Linux: linux
  Darwin: macos
