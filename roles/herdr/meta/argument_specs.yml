---
argument_specs:
  main:
    short_description: Install and configure herdr, the terminal agent multiplexer
    description:
      - Installs herdr from Homebrew on macOS, and from a pinned, SHA-256 verified GitHub release binary elsewhere.
      - Renders ~/.config/herdr/config.toml with only the settings that differ from herdr's defaults, backing up the previous file.
      - Optionally adds a tmux-style keymap and popup cheatsheet and split-rotation helper scripts.
      - Installs herdr's agent integrations for agents that are present.
      - For Claude Code and Antigravity CLI only the hook script is placed; registering it is left to the claude_code and antigravity roles.
      - Never starts, stops, or attaches to a herdr server.
    options:
      herdr_username:
        type: str
        description: User who owns the herdr install and configuration.
      herdr_usergroup:
        type: str
        description: Group that owns the herdr install and configuration.
      herdr_user_home:
        type: str
        description: Home directory of herdr_username.
      herdr_install:
        type: bool
        default: true
        description: >-
          Install the herdr binary. Set false where herdr comes from elsewhere (for example
          a source build); the role then configures whatever herdr_binary_path or the
          user's PATH provides and skips binary-dependent tasks when none is found.
      herdr_install_method:
        type: str
        choices:
          - binary
          - homebrew
        description: >-
          Install the pinned release binary, or the Homebrew formula. Defaults to
          homebrew on macOS (Darwin) and binary on every other platform.
      herdr_version:
        type: str
        default: "0.9.3"
        description: herdr release to install with the binary method.
      herdr_install_dir:
        type: str
        description: Directory the release binary is installed into, and where the herder alias is created.
      herdr_binary_path:
        type: str
        default: ""
        description: >-
          Path to an existing herdr binary. Empty uses the install method's path, or with
          herdr_install false, `command -v herdr` for the user.
      herdr_integrations:
        type: list
        elements: str
        choices:
          - claude
          - antigravity-cli
          - codex
        default:
          - claude
          - antigravity-cli
          - codex
        description: >-
          herdr agent integrations to install, each only when the agent's config directory
          exists and herdr does not already report it current. claude and antigravity-cli
          get only the hook script (their registration belongs to the claude_code and
          antigravity roles); codex is installed in place by herdr.
      herdr_config_dir:
        type: str
        description: >-
          herdr configuration directory. herdr reads ~/.config/herdr unless HERDR_CONFIG_PATH
          points elsewhere, which this role does not set.
      herdr_agent_detection_src_dir:
        type: str
        default: ""
        description: Optional controller directory of agent-detection *.toml overrides, copied to herdr_config_dir/agent-detection.
      herdr_manage_config:
        type: bool
        default: true
        description: Render herdr_config_dir/config.toml.
      herdr_backup_config:
        type: bool
        default: true
        description: Back up an existing config.toml before overwriting it.
      herdr_tmux_keybindings:
        type: bool
        default: false
        description: Add a tmux-style keymap (prefix+l last pane, |/%/" splits, prefix+, rename, ...) to config.toml.
      herdr_manage_helpers:
        type: bool
        default: false
        description: >-
          Deploy cheatsheet.sh (prefix+/ popup documenting the tmux-style keymap) and
          rotate-split.sh (prefix+space) to herdr_config_dir and bind them in config.toml.
      herdr_helper_dependencies:
        type: list
        elements: str
        default:
          - less
          - python3
        description: Packages the helper scripts need, installed on Linux when herdr_manage_helpers is true.
      herdr_create_herder_alias:
        type: bool
        default: true
        description: Create a typo-tolerant herder -> herdr symlink in herdr_install_dir.
      herdr_onboarding:
        type: bool
        default: false
        description: Show herdr's first-run onboarding. Off because the settings it asks about are managed here.
      herdr_toast_delivery:
        type: str
        default: "off"
        choices:
          - "off"
          - herdr
          - terminal
          - system
        description: Background notification delivery (ui.toast.delivery).
      herdr_show_agent_labels_on_pane_borders:
        type: bool
        default: false
        description: Show agent labels on pane borders.
      herdr_confirm_close:
        type: bool
        default: true
        description: Confirm before closing panes or tabs.
      herdr_agent_panel_sort:
        type: str
        default: spaces
        choices:
          - spaces
          - workspaces
          - priority
        description: Agent panel ordering.
      herdr_status_indicators:
        type: str
        default: dots
        choices:
          - dots
          - symbols
        description: Agent status indicators in the sidebar (ui.status_indicators).
      herdr_theme_name:
        type: str
        default: catppuccin
        choices:
          - catppuccin
          - catppuccin-latte
          - terminal
          - tokyo-night
          - tokyo-night-day
          - dracula
          - nord
          - gruvbox
          - gruvbox-light
          - one-dark
          - one-light
          - solarized
          - solarized-light
          - kanagawa
          - kanagawa-lotus
          - rose-pine
          - rose-pine-dawn
          - vesper
        description: Built-in herdr theme.
      herdr_theme_auto_switch:
        type: bool
        default: false
        description: Follow the host terminal's light/dark appearance.
      herdr_prefix:
        type: str
        default: ctrl+b
        description: Prefix key for herdr keybindings.
      herdr_checksums:
        type: dict
        description: SHA-256 digests of release assets, keyed by version then asset name.
      herdr_arch_map:
        type: dict
        description: Map of ansible_facts architecture to herdr asset architecture.
      herdr_os_map:
        type: dict
        description: Map of ansible_facts system to herdr asset operating system.
