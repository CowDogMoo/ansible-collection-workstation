---
argument_specs:
  main:
    short_description: Install herdr, the terminal agent multiplexer
    description:
      - Installs herdr from Homebrew on macOS, and from a pinned, SHA-256 verified GitHub release binary elsewhere.
      - Never starts, stops, or configures a herdr server.
      - Optionally places herdr's Claude Code hook script, generated by herdr itself, without touching ~/.claude/settings.json.
    options:
      herdr_username:
        type: str
        description: User who owns the herdr install.
      herdr_usergroup:
        type: str
        description: Group that owns the herdr install.
      herdr_user_home:
        type: str
        description: Home directory of herdr_username.
      herdr_install_method:
        type: str
        choices:
          - binary
          - homebrew
        description: >-
          Install the pinned release binary, or the Homebrew formula. Defaults to
          homebrew on macOS (Darwin) and binary on every other platform.
      herdr_version:
        type: str
        default: "0.9.3"
        description: herdr release to install with the binary method.
      herdr_install_dir:
        type: str
        description: Directory the herdr binary is installed into.
      herdr_claude_integration:
        type: bool
        default: true
        description: >-
          Place herdr's Claude Code hook script at ~/.claude/hooks/herdr-agent-state.sh.
          Registering it in ~/.claude/settings.json is left to the claude_code role.
      herdr_checksums:
        type: dict
        description: SHA-256 digests of release assets, keyed by version then asset name.
      herdr_arch_map:
        type: dict
        description: Map of ansible_facts architecture to herdr asset architecture.
      herdr_os_map:
        type: dict
        description: Map of ansible_facts system to herdr asset operating system.
