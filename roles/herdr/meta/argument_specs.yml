---
argument_specs:
  main:
    short_description: Install and configure herdr
    description:
      - Installs herdr from Homebrew on macOS and a pinned, checksum-verified release binary elsewhere.
      - Writes ~/.config/herdr/config.toml with only the non-default settings.
      - Installs herdr's agent integrations for agents that are present.
      - Never starts, stops, or attaches to a herdr server.
    options:
      herdr_username:
        type: str
        description: User who owns the herdr install and config.
      herdr_usergroup:
        type: str
        description: Group that owns the herdr install and config.
      herdr_user_home:
        type: str
        description: Home directory of herdr_username.
      herdr_install:
        type: bool
        default: true
        description: Install the herdr binary; set false when herdr comes from elsewhere.
      herdr_install_method:
        type: str
        choices:
          - binary
          - homebrew
        description: Install the release binary or the Homebrew formula (homebrew on macOS by default).
      herdr_version:
        type: str
        default: "0.9.3"
        description: herdr release to install with the binary method.
      herdr_install_dir:
        type: str
        description: Directory for the release binary and the herder alias.
      herdr_binary_path:
        type: str
        default: ""
        description: Path to an existing herdr binary; empty finds it automatically.
      herdr_integrations:
        type: list
        elements: str
        choices:
          - claude
          - antigravity-cli
          - codex
        default:
          - claude
          - antigravity-cli
          - codex
        description: Agent integrations to install when the agent is present.
      herdr_config_dir:
        type: str
        description: herdr config directory.
      herdr_agent_detection_src_dir:
        type: str
        default: ""
        description: Controller directory of agent-detection overrides to copy.
      herdr_manage_config:
        type: bool
        default: true
        description: Render config.toml.
      herdr_backup_config:
        type: bool
        default: true
        description: Back up config.toml before overwriting it.
      herdr_tmux_keybindings:
        type: bool
        default: false
        description: Add tmux-style keybindings.
      herdr_manage_helpers:
        type: bool
        default: false
        description: Deploy and bind the cheatsheet and split-rotation helper scripts.
      herdr_helper_dependencies:
        type: list
        elements: str
        default:
          - less
          - python3
        description: Packages the helper scripts need on Linux.
      herdr_create_herder_alias:
        type: bool
        default: true
        description: Create a herder -> herdr symlink.
      herdr_onboarding:
        type: bool
        default: false
        description: Show herdr's first-run onboarding.
      herdr_toast_delivery:
        type: str
        default: "off"
        choices:
          - "off"
          - herdr
          - terminal
          - system
        description: Background notification delivery.
      herdr_show_agent_labels_on_pane_borders:
        type: bool
        default: false
        description: Show agent labels on pane borders.
      herdr_confirm_close:
        type: bool
        default: true
        description: Confirm before closing panes or tabs.
      herdr_agent_panel_sort:
        type: str
        default: spaces
        choices:
          - spaces
          - workspaces
          - priority
        description: Agent panel ordering.
      herdr_status_indicators:
        type: str
        default: dots
        choices:
          - dots
          - symbols
        description: Agent status indicator style.
      herdr_theme_name:
        type: str
        default: catppuccin
        choices:
          - catppuccin
          - catppuccin-latte
          - terminal
          - tokyo-night
          - tokyo-night-day
          - dracula
          - nord
          - gruvbox
          - gruvbox-light
          - one-dark
          - one-light
          - solarized
          - solarized-light
          - kanagawa
          - kanagawa-lotus
          - rose-pine
          - rose-pine-dawn
          - vesper
        description: Built-in herdr theme.
      herdr_theme_auto_switch:
        type: bool
        default: false
        description: Follow the host terminal's light/dark appearance.
      herdr_prefix:
        type: str
        default: ctrl+b
        description: Prefix key for herdr keybindings.
      herdr_checksums:
        type: dict
        description: SHA-256 digests of release assets, keyed by version then asset name.
      herdr_arch_map:
        type: dict
        description: Map of ansible_facts architecture to herdr asset architecture.
      herdr_os_map:
        type: dict
        description: Map of ansible_facts system to herdr asset operating system.
