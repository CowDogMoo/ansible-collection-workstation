---
- name: Converge
  hosts: all
  vars:
    container_user: "{{ ansible_facts['distribution'] | lower }}"
    container_home: "/home/{{ container_user }}"
  tasks:
    # Defaults as root: lands in /usr/local/bin so it is on the default PATH.
    - name: Include role under test (root defaults)
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.herdr

    # Unprivileged user: lands in ~/.local/bin, owned by that user, with the
    # opt-in keymap and helpers and non-default UI settings.
    - name: Include role under test (unprivileged user)
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.herdr
      vars: &user_vars
        herdr_username: "{{ container_user }}"
        herdr_usergroup: "{{ container_user }}"
        herdr_user_home: "{{ container_home }}"
        herdr_tmux_keybindings: true
        herdr_manage_helpers: true
        herdr_toast_delivery: system
        herdr_theme_name: terminal

    # herdr_install false with no binary at the configured path: the config is
    # still rendered and binary-dependent tasks are skipped instead of failing.
    - name: Include role under test (herdr_install false, no binary)
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.herdr
      vars:
        herdr_install: false
        herdr_binary_path: /nonexistent/herdr

    # herdr_install false resolving the user's existing binary from PATH.
    - name: Include role under test (herdr_install false, binary on PATH)
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.herdr
      vars:
        <<: *user_vars
        herdr_install: false
