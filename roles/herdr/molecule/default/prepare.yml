---
- name: Prepare
  hosts: all
  gather_facts: true
  vars:
    container_user: "{{ ansible_facts['distribution'] | lower }}"
    container_home: "/home/{{ container_user }}"
  tasks:
    - name: Create test user
      ansible.builtin.user:
        name: "{{ container_user }}"
        shell: /bin/bash
        create_home: true
        home: "{{ container_home }}"
      become: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - sudo
        state: present
        update_cache: true
      become: true

    # Stand-ins for installed agents: herdr only installs an integration whose
    # agent config directory exists. root gets Claude Code only, so the gating
    # for the other agents is exercised too.
    - name: Create agent config directories for the test user
      ansible.builtin.file:
        path: "{{ container_home }}/{{ item }}"
        state: directory
        owner: "{{ container_user }}"
        group: "{{ container_user }}"
        mode: "0755"
      loop:
        - .claude
        - .gemini
        - .gemini/config
        - .codex
      become: true

    - name: Create the Claude Code config directory for root
      ansible.builtin.file:
        path: /root/.claude
        state: directory
        mode: "0700"
      become: true
