---
# `herdr integration install claude` writes ~/.claude/hooks/herdr-agent-state.sh
# and also registers it in ~/.claude/settings.json. settings.json belongs to the
# claude_code role, so the installer runs against a throwaway HOME and only the
# generated script is copied into the user's real ~/.claude/hooks.
- name: Check herdr Claude integration status
  ansible.builtin.command: "{{ herdr_binary }} integration status"
  environment:
    HOME: "{{ herdr_user_home }}"
  register: herdr_claude_integration_status
  changed_when: false
  failed_when: herdr_claude_integration_status.rc != 0 and not ansible_check_mode
  check_mode: false
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  become_user: "{{ herdr_username }}"

- name: Install herdr Claude integration script
  when:
    - not ansible_check_mode
    - "herdr_claude_integration_status.stdout is not search('(?m)^claude: current')"
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  become_user: "{{ herdr_username }}"
  block:
    - name: Create herdr integration staging home
      ansible.builtin.tempfile:
        state: directory
        suffix: herdr-claude
      register: herdr_claude_staging

    # The installer refuses to run unless ~/.claude already exists.
    - name: Create Claude directory in the staging home
      ansible.builtin.file:
        path: "{{ herdr_claude_staging.path }}/.claude"
        state: directory
        mode: "0700"

    - name: Generate herdr Claude integration in the staging home
      ansible.builtin.command: "{{ herdr_binary }} integration install claude"
      environment:
        HOME: "{{ herdr_claude_staging.path }}"
      changed_when: false

    - name: Ensure Claude hooks directory exists
      ansible.builtin.file:
        path: "{{ herdr_user_home }}/.claude/hooks"
        state: directory
        owner: "{{ herdr_username }}"
        group: "{{ herdr_usergroup }}"
        mode: "0755"

    - name: Copy herdr Claude integration script
      ansible.builtin.copy:
        src: "{{ herdr_claude_staging.path }}/.claude/hooks/herdr-agent-state.sh"
        dest: "{{ herdr_user_home }}/.claude/hooks/herdr-agent-state.sh"
        remote_src: true
        owner: "{{ herdr_username }}"
        group: "{{ herdr_usergroup }}"
        mode: "0755"

  always:
    - name: Remove herdr integration staging home
      ansible.builtin.file:
        path: "{{ herdr_claude_staging.path }}"
        state: absent
      when: herdr_claude_staging.path is defined
