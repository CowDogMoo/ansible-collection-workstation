---
- name: Fail on unknown install method
  ansible.builtin.fail:
    msg: "herdr_install_method must be 'binary' or 'homebrew', got '{{ herdr_install_method }}'"
  when:
    - herdr_install | bool
    - herdr_install_method not in ['binary', 'homebrew']

- name: Install herdr with Homebrew
  community.general.homebrew:
    name: herdr
    state: present
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  become_user: "{{ herdr_username }}"
  when:
    - herdr_install | bool
    - herdr_install_method == 'homebrew'

# brew is often missing from a non-login PATH, so resolve the prefix with the
# standard Homebrew locations prepended and run herdr from it by absolute path.
- name: Resolve Homebrew prefix
  ansible.builtin.command: brew --prefix
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] | default('/usr/bin:/bin') }}"
  register: herdr_brew_prefix
  changed_when: false
  check_mode: false
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  become_user: "{{ herdr_username }}"
  when:
    - herdr_install | bool
    - herdr_install_method == 'homebrew'

- name: Install herdr release binary
  ansible.builtin.include_tasks: install-binary.yml
  when:
    - herdr_install | bool
    - herdr_install_method == 'binary'

# With herdr_install false, look for a binary installed some other way.
- name: Find an existing herdr binary
  ansible.builtin.shell: command -v herdr
  args:
    executable: /bin/sh
  environment:
    PATH: >-
      {{ herdr_install_dir }}:{{ herdr_user_home }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:{{
      ansible_facts['env']['PATH'] | default('/usr/bin:/bin') }}
  register: herdr_found_binary
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  become_user: "{{ herdr_username }}"
  when:
    - not (herdr_install | bool)
    - herdr_binary_path | length == 0

- name: Set herdr binary path
  ansible.builtin.set_fact:
    herdr_binary: >-
      {{ herdr_binary_path if herdr_binary_path | length > 0
         else (herdr_found_binary.stdout | default('') | trim) if not (herdr_install | bool) and (herdr_found_binary.stdout | default('') | trim | length > 0)
         else herdr_install_dir + '/herdr' if (not (herdr_install | bool) or herdr_install_method == 'binary')
         else herdr_brew_prefix.stdout + '/bin/herdr' }}
    herdr_install_in_home: "{{ herdr_install_dir.startswith(herdr_user_home) }}"

- name: Check herdr binary
  ansible.builtin.stat:
    path: "{{ herdr_binary }}"
  register: herdr_binary_stat

# Only a version query: never start, stop, or attach to a herdr server here.
- name: Verify herdr installation
  ansible.builtin.command: "{{ herdr_binary }} --version"
  register: herdr_version_output
  changed_when: false
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  become_user: "{{ herdr_username }}"
  when: (herdr_install | bool) or herdr_binary_stat.stat.exists

- name: Display herdr version
  ansible.builtin.debug:
    msg: "herdr installed: {{ herdr_version_output.stdout }}"
  when: herdr_version_output.stdout is defined

- name: Report missing herdr binary
  ansible.builtin.debug:
    msg: >-
      herdr_install is false and no herdr binary was found at {{ herdr_binary }};
      skipping the herder alias and agent integrations.
  when: not herdr_binary_stat.stat.exists

# Lives beside the release-binary install location, never inside the Homebrew prefix.
- name: Ensure herder alias directory exists
  ansible.builtin.file:
    path: "{{ herdr_install_dir }}"
    state: directory
    owner: "{{ herdr_install_in_home | ternary(herdr_username, omit) }}"
    group: "{{ herdr_install_in_home | ternary(herdr_usergroup, omit) }}"
    mode: "0755"
  become: "{{ herdr_username != ansible_facts['user_id'] or (not herdr_install_in_home and ansible_facts['user_id'] != 'root') }}"
  when:
    - herdr_create_herder_alias | bool
    - herdr_binary_stat.stat.exists

- name: Create herder symlink to herdr
  ansible.builtin.file:
    src: "{{ herdr_binary }}"
    dest: "{{ herdr_install_dir }}/herder"
    state: link
    owner: "{{ herdr_install_in_home | ternary(herdr_username, omit) }}"
    group: "{{ herdr_install_in_home | ternary(herdr_usergroup, omit) }}"
    # Own the link itself rather than following it to the binary.
    follow: false
    force: true
  become: "{{ herdr_username != ansible_facts['user_id'] or (not herdr_install_in_home and ansible_facts['user_id'] != 'root') }}"
  when:
    - herdr_create_herder_alias | bool
    - herdr_binary_stat.stat.exists

- name: Ensure herdr configuration directory exists
  ansible.builtin.file:
    path: "{{ herdr_config_dir }}"
    state: directory
    owner: "{{ herdr_username }}"
    group: "{{ herdr_usergroup }}"
    mode: "0755"
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  when: >-
    herdr_manage_config | bool or herdr_manage_helpers | bool or
    herdr_agent_detection_src_dir | length > 0

- name: Install herdr helper script dependencies
  ansible.builtin.package:
    name: "{{ herdr_helper_dependencies }}"
    state: present
  become: true
  when:
    - herdr_manage_helpers | bool
    - ansible_facts['os_family'] not in ['Darwin', 'Windows']
    - herdr_helper_dependencies | length > 0

- name: Deploy herdr helper scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ herdr_config_dir }}/{{ item }}"
    owner: "{{ herdr_username }}"
    group: "{{ herdr_usergroup }}"
    mode: "0755"
  loop:
    - cheatsheet.sh
    - rotate-split.sh
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  when: herdr_manage_helpers | bool

- name: Ensure herdr agent-detection directory exists
  ansible.builtin.file:
    path: "{{ herdr_config_dir }}/agent-detection"
    state: directory
    owner: "{{ herdr_username }}"
    group: "{{ herdr_usergroup }}"
    mode: "0755"
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  when: herdr_agent_detection_src_dir | length > 0

- name: Install custom herdr agent-detection overrides
  ansible.builtin.copy:
    src: "{{ herdr_agent_detection_src_dir | regex_replace('/+$', '') }}/"
    dest: "{{ herdr_config_dir }}/agent-detection/"
    owner: "{{ herdr_username }}"
    group: "{{ herdr_usergroup }}"
    directory_mode: "0755"
    mode: "0644"
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  when: herdr_agent_detection_src_dir | length > 0

- name: Render herdr config.toml
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ herdr_config_dir }}/config.toml"
    owner: "{{ herdr_username }}"
    group: "{{ herdr_usergroup }}"
    mode: "0644"
    backup: "{{ herdr_backup_config | bool }}"
  become: "{{ herdr_username != ansible_facts['user_id'] }}"
  when: herdr_manage_config | bool

- name: Install herdr agent integrations
  ansible.builtin.include_tasks: integrations.yml
  when:
    - herdr_integrations | length > 0
    - herdr_binary_stat.stat.exists
