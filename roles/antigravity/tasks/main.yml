---
- name: Set antigravity username for Kali systems
  ansible.builtin.set_fact:
    antigravity_username: "kali"
  when: ansible_facts['distribution_release'] == "kali-rolling" and antigravity_username is not defined

- name: Ensure antigravity user home directory exists
  ansible.builtin.stat:
    path: "{{ antigravity_user_home }}"
  register: antigravity_home_stat
  changed_when: false

- name: Fail if user home directory doesn't exist
  ansible.builtin.fail:
    msg: "User home directory {{ antigravity_user_home }} does not exist"
  when: not antigravity_home_stat.stat.exists

- name: Install Antigravity on macOS
  ansible.builtin.include_tasks: install-macos.yml
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - antigravity_install | bool

- name: Install Antigravity on Linux
  ansible.builtin.include_tasks: install-linux.yml
  when:
    - ansible_facts['os_family'] != 'Darwin'
    - ansible_facts['os_family'] != 'Windows'
    - antigravity_install | bool

- name: Install Antigravity on Windows
  ansible.builtin.include_tasks: install-windows.yml
  when:
    - ansible_facts['os_family'] == 'Windows'
    - antigravity_install | bool

# Created before the config dir so ~/.gemini itself ends up owned by the user rather
# than by whoever `become` resolved to when the nested path was auto-created.
- name: Create Antigravity home directory
  ansible.builtin.file:
    path: "{{ antigravity_rules_file | dirname }}"
    state: directory
    owner: "{{ antigravity_username }}"
    group: "{{ antigravity_usergroup }}"
    mode: "0755"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and antigravity_username != ansible_facts['user_id'] }}"

- name: Create Antigravity configuration directory
  ansible.builtin.file:
    path: "{{ antigravity_config_dir }}"
    state: directory
    owner: "{{ antigravity_username }}"
    group: "{{ antigravity_usergroup }}"
    mode: "0755"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and antigravity_username != ansible_facts['user_id'] }}"

- name: Install global GEMINI.md instructions
  ansible.builtin.copy:
    src: "{{ antigravity_rules_src if (antigravity_rules_content | default('') | length == 0) else omit }}"
    content: "{{ antigravity_rules_content if (antigravity_rules_content | default('') | length > 0) else omit }}"
    dest: "{{ antigravity_rules_file }}"
    owner: "{{ antigravity_username }}"
    group: "{{ antigravity_usergroup }}"
    mode: "0644"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and antigravity_username != ansible_facts['user_id'] }}"
  when:
    - antigravity_manage_settings | bool
    - (antigravity_rules_src | default('') | length > 0) or (antigravity_rules_content | default('') | length > 0)

- name: Create Antigravity rules directory
  ansible.builtin.file:
    path: "{{ antigravity_rules_dir }}"
    state: directory
    owner: "{{ antigravity_username }}"
    group: "{{ antigravity_usergroup }}"
    mode: "0755"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and antigravity_username != ansible_facts['user_id'] }}"
  when: antigravity_manage_rules | bool

- name: Install Antigravity rules
  ansible.builtin.copy:
    src: "{{ antigravity_rules_src_dir | regex_replace('/+$', '') }}/"
    dest: "{{ antigravity_rules_dir }}/"
    owner: "{{ antigravity_username }}"
    group: "{{ antigravity_usergroup }}"
    directory_mode: "0755"
    mode: "0644"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and antigravity_username != ansible_facts['user_id'] }}"
  when:
    - antigravity_manage_rules | bool
    - antigravity_rules_src_dir | default('') | length > 0

- name: Check if hooks.json will change (dry-run)
  ansible.builtin.template:
    src: hooks.json.j2
    dest: "{{ antigravity_hooks_file }}"
    owner: "{{ antigravity_username }}"
    group: "{{ antigravity_usergroup }}"
    mode: "0644"
  check_mode: true
  become: "{{ ansible_facts['os_family'] != 'Darwin' and antigravity_username != ansible_facts['user_id'] }}"
  when: antigravity_manage_hooks | bool
  register: antigravity_hooks_check
  changed_when: false
  diff: false

- name: Create backup of existing hooks.json in /tmp
  ansible.builtin.copy:
    src: "{{ antigravity_hooks_file }}"
    dest: "/tmp/hooks.json.{{ ansible_facts['date_time']['iso8601_basic_short'] }}.backup"
    owner: "{{ antigravity_username }}"
    group: "{{ antigravity_usergroup }}"
    mode: "0644"
    remote_src: true
  become: "{{ ansible_facts['os_family'] != 'Darwin' and antigravity_username != ansible_facts['user_id'] }}"
  when:
    - antigravity_manage_hooks | bool
    - antigravity_backup_settings | bool
    - antigravity_hooks_check is changed
  register: antigravity_backup_result

- name: Generate Antigravity hooks.json
  ansible.builtin.template:
    src: hooks.json.j2
    dest: "{{ antigravity_hooks_file }}"
    owner: "{{ antigravity_username }}"
    group: "{{ antigravity_usergroup }}"
    mode: "0644"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and antigravity_username != ansible_facts['user_id'] }}"
  when: antigravity_manage_hooks | bool
  register: antigravity_hooks_result

- name: Manage MCP servers
  ansible.builtin.include_tasks: manage-mcp-servers.yml
  when:
    - antigravity_manage_mcp_servers | bool
    - antigravity_mcp_servers | length > 0

- name: Manage plugins
  ansible.builtin.include_tasks: manage-plugins.yml
  when:
    - antigravity_manage_plugins | bool
    - antigravity_plugins | length > 0

- name: Display configuration status
  ansible.builtin.debug:
    msg: >-
      Config Dir: {{ antigravity_config_dir }} |
      Hooks: {{ antigravity_hooks | length }}
      {% if antigravity_backup_result.dest is defined %}| Backup: {{ antigravity_backup_result.dest }}{% endif %}
      | MCP Servers: {{ antigravity_mcp_servers | length }}
      | Plugins: {{ antigravity_plugins | length }}
