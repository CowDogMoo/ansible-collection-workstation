---
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    container_user: "{{ ansible_facts['distribution'] | lower }}"
    container_home: "/home/{{ container_user }}"
  tasks:
    - name: Set home directory and config facts
      ansible.builtin.set_fact:
        antigravity_user_home: "{{ container_home }}"
        antigravity_config_dir: "{{ container_home }}/.gemini/config"
        antigravity_username: "{{ container_user }}"
        antigravity_hooks_file: "{{ container_home }}/.gemini/config/hooks.json"
        antigravity_mcp_config_file: "{{ container_home }}/.gemini/config/mcp_config.json"
        antigravity_rules_file: "{{ container_home }}/.gemini/GEMINI.md"
        antigravity_rules_dir: "{{ container_home }}/.gemini/config/rules"
        antigravity_scripts_dir: "{{ container_home }}/.gemini/config/scripts"

    - name: Include default variables
      ansible.builtin.include_vars:
        file: "../../defaults/main.yml"

    - name: Check if agy binary is in PATH
      ansible.builtin.command: which agy
      environment:
        PATH: "{{ antigravity_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      register: antigravity_which_check
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Debug agy location
      ansible.builtin.debug:
        msg: "Agy found at: {{ antigravity_which_check.stdout }}"
      when: antigravity_which_check.rc == 0

    - name: Assert agy is installed
      ansible.builtin.assert:
        that:
          - antigravity_which_check.rc == 0
          - antigravity_which_check.stdout | length > 0
        fail_msg: "Antigravity CLI is not installed or not in PATH"
        success_msg: "Antigravity CLI is installed at: {{ antigravity_which_check.stdout }}"

    - name: Test agy command
      ansible.builtin.command: agy --version
      environment:
        PATH: "{{ antigravity_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      register: antigravity_version_output
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Assert agy command works
      ansible.builtin.assert:
        that:
          - antigravity_version_output.rc == 0
          - >
            ('agy' in antigravity_version_output.stdout.lower()) or
            (antigravity_version_output.stdout | regex_search('v?[0-9]+\.[0-9]+\.[0-9]+') is not none)
        fail_msg: "Agy command failed or version output not recognized. Output was: {{ antigravity_version_output.stdout }}"
        success_msg: "Agy command works, version: {{ antigravity_version_output.stdout }}"

    - name: Check if agy config directory exists
      ansible.builtin.stat:
        path: "{{ antigravity_config_dir }}"
      register: antigravity_config_dir_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert agy config directory exists
      ansible.builtin.assert:
        that:
          - antigravity_config_dir_stat.stat.exists
          - antigravity_config_dir_stat.stat.isdir
          - antigravity_config_dir_stat.stat.mode == '0755'
        fail_msg: "Agy config directory does not exist or has wrong permissions"
        success_msg: "Agy config directory exists with correct permissions"

    - name: Check if GEMINI.md exists
      ansible.builtin.stat:
        path: "{{ antigravity_rules_file }}"
      register: antigravity_agy_md_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert GEMINI.md exists with correct permissions
      ansible.builtin.assert:
        that:
          - antigravity_agy_md_stat.stat.exists
          - antigravity_agy_md_stat.stat.mode == '0644'
          - antigravity_agy_md_stat.stat.pw_name == container_user
        fail_msg: "GEMINI.md does not exist or has wrong permissions/ownership"
        success_msg: "GEMINI.md exists with correct permissions and ownership"

    # Global rules belong in ~/.gemini, not the customization root — assert the old
    # location stays empty so a regression back to AGENTS.md is caught.
    - name: Check that the legacy AGENTS.md location is unused
      ansible.builtin.stat:
        path: "{{ antigravity_config_dir }}/AGENTS.md"
      register: antigravity_legacy_md_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert legacy AGENTS.md was not written
      ansible.builtin.assert:
        that:
          - not antigravity_legacy_md_stat.stat.exists
        fail_msg: "Rules were written to the legacy {{ antigravity_config_dir }}/AGENTS.md path"
        success_msg: "Rules live only at {{ antigravity_rules_file }}"

    - name: Read GEMINI.md content
      ansible.builtin.slurp:
        path: "{{ antigravity_rules_file }}"
      register: antigravity_agy_md_content
      become: true
      become_user: "{{ container_user }}"

    - name: Assert GEMINI.md contains expected content
      ansible.builtin.assert:
        that:
          - "'Global Antigravity Instructions' in (antigravity_agy_md_content['content'] | b64decode)"
          - "'.gemini Directory and Version Control' in (antigravity_agy_md_content['content'] | b64decode)"
          - "'oauth_creds.json' in (antigravity_agy_md_content['content'] | b64decode)"
        fail_msg: "GEMINI.md does not contain expected instructions"
        success_msg: "GEMINI.md contains all expected global instructions"

    - name: Check if rules directory exists
      ansible.builtin.stat:
        path: "{{ antigravity_rules_dir }}"
      register: antigravity_rules_dir_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert rules directory exists with correct permissions
      ansible.builtin.assert:
        that:
          - antigravity_rules_dir_stat.stat.exists
          - antigravity_rules_dir_stat.stat.isdir
          - antigravity_rules_dir_stat.stat.mode == '0755'
        fail_msg: "Rules directory does not exist or has wrong permissions"
        success_msg: "Rules directory exists with correct permissions"

    - name: Check bundled synthetic fixtures and mocks rule
      ansible.builtin.stat:
        path: "{{ antigravity_rules_dir }}/synthetic_fixtures_and_mocks.md"
      register: antigravity_bundled_rule_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert bundled synthetic fixtures rule is deployed with correct ownership
      ansible.builtin.assert:
        that:
          - antigravity_bundled_rule_stat.stat.exists
          - antigravity_bundled_rule_stat.stat.isreg
          - antigravity_bundled_rule_stat.stat.mode == '0644'
          - antigravity_bundled_rule_stat.stat.pw_name == container_user
        fail_msg: "Bundled synthetic_fixtures_and_mocks.md rule is missing or has wrong mode/owner"
        success_msg: "Bundled synthetic fixtures rule deployed with mode 0644"

    - name: Read bundled synthetic fixtures rule
      ansible.builtin.slurp:
        src: "{{ antigravity_rules_dir }}/synthetic_fixtures_and_mocks.md"
      register: antigravity_bundled_rule_content
      become: true
      become_user: "{{ container_user }}"

    - name: Assert bundled synthetic fixtures rule content
      ansible.builtin.assert:
        that:
          - "antigravity_bundled_rule_text is match('---\\ntrigger: always_on\\n')"
          - "'Placeholder Infrastructure Identifiers' in antigravity_bundled_rule_text"
          - "'Fictional Mock Names Over Mock-Prefixed Real Names' in antigravity_bundled_rule_text"
          - "'Acme Widget Database' in antigravity_bundled_rule_text"
        fail_msg: "Bundled synthetic fixtures rule is missing its always_on frontmatter or required sections"
        success_msg: "Bundled synthetic fixtures rule has always_on frontmatter and both sections"
      vars:
        antigravity_bundled_rule_text: "{{ antigravity_bundled_rule_content['content'] | b64decode }}"

    - name: Check if scripts directory exists
      ansible.builtin.stat:
        path: "{{ antigravity_scripts_dir }}"
      register: antigravity_scripts_dir_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert scripts directory exists with correct permissions
      ansible.builtin.assert:
        that:
          - antigravity_scripts_dir_stat.stat.exists
          - antigravity_scripts_dir_stat.stat.isdir
          - antigravity_scripts_dir_stat.stat.mode == '0755'
        fail_msg: "Scripts directory does not exist or has wrong permissions"
        success_msg: "Scripts directory exists with correct permissions"


    - name: Check if hooks.json exists
      ansible.builtin.stat:
        path: "{{ antigravity_hooks_file }}"
      register: antigravity_hooks_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert hooks.json exists with correct permissions
      ansible.builtin.assert:
        that:
          - antigravity_hooks_stat.stat.exists
          - antigravity_hooks_stat.stat.mode == '0644'
          - antigravity_hooks_stat.stat.pw_name == container_user
        fail_msg: "hooks.json does not exist or has wrong permissions/ownership"
        success_msg: "hooks.json exists with correct permissions and ownership"

    # converge renders the same hooks on every run, so nothing should be backed up
    # Match by name so unrelated files in the directory do not count
    - name: Find hooks.json backups in the idempotent config dir
      ansible.builtin.find:
        paths: "{{ antigravity_config_dir }}/backups"
        patterns: "hooks.json.*"
      register: antigravity_idempotent_backups
      become: true

    - name: Assert idempotent runs took no hooks.json backup
      ansible.builtin.assert:
        that:
          - antigravity_idempotent_backups.matched == 0
        fail_msg: "hooks.json was backed up although no run changed it"
        success_msg: "Idempotent runs leave no hooks.json backup"

    # side_effect.yml rendered v1 twice, then v2, v3 and v4 with a retention of 2
    - name: Find hooks.json backups from the side effect runs
      ansible.builtin.find:
        paths: "{{ container_home }}/.gemini/config-backup/backups"
        patterns: "hooks.json.*"
      register: antigravity_backup_files
      become: true

    - name: Read the surviving hooks.json backups
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ antigravity_backup_files.files | map(attribute='path') | sort }}"
      register: antigravity_backup_contents
      become: true

    - name: Assert hooks.json was backed up on each change and pruned to the limit
      ansible.builtin.assert:
        that:
          - antigravity_backup_files.matched == 2
          - antigravity_backup_files.files | map(attribute='mode') | unique == ['0600']
          - antigravity_backup_files.files | map(attribute='pw_name') | unique == [container_user]
          - "'backup-marker-v2' in (antigravity_backup_contents.results[0].content | b64decode)"
          - "'backup-marker-v3' in (antigravity_backup_contents.results[1].content | b64decode)"
        fail_msg: >-
          Expected the two newest backups (v2, v3) with mode 0600, found
          {{ antigravity_backup_files.files | map(attribute='path') | list }}
        success_msg: "Each hooks.json change was backed up and older backups were pruned"

    - name: Read hooks.json
      ansible.builtin.slurp:
        path: "{{ antigravity_hooks_file }}"
      register: antigravity_hooks_raw
      become: true
      become_user: "{{ container_user }}"

    - name: Parse hooks.json
      ansible.builtin.set_fact:
        antigravity_hooks_parsed: "{{ antigravity_hooks_raw['content'] | b64decode | from_json }}"

    # Antigravity keys hooks.json by hook name, and the entry shape differs per event:
    # PreToolUse groups handlers under a tool matcher, Stop takes a flat handler list.
    - name: Assert hooks.json has the expected structure
      ansible.builtin.assert:
        that:
          - "'forbidden_content' in antigravity_hooks_parsed"
          - "'dangerous_flags' in antigravity_hooks_parsed"
          - "'post_commit_check' in antigravity_hooks_parsed"
          - "'stop_sound' in antigravity_hooks_parsed"
          - "'PreToolUse' in antigravity_hooks_parsed['forbidden_content']"
          - antigravity_hooks_parsed['forbidden_content']['PreToolUse'][0]['matcher'] == 'run_command'
          - antigravity_hooks_parsed['forbidden_content']['PreToolUse'][0]['hooks'][0]['type'] == 'command'
          - "'Stop' in antigravity_hooks_parsed['stop_sound']"
          - "'matcher' not in antigravity_hooks_parsed['stop_sound']['Stop'][0]"
          - antigravity_hooks_parsed['stop_sound']['Stop'][0]['command'] == 'true'
        fail_msg: "hooks.json structure is wrong: {{ antigravity_hooks_parsed }}"
        success_msg: "hooks.json has correct per-event shapes and the override was applied"

    # Hooks signal decisions through stdout JSON, so a hook that emits nothing parseable
    # is silently inert in production. Run the real command to prove it blocks.
    - name: Run forbidden_content hook against a violating command
      ansible.builtin.command:
        cmd: "{{ antigravity_hooks_parsed['forbidden_content']['PreToolUse'][0]['hooks'][0]['command'] }}"
        stdin: "{{ hook_payload | to_json }}"
      vars:
        hook_payload:
          toolCall:
            name: run_command
            args:
              CommandLine: 'git commit -m "x{{ trailer }}"'
        trailer: "\n\nCo-Authored-By: Claude <noreply@anthropic.com>"
      register: antigravity_hook_deny
      changed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Assert forbidden_content hook denies branded commits
      ansible.builtin.assert:
        that:
          - (antigravity_hook_deny.stdout | from_json)['decision'] == 'deny'
        fail_msg: "forbidden_content hook failed to deny: {{ antigravity_hook_deny.stdout }}"
        success_msg: "forbidden_content hook denies branded commits"

    - name: Run forbidden_content hook against a clean command
      ansible.builtin.command:
        cmd: "{{ antigravity_hooks_parsed['forbidden_content']['PreToolUse'][0]['hooks'][0]['command'] }}"
        stdin: "{{ hook_payload | to_json }}"
      vars:
        hook_payload:
          toolCall:
            name: run_command
            args:
              CommandLine: "squad_commit"
      register: antigravity_hook_allow
      changed_when: false
      become: true
      become_user: "{{ container_user }}"

    # Antigravity PreToolUse hooks fail closed on empty JSON ({}), so non-matching
    # commands must emit {"decision": "allow"}.
    - name: Assert forbidden_content hook allows clean commands
      ansible.builtin.assert:
        that:
          - (antigravity_hook_allow.stdout | from_json)['decision'] == 'allow'
        fail_msg: "forbidden_content hook failed to allow: {{ antigravity_hook_allow.stdout }}"
        success_msg: "forbidden_content hook allows clean commands"

    # forbidden_content: commits and PR titles/bodies come only from squad_commit and
    # squad_pr. Probes the deployed hook; the full matrix, the merge-conclusion
    # exemption, and the gaps left open on purpose live in .hooks/test-squad-only.py,
    # which runs both this copy and the claude_code one through the same cases.
    - name: Probe the squad-only rule with commit, PR, and read-only commands
      ansible.builtin.command:
        cmd: "{{ antigravity_hooks_parsed['forbidden_content']['PreToolUse'][0]['hooks'][0]['command'] }}"
        stdin: "{{ {'toolCall': {'name': 'run_command', 'args': {'CommandLine': item.cmd, 'Cwd': '/tmp'}}} | to_json }}"
      loop:
        - {cmd: "git commit -m 'fix: thing'", want: deny}
        - {cmd: "git commit -F -", want: deny}
        - {cmd: "git commit --amend --no-edit", want: deny}
        - {cmd: "gh pr create --title x --body 'hand-written'", want: deny}
        - {cmd: "gh pr edit 12 --body 'hand-written'", want: deny}
        - {cmd: "gh-axi pr edit 12 --title x", want: deny}
        - {cmd: "gh pr merge 12 --squash --subject x --body y", want: deny}
        - {cmd: "git merge -m 'hand text' feature", want: deny}
        - {cmd: "git revert --no-edit HEAD", want: deny}
        - {cmd: "gh api -X PATCH repos/o/r/pulls/12 -f body=y", want: deny}
        - {cmd: "squad_commit", want: allow}
        - {cmd: "squad_pr", want: allow}
        - {cmd: "git revert -n HEAD", want: allow}
        - {cmd: "git merge --no-edit origin/main", want: allow}
        - {cmd: "git status --short && git log --oneline -n 5", want: allow}
        - {cmd: "gh pr view 12 --json title,body && gh pr checks 12", want: allow}
      loop_control:
        label: "{{ item.cmd }}"
      register: antigravity_squad_only_probe
      changed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Assert the squad-only rule denies hand-written commits and PR text only
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json)['decision'] == item.item.want
          - item.item.want == 'allow' or 'squad_commit or squad_pr' in (item.stdout | from_json)['reason']
        fail_msg: "squad-only rule misjudged {{ item.item.cmd }}: {{ item.stdout }}"
        success_msg: "{{ item.item.want }}: {{ item.item.cmd }}"
      loop: "{{ antigravity_squad_only_probe.results }}"
      loop_control:
        label: "{{ item.item.cmd }}"

    - name: Check if mcp_config.json exists
      ansible.builtin.stat:
        path: "{{ antigravity_mcp_config_file }}"
      register: antigravity_mcp_stat
      become: true
      become_user: "{{ container_user }}"

    # 0600 because resolved OP_LOOKUP secrets land in this file.
    - name: Assert mcp_config.json exists with restrictive permissions
      ansible.builtin.assert:
        that:
          - antigravity_mcp_stat.stat.exists
          - antigravity_mcp_stat.stat.mode == '0600'
          - antigravity_mcp_stat.stat.pw_name == container_user
        fail_msg: "mcp_config.json missing or has wrong permissions (expected 0600)"
        success_msg: "mcp_config.json exists with 0600 permissions"

    - name: Read mcp_config.json
      ansible.builtin.slurp:
        path: "{{ antigravity_mcp_config_file }}"
      register: antigravity_mcp_raw
      become: true
      become_user: "{{ container_user }}"

    - name: Parse mcp_config.json
      ansible.builtin.set_fact:
        antigravity_mcp_parsed: "{{ antigravity_mcp_raw['content'] | b64decode | from_json }}"

    - name: Assert MCP servers were written and selectively removed
      ansible.builtin.assert:
        that:
          - "'mcpServers' in antigravity_mcp_parsed"
          - "'chrome-devtools' in antigravity_mcp_parsed['mcpServers']"
          - antigravity_mcp_parsed['mcpServers']['chrome-devtools']['command'] == 'npx'
          - "'chrome-devtools-mcp@latest' in antigravity_mcp_parsed['mcpServers']['chrome-devtools']['args']"
          - "'doomed' not in antigravity_mcp_parsed['mcpServers']"
        fail_msg: >-
          MCP config wrong. 'doomed' should have been removed by side_effect while
          'chrome-devtools' survived: {{ antigravity_mcp_parsed }}
        success_msg: "MCP servers written correctly and 'doomed' removed (state: absent verified)"

    - name: Verify plugin list after side_effect removal  # noqa: var-naming[no-role-prefix]
      ansible.builtin.command:
        cmd: agy plugin list
      environment:
        HOME: "{{ antigravity_user_home }}"
        PATH: "{{ antigravity_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      register: plugin_list_result
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Display plugin list output for debugging
      ansible.builtin.debug:
        var: plugin_list_result.stdout

    - name: Assert plugin was removed by side_effect
      ansible.builtin.assert:
        that:
          - "'chrome-devtools' not in plugin_list_result.stdout"
        fail_msg: "Plugin 'chrome-devtools' should have been removed by side_effect: {{ plugin_list_result.stdout }}"
        success_msg: "Plugin 'chrome-devtools' was successfully removed (state: absent verified)"
