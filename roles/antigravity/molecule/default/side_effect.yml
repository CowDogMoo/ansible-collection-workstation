---
# side_effect.yml - Tests non-idempotent scenarios: plugin and MCP server removal
- name: Side Effect - Test plugin and MCP server removal
  hosts: all
  tasks:
    - name: Set container variables based on distribution  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        container_user: "{{ ansible_facts['distribution'] | lower }}"

    - name: Set container home  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        container_home: "/home/{{ container_user }}"

    - name: Ensure test user and home directory exist
      ansible.builtin.user:
        name: "{{ container_user }}"
        shell: /bin/bash
        create_home: true
        home: "{{ container_home }}"
      become: true

    - name: Set home directory fact  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        ansible_env:
          HOME: "{{ container_home }}"

    - name: Include default variables
      ansible.builtin.include_vars:
        file: "../../defaults/main.yml"

    # Test plugin and MCP server removal (state: absent). chrome-devtools stays in the
    # MCP list so verify.yml can prove removal is selective rather than a wholesale rewrite.
    - name: Test plugin and MCP server removal
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.antigravity
      vars:
        antigravity_username: "{{ container_user }}"
        antigravity_user_home: "{{ container_home }}"
        antigravity_config_dir: "{{ container_home }}/.gemini/config"
        antigravity_manage_settings: false
        antigravity_manage_hooks: false
        antigravity_mcp_servers:
          - name: chrome-devtools
            command: npx
            args:
              - "-y"
              - "chrome-devtools-mcp@latest"
          - name: doomed
            command: /bin/true
            state: absent
        antigravity_plugins:
          - name: chrome-devtools
            target: chrome-devtools-mcp@latest
            state: absent

    - name: Verify plugin was removed  # noqa: var-naming[no-role-prefix]
      ansible.builtin.command:
        cmd: agy plugin list
      environment:
        HOME: "{{ container_home }}"
        PATH: "{{ container_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      register: plugin_list_result
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Assert plugin was removed
      ansible.builtin.assert:
        that:
          - "'chrome-devtools' not in plugin_list_result.stdout"
        fail_msg: "Plugin 'chrome-devtools' should have been removed but found in: {{ plugin_list_result.stdout }}"
        success_msg: "Plugin 'chrome-devtools' was successfully removed (state: absent works)"

    # Back up hooks.json only when a run changes it. The same hooks twice must
    # leave no backup; three changes with a retention of 2 must leave the two
    # newest. verify.yml checks the surviving copies.
    - name: Render hooks.json twice with the same hooks
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.antigravity
      vars:
        antigravity_username: "{{ container_user }}"
        antigravity_user_home: "{{ container_home }}"
        antigravity_config_dir: "{{ container_home }}/.gemini/config-backup"
        antigravity_install: false
        antigravity_manage_mcp_servers: false
        antigravity_manage_plugins: false
        antigravity_hooks_backup_keep: 2
        antigravity_hooks_overrides:
          stop_sound:
            command: "echo backup-marker-{{ antigravity_backup_version }}"
      loop:
        - v1
        - v1
      loop_control:
        loop_var: antigravity_backup_version

    - name: Check for a backup directory after unchanged runs
      ansible.builtin.stat:
        path: "{{ container_home }}/.gemini/config-backup/backups"
      register: antigravity_unchanged_backup_dir
      become: true

    - name: Assert unchanged runs took no backup
      ansible.builtin.assert:
        that:
          - not antigravity_unchanged_backup_dir.stat.exists
        fail_msg: "A run that left hooks.json unchanged still created a backup"
        success_msg: "Unchanged runs leave no backup behind"

    - name: Render hooks.json with changing hooks
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.antigravity
      vars:
        antigravity_username: "{{ container_user }}"
        antigravity_user_home: "{{ container_home }}"
        antigravity_config_dir: "{{ container_home }}/.gemini/config-backup"
        antigravity_install: false
        antigravity_manage_mcp_servers: false
        antigravity_manage_plugins: false
        antigravity_hooks_backup_keep: 2
        antigravity_hooks_overrides:
          stop_sound:
            command: "echo backup-marker-{{ antigravity_backup_version }}"
      loop:
        - v2
        - v3
        - v4
      loop_control:
        loop_var: antigravity_backup_version

    # Topic-scoped rule files without valid YAML frontmatter (trigger: always_on,
    # model_decision, glob, or manual) cause Antigravity to log
    # CORTEX_MEMORY_TRIGGER_UNSPECIFIED and skip the rule. Prove validate-rules.yml
    # catches a rule missing frontmatter.
    - name: Create an isolated rules directory with an invalid rule file
      ansible.builtin.file:
        path: "{{ container_home }}/.gemini/config-invalid-rules/rules"
        state: directory
        owner: "{{ container_user }}"
        group: "{{ container_user }}"
        mode: "0755"
      become: true

    - name: Write a rule file without YAML frontmatter
      ansible.builtin.copy:
        content: |
          # Missing Frontmatter Rule
          - This rule lacks a trigger frontmatter block.
        dest: "{{ container_home }}/.gemini/config-invalid-rules/rules/unframed.md"
        owner: "{{ container_user }}"
        group: "{{ container_user }}"
        mode: "0644"
      become: true

    - name: Verify validate-rules.yml rejects rule files missing YAML frontmatter
      block:
        - name: Run rule frontmatter validation against the invalid rules directory
          ansible.builtin.include_tasks: "../../tasks/validate-rules.yml"
          vars:
            antigravity_username: "{{ container_user }}"
            antigravity_rules_dir: "{{ container_home }}/.gemini/config-invalid-rules/rules"

        - name: Record unexpected validation pass  # noqa: var-naming[no-role-prefix]
          ansible.builtin.set_fact:
            antigravity_invalid_rule_rejected: false
      rescue:
        - name: Record expected validation failure  # noqa: var-naming[no-role-prefix]
          ansible.builtin.set_fact:
            antigravity_invalid_rule_rejected: true

    - name: Assert rule frontmatter validation rejected the unframed rule
      ansible.builtin.assert:
        that:
          - antigravity_invalid_rule_rejected | default(false) | bool
        fail_msg: "validate-rules.yml did not reject a rule file missing YAML frontmatter"
        success_msg: "validate-rules.yml rejected the rule file missing YAML frontmatter"
