---
antigravity_username: "{{ ansible_facts['user_id'] | default(ansible_facts['user']) }}"
antigravity_usergroup: "{{ (ansible_facts['user_gid'] | default('staff')) if ansible_facts['os_family'] == 'Darwin' else antigravity_username }}"
antigravity_user_home: >-
  {{ (ansible_facts['user_dir'] | default(ansible_facts['env']['HOME']))
     if (antigravity_username == (ansible_facts['user_id'] | default(ansible_facts['user']) | default('')))
     else ((ansible_facts['os_family'] == 'Darwin') | ternary('/Users/' + antigravity_username,
           (antigravity_username == 'root') | ternary('/root', '/home/' + antigravity_username))) }}

# Configuration directory for Agy
antigravity_config_dir: "{{ antigravity_user_home }}/.gemini/config"

# Global rules file. Sits in ~/.gemini rather than the customization root: GEMINI.md is
# the only globally-scoped rules path Google documents.
antigravity_rules_file: "{{ antigravity_user_home }}/.gemini/GEMINI.md"

# Source file for global GEMINI.md instructions.
# Defaults to GEMINI.md from the role's files/ directory.
# Point to a custom path (e.g. `{{ playbook_dir }}/files/GEMINI.md`) or set
# `antigravity_rules_content` to supply custom instructions per-host or from a private playbook.
antigravity_rules_src: "GEMINI.md"

# Optional raw content for global GEMINI.md instructions.
# If non-empty, this takes precedence over antigravity_rules_src.
antigravity_rules_content: ""

# Rules directory for topic-scoped rules. Unlike ~/.gemini/GEMINI.md (plain Markdown),
# every .md file here must begin with a YAML frontmatter block declaring `trigger`
# (always_on, model_decision, glob, or manual), plus `description` for model_decision
# or `globs` for glob.
antigravity_rules_dir: "{{ antigravity_config_dir }}/rules"

# Source directory for topic-scoped rules (optional)
# Can be a path relative to playbook files/ or an absolute path on controller
antigravity_rules_src_dir: ""

# Scripts directory for custom hook scripts and executables
antigravity_scripts_dir: "{{ antigravity_config_dir }}/scripts"

# Source directory for custom hook scripts (optional)
# Can be a path relative to playbook files/ or an absolute path on controller
antigravity_scripts_src_dir: ""

# Optional source file for custom hooks.json.
# If non-empty, this file is installed directly instead of generating from templates/hooks.json.j2.
antigravity_hooks_src: ""

# Unlike Claude Code — which nests hooks inside ~/.claude/settings.json — Antigravity
# reads hooks from a dedicated file in the customization root. Versions of agy before
# 1.0.8 wrote this to ~/.gemini/antigravity-cli/hooks.json via the /hooks command;
# writing the shared path directly is correct on every version.
antigravity_hooks_file: "{{ antigravity_config_dir }}/hooks.json"

# MCP servers are shared by the CLI, the IDE, and Antigravity 2.0.
antigravity_mcp_config_file: "{{ antigravity_config_dir }}/mcp_config.json"

# Homebrew prefix (varies by OS/architecture)
antigravity_homebrew_prefix: >-
  {{ (ansible_facts['os_family'] == 'Darwin') | ternary(
       (ansible_facts['architecture'] == 'arm64') | ternary('/opt/homebrew', '/usr/local'),
       '/home/linuxbrew/.linuxbrew') }}

# PATH for agy CLI commands
antigravity_path: "{{ antigravity_homebrew_prefix }}/bin:{{ antigravity_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

# Whether to install Antigravity CLI
antigravity_install: true

# Whether to manage Agy settings
antigravity_manage_settings: true

# Whether to manage topic-scoped rule files
antigravity_manage_rules: true

# Whether to install the generic rule files bundled with this role (files/rules/).
# They are copied before antigravity_rules_src_dir, so a same-named file from
# antigravity_rules_src_dir overrides the bundled version.
antigravity_install_bundled_rules: true

# Whether to manage custom scripts directory
antigravity_manage_scripts: true

# Whether to manage hooks
antigravity_manage_hooks: true

# Whether to back up hooks.json before the role rewrites it. A backup is only
# taken when the file exists and the run would change it, so idempotent runs
# leave no new copies behind.
antigravity_backup_settings: true

# Where hooks.json backups go, named hooks.json.<UTC timestamp>
antigravity_hooks_backup_dir: "{{ antigravity_config_dir }}/backups"

# Number of hooks.json backups to keep; older ones are pruned (0 keeps all)
antigravity_hooks_backup_keep: 10

# Plugin Management
antigravity_manage_plugins: true  # Whether to manage plugins

# List of plugins to install
# Each plugin supports: name, target, state
antigravity_plugins: []
# Example:
#   - name: python_debugger
#     target: python_debugger@latest
#     state: present

# Hooks — custom shell/Python commands bound to agent lifecycle events.
#
# Antigravity's hooks.json is keyed by hook name, which lines up with the dict-keyed
# layout used here: each key below becomes a top-level entry in the generated file.
# Consumers override individual hooks via `antigravity_hooks_overrides` using the same
# key, no copy-paste needed:
#
#     antigravity_hooks_overrides:
#       stop_sound:
#         command: 'afplay "$HOME/Jobs Done.mp3"'
#
# To remove a default hook entirely on a specific host, set its value to `null`.
# To add a host-specific hook, give it a new key.
#
# Supported events: PreToolUse, PostToolUse, PreInvocation, PostInvocation, Stop.
# There is no Notification event, so Claude Code's `notify_sound` has no counterpart.
#
# Tool matchers use Antigravity's own tool names — `run_command`, `view_file`,
# `write_to_file`, `replace_file_content`, `grep_search`, `find_by_name` — not Claude's
# `Bash`/`Read`/`Write`. A matcher is a regex; "" or "*" matches every tool.
#
# Hooks communicate by writing JSON to stdout, not via exit codes. A PreToolUse hook
# blocks with {"decision": "deny", "reason": "..."} or permits with {"decision": "allow"}.
# Antigravity PreToolUse hooks fail closed on empty JSON ({}), so non-matching commands must
# emit {"decision": "allow"}. A Stop hook keeps the agent running with
# {"decision": "continue", "reason": "..."} and the reason is injected as a system
# message.
antigravity_hooks_default:

  # forbidden_content: Commits and pull request text come from squad, full stop.
  #
  # Denies:
  #   - `git commit` (`--amend` included) and `git commit-tree`
  #   - `git merge -m/--message/-F/--file/-e/--edit`
  #   - `git rebase -x/--exec`
  #   - `git revert` and `git cherry-pick` without `-n/--no-commit`, and with `-e/--edit`
  #   - `gh pr create`, `gh pr edit --title/--body/--body-file`, and
  #     `gh pr merge --subject/--body/--body-file`, the same through gh-axi
  #   - `gh api` POST/PATCH/PUT to a pulls endpoint, a PUT to a pull's merge endpoint
  #     with commit_title/commit_message, and a GraphQL mutation that creates or
  #     updates a pull request or carries a commitHeadline/commitBody
  #
  # Allowed: `squad_commit` and `squad_pr` (the hook only sees the literal command,
  # never the git and gh calls those functions make inside), read-only commands,
  # plain `git merge`/`git pull` and `git merge --no-edit` (git's own message),
  # `git rebase`/`git revert`/`git cherry-pick` --continue/--skip/--abort/--quit,
  # `git revert -n` and `git cherry-pick -n` followed by squad_commit, and
  # `git commit --no-edit` while a merge is in progress: it concludes the merge with
  # git's own message and is the command no-mistakes gives its agent to finish a
  # merge-strategy conflict.
  #
  # The detector is the same code as the claude_code role's forbidden_content hook; only
  # the wire contract differs (toolCall.args in, a JSON decision on stdout out). Keep the
  # two in step: .hooks/tests/test-squad-only.py runs one matrix against both copies.
  #
  # It also blocks forbidden attribution text in the other write commands it can
  # see. Like dangerous_flags it parses the command into clauses and looks one level
  # into eval and `sh -c`, and it skips heredoc bodies, so searching for or
  # documenting these commands is left alone. Out of scope, as anything built to
  # slip past it is: git aliases, command substitution, deeper nesting, scripts
  # (heredocs fed to a shell included), and API clients other than gh.
  # `post_commit_check` still reads back what squad produced.
  forbidden_content:
    event: PreToolUse
    matcher: run_command
    command: |
      python3 -c "
      import json, os, re, shlex, subprocess, sys

      data = json.load(sys.stdin)
      args = data.get('toolCall', {}).get('args', {})
      # run_command exposes the shell string as CommandLine and its directory as Cwd; the
      # fallbacks keep the hook working if a future agy release renames or lowercases them.
      cmd = args.get('CommandLine') or args.get('commandLine') or args.get('command') or ''
      paths = data.get('workspacePaths') or []
      cwd = args.get('Cwd') or args.get('cwd') or (paths[0] if paths else os.getcwd())

      SQUAD_ONLY = ('squad_commit', 'squad_pr')
      SHELLS = ('bash', 'sh', 'zsh', 'dash', 'ksh')
      SEPARATORS = '&|;()<>'
      GIT_OPTS_WITH_ARG = ('-C', '-c', '--git-dir', '--work-tree', '--namespace', '--super-prefix', '--config-env')
      PR_TEXT_FLAGS = ('-t', '--title', '-b', '--body', '-F', '--body-file')
      MERGE_TEXT_FLAGS = ('-t', '--subject', '-b', '--body', '-F', '--body-file')
      SEQUENCER = ('--continue', '--skip', '--abort', '--quit')
      API_BODY_FLAGS = ('-f', '-F', '--field', '--raw-field', '--input')
      API_OPTS_WITH_ARG = ('-H', '--header', '-q', '--jq', '-t', '--template', '-p', '--preview', '--hostname', '--cache')
      METHODS = ('GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD')
      PULLS = re.compile(r'^/?repos/[^/]+/[^/]+/pulls(/[^/?]+)?/?(\?.*)?\Z')
      PULL_MERGE = re.compile(r'^/?repos/[^/]+/[^/]+/pulls/[^/?]+/merge/?(\?.*)?\Z')
      HEREDOC = re.compile(r'(?<!<)<<(?!<)-?\s*([^\s;&|<>()]+)')

      def strip_heredocs(text):
          out, pending = [], []
          for line in text.split(chr(10)):
              if pending:
                  if line.strip() == pending[0]:
                      pending.pop(0)
                  continue
              out.append(line)
              pending = [d.strip(chr(39) + chr(34) + chr(92)) for d in HEREDOC.findall(line)]
          return chr(10).join(out)

      def tokenize(text):
          try:
              lexer = shlex.shlex(text, posix=True, punctuation_chars=True)
              lexer.whitespace_split = True
              return list(lexer)
          except ValueError:
              return text.split()

      def clauses(toks):
          out, cur = [], []
          for tok in toks:
              if tok and all(ch in SEPARATORS for ch in tok):
                  out.append(cur)
                  cur = []
              else:
                  cur.append(tok)
          out.append(cur)
          return out

      def word(tok):
          return tok.split('/')[-1]

      def merge_in_progress(workdir):
          try:
              return subprocess.run(
                  ['git', '-C', workdir, 'rev-parse', '-q', '--verify', 'MERGE_HEAD'],
                  capture_output=True, timeout=5,
              ).returncode == 0
          except Exception:
              return False

      def git_commit(args, workdir):
          j = 0
          while j < len(args) and args[j].startswith('-'):
              if args[j] == '-C' and j + 1 < len(args):
                  workdir = os.path.join(workdir, os.path.expanduser(args[j + 1]))
              j += 2 if args[j] in GIT_OPTS_WITH_ARG else 1
          if j >= len(args):
              return None
          sub, rest = args[j], args[j + 1:]
          if sub in ('commit', 'commit-tree'):
              quiet = [a for a in rest if a not in ('-q', '--quiet')]
              if sub == 'commit' and quiet == ['--no-edit'] and merge_in_progress(workdir):
                  return None
              return 'git ' + sub
          if sub == 'merge' and any(a[:2] in ('-m', '-F', '-e') or a.split('=')[0] in ('--message', '--file', '--edit') for a in rest):
              return 'git merge'
          if sub == 'rebase' and any(a[:2] == '-x' or a.split('=')[0] == '--exec' for a in rest):
              return 'git rebase --exec'
          if sub in ('revert', 'cherry-pick'):
              if any(a in ('-e', '--edit') for a in rest):
                  return 'git ' + sub
              if not any(a in SEQUENCER + ('-n', '--no-commit') for a in rest):
                  return 'git ' + sub
          return None

      def gh_api(args):
          method, body, positional, j = None, False, [], 0
          while j < len(args):
              a = args[j]
              if a in ('-X', '--method'):
                  method = args[j + 1] if j + 1 < len(args) else None
                  j += 2
                  continue
              if a.startswith(('--method=', '-X=')):
                  method = a.split('=', 1)[1]
              elif a.startswith('-X') and len(a) > 2:
                  method = a[2:]
              elif a in API_BODY_FLAGS:
                  body = True
                  j += 2
                  continue
              elif a.startswith(('--field=', '--raw-field=', '--input=')) or (a[:2] in ('-f', '-F') and len(a) > 2):
                  body = True
              elif a in API_OPTS_WITH_ARG:
                  j += 2
                  continue
              elif not a.startswith('-'):
                  positional.append(a)
              j += 1
          if positional and positional[0].upper() in METHODS:
              method = positional.pop(0)
          endpoint = positional[0] if positional else ''
          method = (method or ('POST' if body else 'GET')).upper()
          joined = ' '.join(args)
          if method in ('POST', 'PATCH', 'PUT') and PULLS.match(endpoint):
              return 'gh api ' + method + ' ' + endpoint
          if method == 'PUT' and PULL_MERGE.match(endpoint) and re.search(r'\bcommit_(title|message)=', joined):
              return 'gh api PUT ' + endpoint
          if endpoint == 'graphql' and re.search(r'\b(create|update)PullRequest\b|\bcommit(Headline|Body)\b', joined):
              return 'gh api graphql pull request mutation'
          return None

      def gh_pr_text(args):
          if args[:1] == ['api']:
              return gh_api(args[1:])
          if args[:1] != ['pr'] or len(args) < 2:
              return None
          if args[1] in ('create', 'new'):
              return 'gh pr ' + args[1]
          if args[1] == 'edit' and any(a.split('=')[0] in PR_TEXT_FLAGS for a in args[2:]):
              return 'gh pr edit'
          if args[1] == 'merge' and any(a.split('=')[0] in MERGE_TEXT_FLAGS for a in args[2:]):
              return 'gh pr merge'
          return None

      def check(clause, workdir):
          for i, tok in enumerate(clause):
              name = word(tok)
              hit = None
              if name == 'git':
                  hit = git_commit(clause[i + 1:], workdir)
              elif name in ('gh', 'gh-axi'):
                  hit = gh_pr_text(clause[i + 1:])
                  if hit and name == 'gh-axi':
                      hit = 'gh-axi' + hit[2:]
              if hit:
                  return hit
          return None

      def scan(text, workdir, depth=0):
          for clause in clauses(tokenize(strip_heredocs(text))):
              if clause[:1] == ['cd'] and len(clause) > 1:
                  workdir = os.path.join(workdir, os.path.expanduser(clause[1]))
                  continue
              hit = check(clause, workdir)
              if hit:
                  return hit
              if depth:
                  continue
              for i, tok in enumerate(clause):
                  name, rest = word(tok), clause[i + 1:]
                  if name == 'eval':
                      hit = scan(' '.join(rest), workdir, depth + 1)
                  elif name in SHELLS:
                      payload = next((rest[j + 1] for j, arg in enumerate(rest)
                                      if arg.startswith('-') and arg.endswith('c')
                                      and j + 1 < len(rest)), None)
                      hit = scan(payload, workdir, depth + 1) if payload else None
                  else:
                      continue
                  if hit:
                      return hit
          return None

      USE_SQUAD = (
          'Use ONLY squad output:\\n'
          '  Commits: squad_commit\\n'
          '  PRs:     squad_pr  (opens the PR, or regenerates the title and body of an open one)'
      )

      op = scan(cmd, cwd)
      if op:
          reason = (
              f'BLOCKED: {op!r} writes commit or pull request text by hand.\\n\\n'
              'Commits and PR titles/bodies come only from squad. Use squad_commit or squad_pr.\\n'
              + ('Run it with --no-commit (-n), then squad_commit.\\n' if op.endswith(('revert', 'cherry-pick')) else '')
              + USE_SQUAD
          )
          print(json.dumps({'decision': 'deny', 'reason': reason}))
          sys.exit(0)

      forbidden = [
          '🤖',
          'Generated with',
          'Co-Authored-By: Claude',
          'Co-authored-by: Claude',
          'claude.com/claude-code',
          'noreply@anthropic.com',
          'Co-Authored-By: Antigravity',
          'Co-authored-by: Antigravity',
          'Co-Authored-By: Gemini',
          'Co-authored-by: Gemini',
          'antigravity.google',
      ]

      git_writes = ['git commit', 'git revert', 'git cherry-pick', 'git rebase', 'git merge', 'git tag', 'git notes']
      gh_writes = ['gh pr create', 'gh pr edit', 'gh pr comment', 'gh issue create', 'gh issue edit', 'gh issue comment', 'gh release create', 'gh release edit']

      triggered = next((f for f in forbidden if f in cmd), None)
      write_op = next((g for g in git_writes + gh_writes if g in cmd), None)

      if triggered and write_op:
          reason = f'BLOCKED: forbidden content {triggered!r} in {write_op!r} command.\\n\\n' + USE_SQUAD
          print(json.dumps({'decision': 'deny', 'reason': reason}))
      else:
          print(json.dumps({'decision': 'allow'}))
      "

  # dangerous_flags: Block dangerous git flags that bypass safety checks (--no-verify, etc.).
  dangerous_flags:
    event: PreToolUse
    matcher: run_command
    command: |
      python3 -c "
      import json, sys, shlex, re

      data = json.load(sys.stdin)
      args = data.get('toolCall', {}).get('args', {})
      cmd = args.get('CommandLine') or args.get('commandLine') or args.get('command') or ''

      if 'git' not in cmd:
          print(json.dumps({'decision': 'allow'}))
          sys.exit(0)

      # Block an option only where a real git invocation would receive it as argv, so
      # searching for or documenting a flag is left alone. Disabling hooks by another
      # name is the same shortcut, so it is caught here too.
      #
      # Deliberately out of scope: anything that has to be constructed to slip past
      # this - a payload nested two levels down, a flag pasted together at runtime
      # from variables or command substitution. Chasing those means reimplementing a
      # shell, and the guardrail is against a careless shortcut, not an adversary
      # who could just as easily edit this file.
      FLAGS = ['--no-verify', '--no-gpg-sign', '--no-post-rewrite']
      HOOK_ENV = ('SKIP', 'HUSKY', 'PRE_COMMIT_ALLOW_NO_CONFIG')
      SHELLS = ('bash', 'sh', 'zsh', 'dash', 'ksh')
      SEPARATORS = '&|;()<>'

      def tokenize(text):
          try:
              lexer = shlex.shlex(text, posix=True, punctuation_chars=True)
              lexer.whitespace_split = True
              return list(lexer)
          except ValueError:
              return text.split()

      def clauses(toks):
          out, cur = [], []
          for tok in toks:
              if tok and all(ch in SEPARATORS for ch in tok):
                  out.append(cur)
                  cur = []
              else:
                  cur.append(tok)
          out.append(cur)
          return out

      def check(clause):
          # The last git token is the invocation and the rest is its argv, which
          # covers exec-style prefixes - sudo, env, timeout, nohup - without
          # enumerating them.
          found = [i for i, tok in enumerate(clause) if tok.split('/')[-1] == 'git']
          if not found:
              return None
          args = clause[found[-1] + 1:]
          for tok in clause:
              if re.match('^(' + '|'.join(HOOK_ENV) + ')=', tok):
                  return tok.split('=')[0] + '='
          for arg in args:
              if arg.startswith('core.hooksPath='):
                  return 'core.hooksPath'
          for flag in FLAGS:
              if flag in args or any(arg.startswith(flag + '=') for arg in args):
                  return flag
          if 'commit' in args and '-n' in args:
              return '-n'
          return None

      def scan(text, depth=0):
          for clause in clauses(tokenize(text)):
              hit = check(clause)
              if hit:
                  return hit
              if depth:
                  continue
              # One level into eval and a shell -c payload. A wrapped command still
              # reads as an ordinary habit; deeper nesting does not.
              for i, tok in enumerate(clause):
                  word, rest = tok.split('/')[-1], clause[i + 1:]
                  if word == 'eval':
                      hit = scan(' '.join(rest), depth + 1)
                  elif word in SHELLS:
                      payload = next((rest[j + 1] for j, arg in enumerate(rest)
                                      if arg.startswith('-') and arg.endswith('c')
                                      and j + 1 < len(rest)), None)
                      hit = scan(payload, depth + 1) if payload else None
                  else:
                      continue
                  if hit:
                      return hit
          return None

      blocked_flag = scan(cmd)

      if blocked_flag:
          reason = f'BLOCKED: Cannot use {blocked_flag} flag.\\n\\nThis flag bypasses important safety checks.\\nFix the underlying issues instead.'
          print(json.dumps({'decision': 'deny', 'reason': reason}))
      else:
          print(json.dumps({'decision': 'allow'}))
      "
  # post_commit_check: Safety net for forbidden content that slipped past `forbidden_content`.
  # The PreToolUse hook only sees the literal command string, so it misses messages passed
  # via `-F file`, stdin pipes (`squad_commit` uses `git commit -F -`), $variables, editor
  # commits, and squash-merges.
  #
  # This runs on Stop rather than PostToolUse: PostToolUse hooks must emit `{}` and have no
  # way to push back, whereas a Stop hook returning "continue" keeps the agent working and
  # feeds `reason` back as a system message, telling the agent to fix the generator and
  # regenerate the commit with `squad_commit`. `executionNum` bounds the retries so a commit
  # the agent leaves in place can't wedge the session in an endless block loop.
  post_commit_check:
    event: Stop
    command: |
      python3 -c "
      import json, sys, subprocess, os

      data = json.load(sys.stdin)
      paths = data.get('workspacePaths') or []
      cwd = paths[0] if paths else os.getcwd()

      # Give up after a few rounds rather than blocking termination forever.
      if int(data.get('executionNum') or 0) > 3:
          print(json.dumps({}))
          sys.exit(0)

      try:
          msg = subprocess.run(
              ['git', '-C', cwd, 'log', '-1', '--format=%B'],
              capture_output=True, text=True, timeout=5, check=True,
          ).stdout
      except Exception:
          print(json.dumps({}))
          sys.exit(0)

      forbidden = [
          '🤖',
          'Generated with',
          'Co-Authored-By: Claude',
          'Co-authored-by: Claude',
          'claude.com/claude-code',
          'noreply@anthropic.com',
          'Co-Authored-By: Antigravity',
          'Co-authored-by: Antigravity',
          'Co-Authored-By: Gemini',
          'Co-authored-by: Gemini',
          'antigravity.google',
      ]
      hits = [f for f in forbidden if f in msg]
      if hits:
          reason = (
              f'Last commit contains forbidden content: {hits!r}\\n\\n'
              'The commit generator leaked it. Do NOT amend by hand; forbidden_content denies git commit.\\n'
              'Fix the source (squad-agents commit agent or scripts/filter.py), then regenerate:\\n'
              '  git reset --soft HEAD~1 && squad_commit\\n'
              'If the bad commit was already pushed, follow up with: git push --force-with-lease\\n'
          )
          print(json.dumps({'decision': 'continue', 'reason': reason}))
      else:
          print(json.dumps({}))
      "

  # stop_sound: Sound notification when the agent finishes a task. Emits no JSON, which
  # leaves termination alone.
  stop_sound:
    event: Stop
    command: >-
      {{ "osascript -e 'beep 2'" if (ansible_facts['os_family'] | default('')) == 'Darwin' else "printf '\\a'" }}

# Per-host overrides for the dict above. Keys here are merged into
# `antigravity_hooks_default` (recursive=True), so individual hooks can be
# customized without copy-pasting the whole map.
antigravity_hooks_overrides: {}

# Final assembled map passed to the template. Built from defaults + overrides; entries
# whose value is `null` (after merge) are filtered out so a host can disable a default hook
# by setting `<key>: ~` in the overrides.
antigravity_hooks: >-
  {{
    (antigravity_hooks_default | combine(antigravity_hooks_overrides, recursive=True))
    | dict2items | rejectattr('value', 'none') | items2dict
  }}

# MCP Server Management
antigravity_manage_mcp_servers: true  # Whether to manage MCP servers

# Whether a missing 1Password CLI is fatal. Off by default so a host without `op` still
# gets every server that carries no op:// reference; the ones that do are skipped with a
# warning rather than aborting the play. Turn on where a silently absent server is worse
# than a failed run.
antigravity_mcp_op_required: false

# List of MCP servers to install
# Each server supports: name, command, args, env, state
#
# agy has no `mcp` subcommand, so these are written straight into mcp_config.json.
# Servers not named here — including ones added through the /mcp overlay — are left alone.
#
# Any `op://vault/item/field` string is resolved by a single `op inject` pass over the
# assembled document, so references work anywhere in a spec — not just secrets. That is
# what keeps site-specific values (hostnames, account ids, paths) out of the repo. The
# claude_code role's `OP_LOOKUP:op://...` prefix is also accepted, so a server spec can be
# copied between the two roles unchanged.
antigravity_mcp_servers: []
# Example:
#   - name: chrome-devtools
#     command: npx
#     args:
#       - "-y"
#       - "chrome-devtools-mcp@latest"
#     state: present  # present or absent
#
#   - name: grafana
#     command: "{{ antigravity_user_home }}/.local/bin/mcp-grafana"
#     env:
#       GRAFANA_URL: "op://automation/Grafana Account/grafana-url"
#       GRAFANA_SERVICE_ACCOUNT_TOKEN: "op://automation/Grafana Account/api-token"
#     state: present
