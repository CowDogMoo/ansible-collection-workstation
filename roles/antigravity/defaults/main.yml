---
antigravity_username: "{{ ansible_facts['user_id'] | default(ansible_facts['user']) }}"
antigravity_usergroup: "{{ (ansible_facts['user_gid'] | default('staff')) if ansible_facts['os_family'] == 'Darwin' else antigravity_username }}"
antigravity_user_home: >-
  {{ (ansible_facts['user_dir'] | default(ansible_facts['env']['HOME']))
     if (antigravity_username == (ansible_facts['user_id'] | default(ansible_facts['user']) | default('')))
     else ((ansible_facts['os_family'] == 'Darwin') | ternary('/Users/' + antigravity_username,
           (antigravity_username == 'root') | ternary('/root', '/home/' + antigravity_username))) }}

# Configuration directory for Agy
antigravity_config_dir: "{{ antigravity_user_home }}/.gemini/config"

# Global rules file. Sits in ~/.gemini rather than the customization root: GEMINI.md is
# the only globally-scoped rules path Google documents.
antigravity_rules_file: "{{ antigravity_user_home }}/.gemini/GEMINI.md"

# Source file for global GEMINI.md instructions.
# Defaults to GEMINI.md from the role's files/ directory.
# Point to a custom path (e.g. `{{ playbook_dir }}/files/GEMINI.md`) or set
# `antigravity_rules_content` to supply custom instructions per-host or from a private playbook.
antigravity_rules_src: "GEMINI.md"

# Optional raw content for global GEMINI.md instructions.
# If non-empty, this takes precedence over antigravity_rules_src.
antigravity_rules_content: ""

# Rules directory for topic-scoped rules
antigravity_rules_dir: "{{ antigravity_config_dir }}/rules"

# Source directory for topic-scoped rules (optional)
# Can be a path relative to playbook files/ or an absolute path on controller
antigravity_rules_src_dir: ""

# Scripts directory for custom hook scripts and executables
antigravity_scripts_dir: "{{ antigravity_config_dir }}/scripts"

# Source directory for custom hook scripts (optional)
# Can be a path relative to playbook files/ or an absolute path on controller
antigravity_scripts_src_dir: ""

# Optional source file for custom hooks.json.
# If non-empty, this file is installed directly instead of generating from templates/hooks.json.j2.
antigravity_hooks_src: ""

# Unlike Claude Code — which nests hooks inside ~/.claude/settings.json — Antigravity
# reads hooks from a dedicated file in the customization root. Versions of agy before
# 1.0.8 wrote this to ~/.gemini/antigravity-cli/hooks.json via the /hooks command;
# writing the shared path directly is correct on every version.
antigravity_hooks_file: "{{ antigravity_config_dir }}/hooks.json"

# MCP servers are shared by the CLI, the IDE, and Antigravity 2.0.
antigravity_mcp_config_file: "{{ antigravity_config_dir }}/mcp_config.json"

# Homebrew prefix (varies by OS/architecture)
antigravity_homebrew_prefix: >-
  {{ (ansible_facts['os_family'] == 'Darwin') | ternary(
       (ansible_facts['architecture'] == 'arm64') | ternary('/opt/homebrew', '/usr/local'),
       '/home/linuxbrew/.linuxbrew') }}

# PATH for agy CLI commands
antigravity_path: "{{ antigravity_homebrew_prefix }}/bin:{{ antigravity_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

# Whether to install Antigravity CLI
antigravity_install: true

# Whether to manage Agy settings
antigravity_manage_settings: true

# Whether to manage topic-scoped rule files
antigravity_manage_rules: true

# Whether to manage custom scripts directory
antigravity_manage_scripts: true

# Whether to manage hooks
antigravity_manage_hooks: true

# Whether to backup existing hooks.json before overwriting
antigravity_backup_settings: true

# Plugin Management
antigravity_manage_plugins: true  # Whether to manage plugins

# List of plugins to install
# Each plugin supports: name, target, state
antigravity_plugins: []
# Example:
#   - name: python_debugger
#     target: python_debugger@latest
#     state: present

# Hooks — custom shell/Python commands bound to agent lifecycle events.
#
# Antigravity's hooks.json is keyed by hook name, which lines up with the dict-keyed
# layout used here: each key below becomes a top-level entry in the generated file.
# Consumers override individual hooks via `antigravity_hooks_overrides` using the same
# key, no copy-paste needed:
#
#     antigravity_hooks_overrides:
#       stop_sound:
#         command: 'afplay "$HOME/Jobs Done.mp3"'
#
# To remove a default hook entirely on a specific host, set its value to `null`.
# To add a host-specific hook, give it a new key.
#
# Supported events: PreToolUse, PostToolUse, PreInvocation, PostInvocation, Stop.
# There is no Notification event, so Claude Code's `notify_sound` has no counterpart.
#
# Tool matchers use Antigravity's own tool names — `run_command`, `view_file`,
# `write_to_file`, `replace_file_content`, `grep_search`, `find_by_name` — not Claude's
# `Bash`/`Read`/`Write`. A matcher is a regex; "" or "*" matches every tool.
#
# Hooks communicate by writing JSON to stdout, not via exit codes. A PreToolUse hook
# blocks with {"decision": "deny", "reason": "..."} or permits with {"decision": "allow"}.
# Antigravity PreToolUse hooks fail closed on empty JSON ({}), so non-matching commands must
# emit {"decision": "allow"}. A Stop hook keeps the agent running with
# {"decision": "continue", "reason": "..."} and the reason is injected as a system
# message.
antigravity_hooks_default:

  # forbidden_content: Block commits/PRs with forbidden content (emojis/branding).
  # Inspects the literal command string. Catches `git commit -m "...Co-Authored-By: Claude..."`
  # and `gh pr create --body "...🤖..."` style invocations. Cannot see content passed via
  # `-F file`, stdin pipes, $variables, or editor commits — `post_commit_check` handles those.
  forbidden_content:
    event: PreToolUse
    matcher: run_command
    command: |
      python3 -c "
      import json, sys

      data = json.load(sys.stdin)
      args = data.get('toolCall', {}).get('args', {})
      # run_command exposes the shell string as CommandLine; the fallbacks keep the hook
      # working if a future agy release renames or lowercases the field.
      cmd = args.get('CommandLine') or args.get('commandLine') or args.get('command') or ''

      forbidden = [
          '🤖',
          'Generated with',
          'Co-Authored-By: Claude',
          'Co-authored-by: Claude',
          'claude.com/claude-code',
          'noreply@anthropic.com',
          'Co-Authored-By: Antigravity',
          'Co-authored-by: Antigravity',
          'Co-Authored-By: Gemini',
          'Co-authored-by: Gemini',
          'antigravity.google',
      ]

      git_writes = ['git commit', 'git revert', 'git cherry-pick', 'git rebase', 'git merge', 'git tag', 'git notes']
      gh_writes = ['gh pr create', 'gh pr edit', 'gh pr comment', 'gh issue create', 'gh issue edit', 'gh issue comment', 'gh release create', 'gh release edit']

      triggered = next((f for f in forbidden if f in cmd), None)
      op = next((g for g in git_writes + gh_writes if g in cmd), None)

      if triggered and op:
          reason = (
              f'BLOCKED: forbidden content {triggered!r} in {op!r} command.\\n\\n'
              'Use ONLY squad output:\\n'
              '  Commits: squad_commit  (or: git diff --staged | squad_gen commit)\\n'
              '  PRs:     squad_pr      (or: git diff main...HEAD | squad_gen pr)'
          )
          print(json.dumps({'decision': 'deny', 'reason': reason}))
      else:
          print(json.dumps({'decision': 'allow'}))
      "

  # dangerous_flags: Block dangerous git flags that bypass safety checks (--no-verify, etc.).
  dangerous_flags:
    event: PreToolUse
    matcher: run_command
    command: |
      python3 -c "
      import json, sys, re, shlex

      data = json.load(sys.stdin)
      args = data.get('toolCall', {}).get('args', {})
      cmd = args.get('CommandLine') or args.get('commandLine') or args.get('command') or ''

      if 'git' not in cmd.replace(chr(39), '').replace(chr(34), '').replace(chr(92), ''):
          print(json.dumps({'decision': 'allow'}))
          sys.exit(0)

      # Only flag a dangerous option that is a real argv token of a git invocation,
      # so merely searching for or documenting the flag is not blocked. Shell and
      # exec wrappers are followed so they cannot be used to smuggle one past.
      DANGEROUS = ['--no-verify', '--no-gpg-sign', '--no-post-rewrite']
      SEPARATORS = set('&|;()<>')
      STR_WRAPPERS = ('bash', 'sh', 'zsh', 'dash', 'ksh')
      INTERPRETERS = ('python', 'python2', 'python3', 'perl', 'ruby', 'node',
                      'php', 'awk')

      def tokenize(text):
          # Non-posix keeps the quotes on each token, which is what lets a quoted
          # ';' be told apart from a real command separator.
          try:
              lexer = shlex.shlex(text, posix=False, punctuation_chars=True)
              lexer.whitespace_split = True
              return list(lexer)
          except ValueError:
              return text.split()

      def unquote(tok):
          # A wrapping pair keeps its contents intact, so a quoted sentence stays one
          # opaque word. Quotes or escapes spliced into a bare word are removed
          # instead: the shell concatenates those segments into a single word, so
          # --no-verif'y' reaches git as --no-verify.
          if len(tok) > 1 and tok[0] == tok[-1] and tok[0] in (chr(34), chr(39)):
              return tok[1:-1]
          out = tok.replace(chr(92), '')
          # ANSI-C and locale quoting introduce a quoted run that the shell strips
          # entirely, so drop the dollar introducer together with its quote.
          out = out.replace(chr(36) + chr(39), '').replace(chr(36) + chr(34), '')
          # chr(96) is the backtick: shlex neither quotes nor splits on it, so it
          # stays fused to the adjacent word unless it is stripped here.
          return (out.replace(chr(34), '')
                     .replace(chr(39), '')
                     .replace(chr(96), ''))

      def clauses(toks):
          out, cur = [], []
          for tok in toks:
              if tok and all(ch in SEPARATORS for ch in tok):
                  out.append(cur)
                  cur = []
              else:
                  cur.append(tok)
          out.append(cur)
          return out

      def scan(clause, depth=0):
          if depth > 8 or not clause:
              return None
          vals = [unquote(tok) for tok in clause]

          # A shell or interpreter ANYWHERE in the clause may carry a payload that is
          # itself a command, so recurse into it. Checking every position rather than
          # only the first word means an exec-style prefix cannot hide the payload.
          for j, val in enumerate(vals):
              word = val.split('/')[-1]
              rest = vals[j + 1:]
              if word == 'eval':
                  hit = scan_command(' '.join(rest), depth + 1)
                  if hit:
                      return hit
              elif word in STR_WRAPPERS:
                  for k, arg in enumerate(rest):
                      if arg.startswith('-') and arg.endswith('c') and k + 1 < len(rest):
                          hit = scan_command(rest[k + 1], depth + 1)
                          if hit:
                              return hit
              elif word in INTERPRETERS:
                  # An interpreter payload really does run git, but its syntax is not
                  # shell, so split on anything that cannot be part of a word and look
                  # for the invocation and the flag together. Short options bundle, so
                  # -c and -e also arrive as -uc, -Ic, -we.
                  for k, arg in enumerate(rest):
                      if (arg.startswith('-') and not arg.startswith('--')
                              and arg[-1:] in ('c', 'e') and k + 1 < len(rest)):
                          words = re.split(r'[^A-Za-z0-9_./-]+', rest[k + 1])
                          if 'git' in [w.split('/')[-1] for w in words]:
                              for flag in DANGEROUS:
                                  if flag in words:
                                      return flag

          # The tool itself, wherever it sits in the clause. Taking the last such
          # token and treating the remainder as its argv covers every exec-style
          # wrapper prefix - sudo, env, nohup, flock, chrt, ionice, runuser and any
          # other - without having to enumerate them.
          for k in range(len(vals) - 1, -1, -1):
              if vals[k].split('/')[-1] != 'git':
                  continue
              args = vals[k + 1:]
              for flag in DANGEROUS:
                  if flag in args or any(a.startswith(flag + '=') for a in args):
                      return flag
              if 'commit' in args and '-n' in args:
                  return '-n'
              break
          return None

      def fallback(toks):
          # xargs, command substitution, variables and friends assemble argv at run
          # time, so the flag can reach git from a different clause than the
          # invocation. Only bare tokens count: a quoted mention stays a single
          # token, so documenting or searching for the flag is still allowed.
          bare = []
          for tok in toks:
              val = unquote(tok)
              bare.append(val)
              # a value assigned here can be substituted back in a later clause
              if re.match(r'^[A-Za-z_][A-Za-z0-9_]*=', val):
                  bare.extend(unquote(t) for t in tokenize(val.split('=', 1)[1]))
          if 'git' not in [tok.split('/')[-1] for tok in bare]:
              return None
          for flag in DANGEROUS:
              if flag in bare:
                  return flag
          return None

      def assembles_at_runtime(text, toks):
          # The pooled fallback is only safe where argv really can be built at run
          # time. Without this, two unrelated clauses - git log && echo FLAG - would
          # be pooled together and wrongly blocked.
          if chr(36) in text or chr(96) in text:
              return True
          for tok in toks:
              val = unquote(tok)
              if re.match(r'^[A-Za-z_][A-Za-z0-9_]*=', val):
                  return True
              if val.split('/')[-1] == 'xargs':
                  return True
          return False

      def reads_script_from_stdin(cls):
          # A bare shell or interpreter with no arguments runs whatever is piped
          # into it, so an upstream clause is script text, not data.
          for c in cls:
              vals = [unquote(tok) for tok in c]
              if len(vals) == 1 and vals[0].split('/')[-1] in STR_WRAPPERS + INTERPRETERS:
                  return True
          return False

      def scan_command(text, depth=0):
          # Applied to the whole command and to every nested payload, so a wrapper
          # cannot hide a runtime-assembled flag one level down.
          toks = tokenize(text)
          cls = clauses(toks)
          for clause in cls:
              hit = scan(clause, depth)
              if hit:
                  return hit
          if reads_script_from_stdin(cls):
              for c in cls:
                  vals = [unquote(tok) for tok in c]
                  if len(vals) > 1:
                      hit = scan_command(' '.join(vals[1:]), depth + 1)
                      if hit:
                          return hit
          if assembles_at_runtime(text, toks):
              return fallback(toks)
          return None

      blocked_flag = scan_command(cmd)

      if blocked_flag:
          reason = f'BLOCKED: Cannot use {blocked_flag} flag.\\n\\nThis flag bypasses important safety checks.\\nFix the underlying issues instead.'
          print(json.dumps({'decision': 'deny', 'reason': reason}))
      else:
          print(json.dumps({'decision': 'allow'}))
      "

  # post_commit_check: Safety net for forbidden content that slipped past `forbidden_content`.
  # The PreToolUse hook only sees the literal command string, so it misses messages passed
  # via `-F file`, stdin pipes (`squad_commit` uses `git commit -F -`), $variables, editor
  # commits, and squash-merges.
  #
  # This runs on Stop rather than PostToolUse: PostToolUse hooks must emit `{}` and have no
  # way to push back, whereas a Stop hook returning "continue" keeps the agent working and
  # feeds `reason` back as a system message. `executionNum` bounds the retries so a commit
  # the agent refuses to amend can't wedge the session in an endless block loop.
  post_commit_check:
    event: Stop
    command: |
      python3 -c "
      import json, sys, subprocess, os

      data = json.load(sys.stdin)
      paths = data.get('workspacePaths') or []
      cwd = paths[0] if paths else os.getcwd()

      # Give up after a few rounds rather than blocking termination forever.
      if int(data.get('executionNum') or 0) > 3:
          print(json.dumps({}))
          sys.exit(0)

      try:
          msg = subprocess.run(
              ['git', '-C', cwd, 'log', '-1', '--format=%B'],
              capture_output=True, text=True, timeout=5, check=True,
          ).stdout
      except Exception:
          print(json.dumps({}))
          sys.exit(0)

      forbidden = [
          '🤖',
          'Generated with',
          'Co-Authored-By: Claude',
          'Co-authored-by: Claude',
          'claude.com/claude-code',
          'noreply@anthropic.com',
          'Co-Authored-By: Antigravity',
          'Co-authored-by: Antigravity',
          'Co-Authored-By: Gemini',
          'Co-authored-by: Gemini',
          'antigravity.google',
      ]
      hits = [f for f in forbidden if f in msg]
      if hits:
          reason = (
              f'Last commit contains forbidden content: {hits!r}\\n\\n'
              'Amend it now (do NOT push until fixed):\\n'
              '  git log -1 --format=%B > /tmp/commit_msg\\n'
              '  # edit /tmp/commit_msg and remove the trailers/branding\\n'
              '  git commit --amend -F /tmp/commit_msg\\n'
          )
          print(json.dumps({'decision': 'continue', 'reason': reason}))
      else:
          print(json.dumps({}))
      "

  # stop_sound: Sound notification when the agent finishes a task. Emits no JSON, which
  # leaves termination alone.
  stop_sound:
    event: Stop
    command: >-
      {{ "osascript -e 'beep 2'" if (ansible_facts['os_family'] | default('')) == 'Darwin' else "printf '\\a'" }}

# Per-host overrides for the dict above. Keys here are merged into
# `antigravity_hooks_default` (recursive=True), so individual hooks can be
# customized without copy-pasting the whole map.
antigravity_hooks_overrides: {}

# Final assembled map passed to the template. Built from defaults + overrides; entries
# whose value is `null` (after merge) are filtered out so a host can disable a default hook
# by setting `<key>: ~` in the overrides.
antigravity_hooks: >-
  {{
    (antigravity_hooks_default | combine(antigravity_hooks_overrides, recursive=True))
    | dict2items | rejectattr('value', 'none') | items2dict
  }}

# MCP Server Management
antigravity_manage_mcp_servers: true  # Whether to manage MCP servers

# Whether a missing 1Password CLI is fatal. Off by default so a host without `op` still
# gets every server that carries no op:// reference; the ones that do are skipped with a
# warning rather than aborting the play. Turn on where a silently absent server is worse
# than a failed run.
antigravity_mcp_op_required: false

# List of MCP servers to install
# Each server supports: name, command, args, env, state
#
# agy has no `mcp` subcommand, so these are written straight into mcp_config.json.
# Servers not named here — including ones added through the /mcp overlay — are left alone.
#
# Any `op://vault/item/field` string is resolved by a single `op inject` pass over the
# assembled document, so references work anywhere in a spec — not just secrets. That is
# what keeps site-specific values (hostnames, account ids, paths) out of the repo. The
# claude_code role's `OP_LOOKUP:op://...` prefix is also accepted, so a server spec can be
# copied between the two roles unchanged.
antigravity_mcp_servers: []
# Example:
#   - name: chrome-devtools
#     command: npx
#     args:
#       - "-y"
#       - "chrome-devtools-mcp@latest"
#     state: present  # present or absent
#
#   - name: grafana
#     command: "{{ antigravity_user_home }}/.local/bin/mcp-grafana"
#     env:
#       GRAFANA_URL: "op://automation/Grafana Account/grafana-url"
#       GRAFANA_SERVICE_ACCOUNT_TOKEN: "op://automation/Grafana Account/api-token"
#     state: present
