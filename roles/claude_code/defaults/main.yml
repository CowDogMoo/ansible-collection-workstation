---
claude_code_username: "{{ ansible_facts['user_id'] | default(ansible_facts['user']) }}"
claude_code_usergroup: "{{ (ansible_facts['user_gid'] | default('staff')) if ansible_facts['os_family'] == 'Darwin' else claude_code_username }}"
claude_code_user_home: >-
  {{ (ansible_facts['user_dir'] | default(ansible_facts['env']['HOME']))
     if (claude_code_username == (ansible_facts['user_id'] | default(ansible_facts['user']) | default('')))
     else ((ansible_facts['os_family'] == 'Darwin') | ternary('/Users/' + claude_code_username,
           (claude_code_username == 'root') | ternary('/root', '/home/' + claude_code_username))) }}

# Configuration directory for Claude Code
claude_code_config_dir: "{{ claude_code_user_home }}/.claude"

# Global rules file for Claude Code instructions.
claude_code_rules_file: "{{ claude_code_config_dir }}/CLAUDE.md"

# Source file for global CLAUDE.md instructions.
# Defaults to CLAUDE.md from the role's files/ directory.
# Point to a custom path (e.g. `{{ playbook_dir }}/files/CLAUDE.md`) or set
# `claude_code_rules_content` to supply custom instructions per-host or from a private playbook.
claude_code_rules_src: "CLAUDE.md"

# Optional raw content for global CLAUDE.md instructions.
# If non-empty, this takes precedence over claude_code_rules_src.
claude_code_rules_content: ""

# Topic-scoped rules directory for modular agent instructions
claude_code_rules_dir: "{{ claude_code_config_dir }}/rules"

# Source directory for topic-scoped rules (optional)
# Can be a path relative to playbook files/ or an absolute path on controller
claude_code_rules_src_dir: ""

# Scripts directory for custom hook scripts and executables
claude_code_scripts_dir: "{{ claude_code_config_dir }}/scripts"

# Source directory for custom hook scripts (optional)
# Can be a path relative to playbook files/ or an absolute path on controller
claude_code_scripts_src_dir: ""

# Optional source file for custom settings.json.
# If non-empty, this file is installed directly instead of generating from templates/settings.json.j2.
claude_code_settings_src: ""

# Homebrew prefix (varies by OS/architecture)
# macOS ARM: /opt/homebrew, macOS Intel: /usr/local, Linux: /home/linuxbrew/.linuxbrew
claude_code_homebrew_prefix: >-
  {{ (ansible_facts['os_family'] == 'Darwin') | ternary(
       (ansible_facts['architecture'] == 'arm64') | ternary('/opt/homebrew', '/usr/local'),
       '/home/linuxbrew/.linuxbrew') }}

# PATH for claude CLI commands
claude_code_path: "{{ claude_code_homebrew_prefix }}/bin:{{ claude_code_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

# Whether to install Claude Code CLI
claude_code_install: true

# Whether to manage Claude Code settings
claude_code_manage_settings: true

# Whether to manage topic-scoped rule files
claude_code_manage_rules: true

# Whether to manage custom scripts directory
claude_code_manage_scripts: true

# Whether to back up settings.json before the role rewrites it. A backup is only
# taken when the file exists and the run would change it, so idempotent runs
# leave no new copies behind.
claude_code_backup_settings: true

# Where settings.json backups go, named settings.json.<UTC timestamp>
claude_code_settings_backup_dir: "{{ claude_code_config_dir }}/backups"

# Number of settings.json backups to keep; older ones are pruned (0 keeps all)
claude_code_settings_backup_keep: 10

# Simple hooks - easy YAML configuration
claude_code_simple_hooks: []

# Advanced hooks — custom Python/shell scripts.
#
# Hooks are defined as a dict keyed by hook id (e.g. `forbidden_content`, `stop_sound`)
# rather than a positional list. Consumers override individual hooks by setting
# `claude_code_advanced_hooks_overrides` with the same key, no copy-paste needed:
#
#     claude_code_advanced_hooks_overrides:
#       stop_sound:
#         command: 'afplay "$HOME/Jobs Done.mp3"'
#
# To remove a default hook entirely on a specific host, set its value to `null`.
# To add a host-specific hook, give it a new key. An optional `timeout` (seconds)
# is rendered as the hook's timeout; without it Claude Code's default applies.
claude_code_advanced_hooks_default:

  # forbidden_content: Commits and pull request text come from squad, full stop.
  #
  # Denies:
  #   - `git commit` (`--amend` included) and `git commit-tree`
  #   - `git merge -m/--message/-F/--file/-e/--edit`
  #   - `git rebase -x/--exec`
  #   - `git revert` and `git cherry-pick` without `-n/--no-commit`, and with `-e/--edit`
  #   - `gh pr create`, `gh pr edit --title/--body/--body-file`, and
  #     `gh pr merge --subject/--body/--body-file`, the same through gh-axi
  #   - `gh api` POST/PATCH/PUT to a pulls endpoint, a PUT to a pull's merge endpoint
  #     with commit_title/commit_message, and a GraphQL mutation that creates or
  #     updates a pull request or carries a commitHeadline/commitBody
  #
  # Allowed: `squad_commit` and `squad_pr` (the hook only sees the literal command,
  # never the git and gh calls those functions make inside), read-only commands,
  # plain `git merge`/`git pull` and `git merge --no-edit` (git's own message),
  # `git rebase`/`git revert`/`git cherry-pick` --continue/--skip/--abort/--quit,
  # `git revert -n` and `git cherry-pick -n` followed by squad_commit, and
  # `git commit --no-edit` while a merge is in progress: it concludes the merge with
  # git's own message and is the command no-mistakes gives its agent to finish a
  # merge-strategy conflict.
  #
  # It also blocks forbidden attribution text in the other write commands it can
  # see. Like dangerous_flags it parses the command into clauses and looks one level
  # into eval and `sh -c`, and it skips heredoc bodies, so searching for or
  # documenting these commands is left alone. Out of scope, as anything built to
  # slip past it is: git aliases, command substitution, deeper nesting, scripts
  # (heredocs fed to a shell included), and API clients other than gh.
  # `post_commit_check` and `post_pr_check` still read back what squad produced.
  forbidden_content:
    event: PreToolUse
    tool: Bash
    type: command
    command: |
      python3 -c "
      import json, os, re, shlex, subprocess, sys

      data = json.load(sys.stdin)
      cmd = data.get('tool_input', {}).get('command', '')
      cwd = data.get('cwd') or os.getcwd()

      SQUAD_ONLY = ('squad_commit', 'squad_pr')
      SHELLS = ('bash', 'sh', 'zsh', 'dash', 'ksh')
      SEPARATORS = '&|;()<>'
      GIT_OPTS_WITH_ARG = ('-C', '-c', '--git-dir', '--work-tree', '--namespace', '--super-prefix', '--config-env')
      PR_TEXT_FLAGS = ('-t', '--title', '-b', '--body', '-F', '--body-file')
      MERGE_TEXT_FLAGS = ('-t', '--subject', '-b', '--body', '-F', '--body-file')
      SEQUENCER = ('--continue', '--skip', '--abort', '--quit')
      API_BODY_FLAGS = ('-f', '-F', '--field', '--raw-field', '--input')
      API_OPTS_WITH_ARG = ('-H', '--header', '-q', '--jq', '-t', '--template', '-p', '--preview', '--hostname', '--cache')
      METHODS = ('GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD')
      PULLS = re.compile(r'^/?repos/[^/]+/[^/]+/pulls(/[^/?]+)?/?(\?.*)?\Z')
      PULL_MERGE = re.compile(r'^/?repos/[^/]+/[^/]+/pulls/[^/?]+/merge/?(\?.*)?\Z')
      HEREDOC = re.compile(r'(?<!<)<<(?!<)-?\s*([^\s;&|<>()]+)')

      def strip_heredocs(text):
          out, pending = [], []
          for line in text.split(chr(10)):
              if pending:
                  if line.strip() == pending[0]:
                      pending.pop(0)
                  continue
              out.append(line)
              pending = [d.strip(chr(39) + chr(34) + chr(92)) for d in HEREDOC.findall(line)]
          return chr(10).join(out)

      def tokenize(text):
          try:
              lexer = shlex.shlex(text, posix=True, punctuation_chars=True)
              lexer.whitespace_split = True
              return list(lexer)
          except ValueError:
              return text.split()

      def clauses(toks):
          out, cur = [], []
          for tok in toks:
              if tok and all(ch in SEPARATORS for ch in tok):
                  out.append(cur)
                  cur = []
              else:
                  cur.append(tok)
          out.append(cur)
          return out

      def word(tok):
          return tok.split('/')[-1]

      def merge_in_progress(workdir):
          try:
              return subprocess.run(
                  ['git', '-C', workdir, 'rev-parse', '-q', '--verify', 'MERGE_HEAD'],
                  capture_output=True, timeout=5,
              ).returncode == 0
          except Exception:
              return False

      def git_commit(args, workdir):
          j = 0
          while j < len(args) and args[j].startswith('-'):
              if args[j] == '-C' and j + 1 < len(args):
                  workdir = os.path.join(workdir, os.path.expanduser(args[j + 1]))
              j += 2 if args[j] in GIT_OPTS_WITH_ARG else 1
          if j >= len(args):
              return None
          sub, rest = args[j], args[j + 1:]
          if sub in ('commit', 'commit-tree'):
              quiet = [a for a in rest if a not in ('-q', '--quiet')]
              if sub == 'commit' and quiet == ['--no-edit'] and merge_in_progress(workdir):
                  return None
              return 'git ' + sub
          if sub == 'merge' and any(a[:2] in ('-m', '-F', '-e') or a.split('=')[0] in ('--message', '--file', '--edit') for a in rest):
              return 'git merge'
          if sub == 'rebase' and any(a[:2] == '-x' or a.split('=')[0] == '--exec' for a in rest):
              return 'git rebase --exec'
          if sub in ('revert', 'cherry-pick'):
              if any(a in ('-e', '--edit') for a in rest):
                  return 'git ' + sub
              if not any(a in SEQUENCER + ('-n', '--no-commit') for a in rest):
                  return 'git ' + sub
          return None

      def gh_api(args):
          method, body, positional, j = None, False, [], 0
          while j < len(args):
              a = args[j]
              if a in ('-X', '--method'):
                  method = args[j + 1] if j + 1 < len(args) else None
                  j += 2
                  continue
              if a.startswith(('--method=', '-X=')):
                  method = a.split('=', 1)[1]
              elif a.startswith('-X') and len(a) > 2:
                  method = a[2:]
              elif a in API_BODY_FLAGS:
                  body = True
                  j += 2
                  continue
              elif a.startswith(('--field=', '--raw-field=', '--input=')) or (a[:2] in ('-f', '-F') and len(a) > 2):
                  body = True
              elif a in API_OPTS_WITH_ARG:
                  j += 2
                  continue
              elif not a.startswith('-'):
                  positional.append(a)
              j += 1
          if positional and positional[0].upper() in METHODS:
              method = positional.pop(0)
          endpoint = positional[0] if positional else ''
          method = (method or ('POST' if body else 'GET')).upper()
          joined = ' '.join(args)
          if method in ('POST', 'PATCH', 'PUT') and PULLS.match(endpoint):
              return 'gh api ' + method + ' ' + endpoint
          if method == 'PUT' and PULL_MERGE.match(endpoint) and re.search(r'\bcommit_(title|message)=', joined):
              return 'gh api PUT ' + endpoint
          if endpoint == 'graphql' and re.search(r'\b(create|update)PullRequest\b|\bcommit(Headline|Body)\b', joined):
              return 'gh api graphql pull request mutation'
          return None

      def gh_pr_text(args):
          if args[:1] == ['api']:
              return gh_api(args[1:])
          if args[:1] != ['pr'] or len(args) < 2:
              return None
          if args[1] in ('create', 'new'):
              return 'gh pr ' + args[1]
          if args[1] == 'edit' and any(a.split('=')[0] in PR_TEXT_FLAGS for a in args[2:]):
              return 'gh pr edit'
          if args[1] == 'merge' and any(a.split('=')[0] in MERGE_TEXT_FLAGS for a in args[2:]):
              return 'gh pr merge'
          return None

      def check(clause, workdir):
          for i, tok in enumerate(clause):
              name = word(tok)
              hit = None
              if name == 'git':
                  hit = git_commit(clause[i + 1:], workdir)
              elif name in ('gh', 'gh-axi'):
                  hit = gh_pr_text(clause[i + 1:])
                  if hit and name == 'gh-axi':
                      hit = 'gh-axi' + hit[2:]
              if hit:
                  return hit
          return None

      def scan(text, workdir, depth=0):
          for clause in clauses(tokenize(strip_heredocs(text))):
              if clause[:1] == ['cd'] and len(clause) > 1:
                  workdir = os.path.join(workdir, os.path.expanduser(clause[1]))
                  continue
              hit = check(clause, workdir)
              if hit:
                  return hit
              if depth:
                  continue
              for i, tok in enumerate(clause):
                  name, rest = word(tok), clause[i + 1:]
                  if name == 'eval':
                      hit = scan(' '.join(rest), workdir, depth + 1)
                  elif name in SHELLS:
                      payload = next((rest[j + 1] for j, arg in enumerate(rest)
                                      if arg.startswith('-') and arg.endswith('c')
                                      and j + 1 < len(rest)), None)
                      hit = scan(payload, workdir, depth + 1) if payload else None
                  else:
                      continue
                  if hit:
                      return hit
          return None

      USE_SQUAD = (
          '✅ Use ONLY squad output:\\n'
          '  Commits: squad_commit\\n'
          '  PRs:     squad_pr  (opens the PR, or regenerates the title and body of an open one)'
      )

      op = scan(cmd, cwd)
      if op:
          sys.stderr.write(
              f'❌ BLOCKED: {op!r} writes commit or pull request text by hand.\\n\\n'
              'Commits and PR titles/bodies come only from squad. Use squad_commit or squad_pr.\\n'
              + ('Run it with --no-commit (-n), then squad_commit.\\n' if op.endswith(('revert', 'cherry-pick')) else '')
              + USE_SQUAD + '\\n'
          )
          sys.exit(2)

      forbidden = [
          '🤖',
          'Generated with',
          'Co-Authored-By: Claude',
          'Co-authored-by: Claude',
          'claude.com/claude-code',
          'noreply@anthropic.com',
      ]

      git_writes = ['git commit', 'git revert', 'git cherry-pick', 'git rebase', 'git merge', 'git tag', 'git notes']
      gh_writes = ['gh pr create', 'gh pr edit', 'gh pr comment', 'gh issue create', 'gh issue edit', 'gh issue comment', 'gh release create', 'gh release edit']

      triggered = next((f for f in forbidden if f in cmd), None)
      write_op = next((g for g in git_writes + gh_writes if g in cmd), None)

      if triggered and write_op:
          sys.stderr.write(f'❌ BLOCKED: forbidden content {triggered!r} in {write_op!r} command.\\n\\n' + USE_SQUAD + '\\n')
          sys.exit(2)
      sys.exit(0)
      "

  # dangerous_flags: Block dangerous git flags that bypass safety checks (--no-verify, etc.).
  dangerous_flags:
    event: PreToolUse
    tool: Bash
    type: command
    command: |
      python3 -c "
      import json, sys, shlex, re

      data = json.load(sys.stdin)
      cmd = data.get('tool_input', {}).get('command', '')

      if 'git' not in cmd:
          sys.exit(0)

      # Block an option only where a real git invocation would receive it as argv, so
      # searching for or documenting a flag is left alone. Disabling hooks by another
      # name is the same shortcut, so it is caught here too.
      #
      # Deliberately out of scope: anything that has to be constructed to slip past
      # this - a payload nested two levels down, a flag pasted together at runtime
      # from variables or command substitution. Chasing those means reimplementing a
      # shell, and the guardrail is against a careless shortcut, not an adversary
      # who could just as easily edit this file.
      FLAGS = ['--no-verify', '--no-gpg-sign', '--no-post-rewrite']
      HOOK_ENV = ('SKIP', 'HUSKY', 'PRE_COMMIT_ALLOW_NO_CONFIG')
      SHELLS = ('bash', 'sh', 'zsh', 'dash', 'ksh')
      SEPARATORS = '&|;()<>'

      def tokenize(text):
          try:
              lexer = shlex.shlex(text, posix=True, punctuation_chars=True)
              lexer.whitespace_split = True
              return list(lexer)
          except ValueError:
              return text.split()

      def clauses(toks):
          out, cur = [], []
          for tok in toks:
              if tok and all(ch in SEPARATORS for ch in tok):
                  out.append(cur)
                  cur = []
              else:
                  cur.append(tok)
          out.append(cur)
          return out

      def check(clause):
          # The last git token is the invocation and the rest is its argv, which
          # covers exec-style prefixes - sudo, env, timeout, nohup - without
          # enumerating them.
          found = [i for i, tok in enumerate(clause) if tok.split('/')[-1] == 'git']
          if not found:
              return None
          args = clause[found[-1] + 1:]
          for tok in clause:
              if re.match('^(' + '|'.join(HOOK_ENV) + ')=', tok):
                  return tok.split('=')[0] + '='
          for arg in args:
              if arg.startswith('core.hooksPath='):
                  return 'core.hooksPath'
          for flag in FLAGS:
              if flag in args or any(arg.startswith(flag + '=') for arg in args):
                  return flag
          if 'commit' in args and '-n' in args:
              return '-n'
          return None

      def scan(text, depth=0):
          for clause in clauses(tokenize(text)):
              hit = check(clause)
              if hit:
                  return hit
              if depth:
                  continue
              # One level into eval and a shell -c payload. A wrapped command still
              # reads as an ordinary habit; deeper nesting does not.
              for i, tok in enumerate(clause):
                  word, rest = tok.split('/')[-1], clause[i + 1:]
                  if word == 'eval':
                      hit = scan(' '.join(rest), depth + 1)
                  elif word in SHELLS:
                      payload = next((rest[j + 1] for j, arg in enumerate(rest)
                                      if arg.startswith('-') and arg.endswith('c')
                                      and j + 1 < len(rest)), None)
                      hit = scan(payload, depth + 1) if payload else None
                  else:
                      continue
                  if hit:
                      return hit
          return None

      blocked_flag = scan(cmd)

      if blocked_flag:
          msg = f'❌ BLOCKED: Cannot use {blocked_flag} flag.\\n\\nThis flag bypasses important safety checks.\\nFix the underlying issues instead.'
          sys.stderr.write(msg + '\\n')
          sys.exit(2)
      sys.exit(0)
      "
  # post_commit_check: Post-commit safety net — catches forbidden content that slipped past
  # `forbidden_content`. The PreToolUse hook only sees the literal command string, so it misses
  # messages passed via `-F file`, stdin pipes (`squad_commit` uses `git commit -F -`),
  # $variables, editor commits, and squash-merges. This PostToolUse hook runs after any
  # commit-creating command and inspects the resulting commit message; if an attribution
  # footer or trailer landed, it tells Claude to fix the generator and regenerate the commit
  # with `squad_commit`, never to amend it by hand.
  #
  # Detection is line-anchored: a trailer or footer is always a line of its own, whereas a
  # commit that *describes* attribution handling ("strip the Generated with Claude Code
  # footer") is legitimate generated output and must not be blocked. Hook input only carries
  # the session's cwd, so a command that `cd`s into another repo first is followed there.
  post_commit_check:
    event: PostToolUse
    tool: Bash
    type: command
    command: |
      python3 -c "
      import json, sys, subprocess, re, os

      data = json.load(sys.stdin)
      tool_input = data.get('tool_input', {})
      cmd = tool_input.get('command', '')
      cwd = data.get('cwd') or tool_input.get('cwd') or os.getcwd()

      commit_patterns = [
          r'\bgit\s+commit\b',
          r'\bgit\s+revert\b',
          r'\bgit\s+cherry-pick\b',
          r'\bgit\s+rebase\b',
          r'\bgit\s+merge\b',
          r'\bsquad_commit\b',
          r'\bfabric_commit\b',
      ]
      if not any(re.search(p, cmd) for p in commit_patterns):
          sys.exit(0)

      # Follow the last 'cd <dir>' in the command; the hook only sees the session cwd.
      for m in re.finditer(r'(?:^|&&|;|\|\||\s)cd\s+(?:-[qP]+\s+)?([^\s;&|]+)', cmd):
          cwd = os.path.expanduser(os.path.expandvars(m.group(1).strip(chr(39) + chr(34))))

      try:
          msg = subprocess.run(
              ['git', '-C', cwd, 'log', '-1', '--format=%B'],
              capture_output=True, text=True, timeout=5, check=True,
          ).stdout
      except Exception:
          sys.exit(0)

      attribution_lines = [
          r'^\s*(?:🤖\s*)?Generated with (?:\[Claude Code\]\([^)]*\)|Claude Code)[\s.!]*$',
          r'^\s*Co-Authored-By:\s*Claude\b.*$',
          r'^\s*[\w-]+:\s*.*<[^>]*@anthropic\.com>\s*$',
          r'^\s*Claude-Session:\s*https?://\S+\s*$',
          r'^\s*https?://claude\.ai/code/session_\S+\s*$',
      ]
      hits = [
          ln.strip() for ln in msg.splitlines()
          if any(re.match(p, ln, re.IGNORECASE) for p in attribution_lines)
      ]
      if hits:
          err = (
              f'❌ Last commit contains forbidden content (attribution lines): {hits!r}\\n\\n'
              'The commit generator leaked it. Do NOT amend by hand; forbidden_content denies git commit.\\n'
              'Fix the source (squad-agents commit agent or scripts/filter.py), then regenerate:\\n'
              '  git reset --soft HEAD~1 && squad_commit\\n'
              'If the bad commit was already pushed, follow up with: git push --force-with-lease\\n'
          )
          sys.stderr.write(err + '\\n')
          sys.exit(2)
      sys.exit(0)
      "

  # post_pr_check: Post-PR safety net for pull request bodies. `squad_pr` generates the
  # body with `claude -p`, and Claude Code's own attribution setting tells that model to end
  # PR descriptions with "🤖 Generated with [Claude Code](...)". The text never appears in
  # the literal command string (`squad_pr`), so `forbidden_content` cannot see it, and
  # `post_commit_check` only inspects commit messages. This PostToolUse hook runs after any
  # PR-creating or PR-editing command, reads the PR back via `gh pr view`, and blocks if an
  # attribution footer or trailer landed — with instructions to fix the generator, never
  # the PR by hand.
  #
  # Detection is line-anchored: a footer or trailer is always a line of its own, whereas a
  # PR that *describes* attribution handling ("strips the Generated with Claude Code
  # footer") is legitimate and must not be blocked. Hook input only carries the session's
  # cwd, so a command that `cd`s into another repo before `squad_pr` is followed there.
  post_pr_check:
    event: PostToolUse
    tool: Bash
    type: command
    command: |
      python3 -c "
      import json, sys, subprocess, re, os

      data = json.load(sys.stdin)
      tool_input = data.get('tool_input', {})
      cmd = tool_input.get('command', '')
      cwd = data.get('cwd') or tool_input.get('cwd') or os.getcwd()

      pr_patterns = [
          r'\bsquad_pr\b',
          r'\bfabric_pr\b',
          r'\bgh\s+pr\s+create\b',
          r'\bgh\s+pr\s+edit\b',
      ]
      if not any(re.search(p, cmd) for p in pr_patterns):
          sys.exit(0)

      # Follow the last 'cd <dir>' in the command; the hook only sees the session cwd.
      for m in re.finditer(r'(?:^|&&|;|\|\||\s)cd\s+(?:-[qP]+\s+)?([^\s;&|]+)', cmd):
          cwd = os.path.expanduser(os.path.expandvars(m.group(1).strip(chr(39) + chr(34))))

      # 'gh pr edit 123 ...' names its target; everything else resolves from the branch.
      m = re.search(r'\bgh\s+pr\s+edit\s+([^\s-]\S*)', cmd)
      selector = [m.group(1)] if m else []

      try:
          out = subprocess.run(
              ['gh', 'pr', 'view', *selector, '--json', 'title,body'],
              cwd=cwd, capture_output=True, text=True, timeout=30, check=True,
          ).stdout
          pr = json.loads(out)
      except Exception:
          sys.exit(0)

      text = (pr.get('title') or '') + chr(10) + (pr.get('body') or '')

      attribution_lines = [
          r'^\s*(?:🤖\s*)?Generated with (?:\[Claude Code\]\([^)]*\)|Claude Code)[\s.!]*$',
          r'^\s*Co-Authored-By:\s*Claude\b.*$',
          r'^\s*[\w-]+:\s*.*<[^>]*@anthropic\.com>\s*$',
          r'^\s*Claude-Session:\s*https?://\S+\s*$',
          r'^\s*https?://claude\.ai/code/session_\S+\s*$',
      ]
      hits = [
          ln.strip() for ln in text.splitlines()
          if any(re.match(p, ln, re.IGNORECASE) for p in attribution_lines)
      ]
      if hits:
          err = (
              f'❌ Pull request title/body contains forbidden content (attribution lines): {hits!r}\\n\\n'
              'The PR generator leaked AI attribution. Do NOT hand-edit the PR body.\\n'
              'Fix the source, then re-run squad_pr to regenerate the body:\\n'
              '  - squad must pass --settings hiding attribution (rebuild squad from main)\\n'
              '  - fabric-patterns-hub scripts/filter.py must strip attribution lines\\n'
          )
          sys.stderr.write(err + '\\n')
          sys.exit(2)
      sys.exit(0)
      "

  # stop_sound: Sound notification when Claude finishes a task.
  stop_sound:
    event: Stop
    tool: ""
    type: command
    command: >-
      {{ "osascript -e 'beep 2'" if (ansible_facts['os_family'] | default('')) == 'Darwin' else "printf '\\a'" }}

  # notify_sound: Sound notification when Claude needs input.
  notify_sound:
    event: Notification
    tool: ""
    type: command
    command: >-
      {{ "osascript -e 'beep 1'" if (ansible_facts['os_family'] | default('')) == 'Darwin' else "printf '\\a'" }}

# Per-host overrides for the dict above. Keys here are merged into
# `claude_code_advanced_hooks_default` (recursive=True), so individual hooks can be
# customized without copy-pasting the whole map.
claude_code_advanced_hooks_overrides: {}

# Final assembled list passed to the template. Built from defaults + overrides; entries
# whose value is `null` (after merge) are filtered out so a host can disable a default hook
# by setting `<key>: ~` in the overrides.
claude_code_advanced_hooks: >-
  {{
    (claude_code_advanced_hooks_default | combine(claude_code_advanced_hooks_overrides, recursive=True))
    | dict2items | rejectattr('value', 'none') | map(attribute='value') | list
  }}

# Attribution Claude Code appends on its own: a "Co-Authored-By: Claude ..." trailer on
# commits and a "Generated with Claude Code" footer on pull request descriptions. Empty
# strings hide both and sessionUrl: false drops the claude.ai session link. The hooks above
# forbid exactly this content, so hiding it at the source keeps interactive sessions and
# `claude -p` runs that inherit user settings from ever producing it. Set to {} to keep
# Claude Code's defaults. An `attribution` key in claude_code_additional_settings wins.
claude_code_attribution:
  commit: ""
  pr: ""
  sessionUrl: false

# Whether Claude Code skips its confirmation before entering bypass-permissions mode
# (`--dangerously-skip-permissions`). That prompt is the last check before a session runs
# every tool without asking, so it stays on unless a host opts out. Always rendered, so a
# converge also resets a value toggled in the app. A `skipDangerousModePermissionPrompt`
# key in claude_code_additional_settings wins.
claude_code_skip_dangerous_mode_permission_prompt: false

# Additional settings (optional)
claude_code_additional_settings: {}

# MCP Server Management
claude_code_manage_mcp_servers: true  # Whether to manage MCP servers

# List of MCP servers to install
# Each server supports: name, scope, command, args, env, state
claude_code_mcp_servers: []
# Example:
#   - name: chrome-devtools
#     scope: user  # user or project
#     command: npx
#     args:
#       - "-y"
#       - "chrome-devtools-mcp@latest"
#     state: present  # present or absent
#
#   - name: grafana
#     scope: user
#     command: "{{ claude_code_user_home }}/.local/bin/mcp-grafana"
#     env:
#       GRAFANA_URL: "https://grafana.example.com"
#       GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ vault_grafana_token }}"
#     state: present
#
#   - name: warpgate
#     scope: user
#     command: "{{ claude_code_user_home }}/go/bin/warpgate-mcp-server"
#     args:
#       - stdio
#     state: present

# Remote Control hosts (macOS only). Each host listed in a private hosts file
# becomes a LaunchAgent that runs `claude remote-control` in its directory,
# starts at login, and restarts if it exits, so sessions can be started from
# claude.ai/code or the mobile app without a terminal tab holding the host open.
#
# The list of directories lives outside this repository, in a YAML file on the
# target that the role reads but never writes:
#
#   hosts:
#     - name: example            # required; label suffix and log name ([A-Za-z0-9_.-])
#       dir: ~/src/example       # required; must exist and already be trusted
#       spawn: worktree          # optional; same-dir | worktree | session
#       capacity: 32             # optional; max concurrent sessions
#       permission_mode: default # optional; permission mode for spawned sessions
#       chrome: true             # optional; Claude in Chrome for spawned sessions
#
# Omitted keys fall back to the claude_code_remote_control_* defaults below.
# The file is the source of truth: on each run, LaunchAgents under the label
# prefix that it no longer lists are unloaded and removed, and `hosts: []`
# removes them all. When the file does not exist the role leaves any existing
# agents alone and creates none. Ignored on Linux and Windows. See
# docs/REMOTE_CONTROL.md for prerequisites and switching over from terminal tabs.
claude_code_manage_remote_control: true
claude_code_remote_control_config: "{{ claude_code_user_home }}/.config/claude-rc/hosts.yml"

claude_code_remote_control_spawn: worktree
claude_code_remote_control_capacity: 32
# Empty leaves Claude Code's own default permission mode.
claude_code_remote_control_permission_mode: ""
claude_code_remote_control_chrome: true

# LaunchAgent label is "<prefix>.<name>". Anything installed under this prefix
# that the hosts file does not list is removed, so keep it unique to this role.
claude_code_remote_control_label_prefix: "com.cowdogmoo.claude-rc"

# Seconds launchd waits before restarting a host that exited, so a host that
# fails on start (logged out, untrusted dir) retries slowly instead of spinning.
claude_code_remote_control_throttle_interval: 30

# Each host appends stdout and stderr to <log dir>/<name>.log. ~/logs is where
# non-Ansible launchd agents log; rotate it with the logging role (copytruncate,
# since launchd keeps the file open).
claude_code_remote_control_log_dir: "{{ claude_code_user_home }}/logs/claude-remote-control"

# Path to the claude binary. Empty resolves the first existing candidate below.
# The native installer's ~/.local/bin/claude symlink comes first: it follows
# auto-updates, whereas a versioned path under ~/.local/share/claude/versions is
# pruned after an update and would leave the agent pointing at nothing.
claude_code_remote_control_binary: ""
claude_code_remote_control_binary_candidates:
  - "{{ claude_code_user_home }}/.local/bin/claude"
  - "{{ claude_code_homebrew_prefix }}/bin/claude"

# launchd starts agents with a bare PATH and no shell profile. This mirrors the
# parts of an interactive login shell that the host and its sessions need:
# claude, git, gh, and mise shims for tools pinned through mise.
claude_code_remote_control_path: >-
  {{ claude_code_user_home }}/.local/bin:{{ claude_code_user_home }}/.local/share/mise/shims:{{ claude_code_homebrew_prefix }}/bin:{{ claude_code_homebrew_prefix }}/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

claude_code_remote_control_base_environment:
  HOME: "{{ claude_code_user_home }}"
  USER: "{{ claude_code_username }}"
  LOGNAME: "{{ claude_code_username }}"
  SHELL: "{{ ansible_facts['user_shell'] | default('/bin/zsh') }}"
  PATH: "{{ claude_code_remote_control_path | trim }}"
  LANG: en_US.UTF-8

# Extra environment variables for every host, merged over the base above.
claude_code_remote_control_environment: {}
