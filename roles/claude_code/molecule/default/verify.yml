---
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    container_user: "{{ ansible_facts['distribution'] | lower }}"
    container_home: "/home/{{ container_user }}"
  tasks:
    - name: Set home directory and config facts
      ansible.builtin.set_fact:
        claude_code_user_home: "{{ container_home }}"
        claude_code_config_dir: "{{ container_home }}/.claude"
        claude_code_username: "{{ container_user }}"
        claude_code_rules_dir: "{{ container_home }}/.claude/rules"
        claude_code_scripts_dir: "{{ container_home }}/.claude/scripts"

    - name: Include default variables
      ansible.builtin.include_vars:
        file: "../../defaults/main.yml"

    - name: Check if claude binary is in PATH
      ansible.builtin.command: which claude
      environment:
        PATH: "{{ claude_code_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      register: claude_code_which_check
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Debug claude location
      ansible.builtin.debug:
        msg: "Claude found at: {{ claude_code_which_check.stdout }}"
      when: claude_code_which_check.rc == 0

    - name: Assert claude is installed
      ansible.builtin.assert:
        that:
          - claude_code_which_check.rc == 0
          - claude_code_which_check.stdout | length > 0
        fail_msg: "Claude Code CLI is not installed or not in PATH"
        success_msg: "Claude Code CLI is installed at: {{ claude_code_which_check.stdout }}"

    - name: Test claude command
      ansible.builtin.command: claude --version
      environment:
        PATH: "{{ claude_code_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      register: claude_code_version_output
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Assert claude command works
      ansible.builtin.assert:
        that:
          - claude_code_version_output.rc == 0
          - >
            ('claude' in claude_code_version_output.stdout.lower()) or
            (claude_code_version_output.stdout | regex_search('v?[0-9]+\.[0-9]+\.[0-9]+') is not none)
        fail_msg: "Claude command failed or version output not recognized. Output was: {{ claude_code_version_output.stdout }}"
        success_msg: "Claude command works, version: {{ claude_code_version_output.stdout }}"

    - name: Check if claude config directory exists
      ansible.builtin.stat:
        path: "{{ claude_code_config_dir }}"
      register: claude_code_config_dir_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert claude config directory exists
      ansible.builtin.assert:
        that:
          - claude_code_config_dir_stat.stat.exists
          - claude_code_config_dir_stat.stat.isdir
          - claude_code_config_dir_stat.stat.mode == '0755'
        fail_msg: "Claude config directory does not exist or has wrong permissions"
        success_msg: "Claude config directory exists with correct permissions"

    - name: Check if settings.json exists
      ansible.builtin.stat:
        path: "{{ claude_code_config_dir }}/settings.json"
      register: claude_code_settings_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert settings.json exists
      ansible.builtin.assert:
        that:
          - claude_code_settings_stat.stat.exists
          - claude_code_settings_stat.stat.mode == '0644'
        fail_msg: "settings.json does not exist or has wrong permissions"
        success_msg: "settings.json exists with correct permissions"

    - name: Check if CLAUDE.md exists
      ansible.builtin.stat:
        path: "{{ claude_code_config_dir }}/CLAUDE.md"
      register: claude_code_claude_md_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert CLAUDE.md exists with correct permissions
      ansible.builtin.assert:
        that:
          - claude_code_claude_md_stat.stat.exists
          - claude_code_claude_md_stat.stat.mode == '0644'
          - claude_code_claude_md_stat.stat.pw_name == container_user
        fail_msg: "CLAUDE.md does not exist or has wrong permissions/ownership"
        success_msg: "CLAUDE.md exists with correct permissions and ownership"

    - name: Read CLAUDE.md content
      ansible.builtin.slurp:
        path: "{{ claude_code_config_dir }}/CLAUDE.md"
      register: claude_code_claude_md_content
      become: true
      become_user: "{{ container_user }}"

    - name: Assert CLAUDE.md contains expected content
      ansible.builtin.assert:
        that:
          - "'Global Claude Code Instructions' in (claude_code_claude_md_content['content'] | b64decode)"
          - "'.claude Directory and Version Control' in (claude_code_claude_md_content['content'] | b64decode)"
          - "'settings.local.json' in (claude_code_claude_md_content['content'] | b64decode)"
          - "'Git Workflow' in (claude_code_claude_md_content['content'] | b64decode)"
          - "'squad_commit' in (claude_code_claude_md_content['content'] | b64decode)"
          - "'--no-verify' in (claude_code_claude_md_content['content'] | b64decode)"
        fail_msg: "CLAUDE.md does not contain expected instructions"
        success_msg: "CLAUDE.md contains all expected global instructions"

    - name: Check if rules directory exists
      ansible.builtin.stat:
        path: "{{ claude_code_rules_dir }}"
      register: claude_code_rules_dir_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert rules directory exists with correct permissions
      ansible.builtin.assert:
        that:
          - claude_code_rules_dir_stat.stat.exists
          - claude_code_rules_dir_stat.stat.isdir
          - claude_code_rules_dir_stat.stat.mode == '0755'
        fail_msg: "Rules directory does not exist or has wrong permissions"
        success_msg: "Rules directory exists with correct permissions"

    - name: Check if scripts directory exists
      ansible.builtin.stat:
        path: "{{ claude_code_scripts_dir }}"
      register: claude_code_scripts_dir_stat
      become: true
      become_user: "{{ container_user }}"

    - name: Assert scripts directory exists with correct permissions
      ansible.builtin.assert:
        that:
          - claude_code_scripts_dir_stat.stat.exists
          - claude_code_scripts_dir_stat.stat.isdir
          - claude_code_scripts_dir_stat.stat.mode == '0755'
        fail_msg: "Scripts directory does not exist or has wrong permissions"
        success_msg: "Scripts directory exists with correct permissions"

    - name: Read settings.json content
      ansible.builtin.slurp:
        path: "{{ claude_code_config_dir }}/settings.json"
      register: claude_code_settings_content
      become: true
      become_user: "{{ container_user }}"

    - name: Parse settings.json
      ansible.builtin.set_fact:
        claude_code_settings: "{{ claude_code_settings_content['content'] | b64decode | from_json }}"

    - name: Display parsed settings for debugging
      ansible.builtin.debug:
        var: claude_code_settings

    - name: Assert settings.json has hooks configuration
      ansible.builtin.assert:
        that:
          - claude_code_settings.hooks is defined
          - claude_code_settings.hooks is mapping
          - claude_code_settings.hooks.PreToolUse is defined
        fail_msg: "settings.json does not contain proper hooks configuration"
        success_msg: "settings.json contains hooks configuration"

    - name: Assert PreToolUse hooks have correct structure
      ansible.builtin.assert:
        that:
          - claude_code_settings.hooks.PreToolUse is sequence
          - claude_code_settings.hooks.PreToolUse | length > 0
        fail_msg: "PreToolUse hooks not properly configured"
        success_msg: "PreToolUse has {{ claude_code_settings.hooks.PreToolUse | length }} matcher group(s)"

    - name: Assert each matcher group has required fields
      ansible.builtin.assert:
        that:
          - item.matcher is defined
          - item.hooks is defined
          - item.hooks is sequence
          - item.hooks | length > 0
        fail_msg: "Matcher group is missing required fields"
        success_msg: "Matcher group has {{ item.hooks | length }} hook(s)"
      loop: "{{ claude_code_settings.hooks.PreToolUse }}"
      loop_control:
        label: "{{ item.matcher }}"

    - name: Count total hooks configured
      ansible.builtin.set_fact:
        claude_code_total_hooks: "{{ claude_code_settings.hooks.PreToolUse | map(attribute='hooks') | map('length') | sum }}"

    - name: Assert we have all expected hooks (3 simple + 1 advanced = 4 total)
      ansible.builtin.assert:
        that:
          - claude_code_total_hooks | int == 4
        fail_msg: "Expected 4 hooks but found {{ claude_code_total_hooks }}"
        success_msg: "All 4 hooks are properly configured"

    - name: Verify hook commands are Python-based
      ansible.builtin.assert:
        that:
          - item.type == 'command'
          - "'python3' in item.command"
        fail_msg: "Hook is not properly formatted"
        success_msg: "Hook has correct structure"
      loop: "{{ claude_code_settings.hooks.PreToolUse[0].hooks }}"
      loop_control:
        label: "{{ item.type }}"

    - name: Verify simple hooks were converted correctly
      ansible.builtin.assert:
        that:
          - "'rm -rf /' in claude_code_settings.hooks.PreToolUse[0].hooks[1].command"
          - "'Dangerous command blocked' in claude_code_settings.hooks.PreToolUse[0].hooks[1].command"
          - "'git' in claude_code_settings.hooks.PreToolUse[0].hooks[2].command"
          - "'safe' in claude_code_settings.hooks.PreToolUse[0].hooks[2].command"
        fail_msg: "Simple hooks were not converted correctly"
        success_msg: "Simple hooks were converted to Python commands correctly"

    - name: Verify advanced hook is preserved as-is
      ansible.builtin.assert:
        that:
          - claude_code_settings.hooks.PreToolUse[0].hooks[3].type == 'command'
          - "'import json, sys; sys.exit(0)' in claude_code_settings.hooks.PreToolUse[0].hooks[3].command"
        fail_msg: "Advanced hook was not preserved correctly"
        success_msg: "Advanced hook was preserved correctly"

    - name: Verify matcher is set correctly
      ansible.builtin.assert:
        that:
          - claude_code_settings.hooks.PreToolUse[0].matcher == 'Bash'
        fail_msg: "Matcher is not set to Bash"
        success_msg: "Matcher is correctly set to Bash"

    - name: Check if backup was created in /tmp (if settings existed before)
      ansible.builtin.find:
        paths: "/tmp"
        patterns: "settings.json.*.backup"
      register: claude_code_backup_files
      become: true
      become_user: "{{ container_user }}"

    - name: Display backup status
      ansible.builtin.debug:
        msg: "Found {{ claude_code_backup_files.matched }} backup file(s) in /tmp"

    - name: Verify file ownership
      ansible.builtin.stat:
        path: "{{ claude_code_config_dir }}/settings.json"
      register: claude_code_settings_ownership
      become: true
      become_user: "{{ container_user }}"

    - name: Assert correct file ownership
      ansible.builtin.assert:
        that:
          - claude_code_settings_ownership.stat.pw_name == container_user
        fail_msg: "settings.json has incorrect ownership"
        success_msg: "settings.json has correct ownership ({{ container_user }})"

    # Test empty hooks scenario
    - name: Read settings.json from empty hooks test
      ansible.builtin.slurp:
        path: "{{ container_home }}/.claude-empty/settings.json"
      register: claude_code_empty_settings_content
      become: true
      become_user: "{{ container_user }}"

    - name: Parse empty settings.json
      ansible.builtin.set_fact:
        claude_code_empty_settings: "{{ claude_code_empty_settings_content['content'] | b64decode | from_json }}"

    - name: Assert empty hooks settings has no hooks
      ansible.builtin.assert:
        that:
          - claude_code_empty_settings.hooks is not defined or claude_code_empty_settings.hooks | length == 0
        fail_msg: "Empty hooks should result in no hooks configuration"
        success_msg: "Empty hooks correctly generates settings without hooks"

    # Test simple-only hooks scenario
    - name: Read settings.json from simple-only hooks test
      ansible.builtin.slurp:
        path: "{{ container_home }}/.claude-simple/settings.json"
      register: claude_code_simple_settings_content
      become: true
      become_user: "{{ container_user }}"

    - name: Parse simple-only settings.json
      ansible.builtin.set_fact:
        claude_code_simple_settings: "{{ claude_code_simple_settings_content['content'] | b64decode | from_json }}"

    - name: Assert simple-only hooks work correctly
      ansible.builtin.assert:
        that:
          - claude_code_simple_settings.hooks is defined
          - claude_code_simple_settings.hooks.PreToolUse is defined
          - claude_code_simple_settings.hooks.PreToolUse[0].hooks | length == 1
          - "'Simple hook only' in claude_code_simple_settings.hooks.PreToolUse[0].hooks[0].command"
        fail_msg: "Simple-only hooks not configured correctly"
        success_msg: "Simple-only hooks work correctly"

    # Test advanced-only hooks scenario
    - name: Read settings.json from advanced-only hooks test
      ansible.builtin.slurp:
        path: "{{ container_home }}/.claude-advanced/settings.json"
      register: claude_code_advanced_settings_content
      become: true
      become_user: "{{ container_user }}"

    - name: Parse advanced-only settings.json
      ansible.builtin.set_fact:
        claude_code_advanced_settings: "{{ claude_code_advanced_settings_content['content'] | b64decode | from_json }}"

    - name: Assert advanced-only hooks work correctly
      ansible.builtin.assert:
        that:
          - claude_code_advanced_settings.hooks is defined
          - claude_code_advanced_settings.hooks.PreToolUse is defined
          - claude_code_advanced_settings.hooks.PreToolUse[0].hooks | length == 1
          - "'Advanced hook' in claude_code_advanced_settings.hooks.PreToolUse[0].hooks[0].command"
          - claude_code_advanced_settings.hooks.PreToolUse[0].hooks[0].type == 'command'
        fail_msg: "Advanced-only hooks not configured correctly"
        success_msg: "Advanced-only hooks work correctly"

    # MCP Server verification (after side_effect removal test)
    - name: Verify MCP servers list after side_effect removal  # noqa: var-naming[no-role-prefix]
      ansible.builtin.command:
        cmd: claude mcp list
      environment:
        HOME: "{{ claude_code_user_home }}"
        PATH: "{{ claude_code_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      register: mcp_list_result
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Display MCP list output for debugging
      ansible.builtin.debug:
        var: mcp_list_result.stdout

    - name: Assert MCP server was removed by side_effect
      ansible.builtin.assert:
        that:
          - "'chrome-devtools' not in mcp_list_result.stdout"
        fail_msg: "MCP server 'chrome-devtools' should have been removed by side_effect: {{ mcp_list_result.stdout }}"
        success_msg: "MCP server 'chrome-devtools' was successfully removed (state: absent verified)"

    # Attribution is hidden in every rendered settings.json, not only the defaults run
    - name: Assert settings.json hides Claude Code attribution
      ansible.builtin.assert:
        that:
          - claude_code_settings.attribution is defined
          - claude_code_settings.attribution.commit == ''
          - claude_code_settings.attribution.pr == ''
          - claude_code_settings.attribution.sessionUrl is sameas false
        fail_msg: "settings.json does not hide commit/PR attribution"
        success_msg: "settings.json hides commit and PR attribution"

    # Test default-hooks scenario: the role's own advanced hook map, nothing overridden
    - name: Read settings.json from default-hooks test
      ansible.builtin.slurp:
        path: "{{ container_home }}/.claude-defaults/settings.json"
      register: claude_code_defaults_settings_content
      become: true
      become_user: "{{ container_user }}"

    - name: Parse default-hooks settings.json
      ansible.builtin.set_fact:
        claude_code_defaults_settings: "{{ claude_code_defaults_settings_content['content'] | b64decode | from_json }}"

    - name: Collect PostToolUse Bash hook commands from the default-hooks settings
      ansible.builtin.set_fact:
        claude_code_defaults_post_cmds: >-
          {{
            claude_code_defaults_settings.hooks.PostToolUse
            | selectattr('matcher', 'equalto', 'Bash')
            | map(attribute='hooks') | flatten | map(attribute='command') | list
          }}
        claude_code_defaults_pre_cmds: >-
          {{
            claude_code_defaults_settings.hooks.PreToolUse
            | selectattr('matcher', 'equalto', 'Bash')
            | map(attribute='hooks') | flatten | map(attribute='command') | list
          }}

    - name: Assert default hooks guard commits and pull requests against attribution
      ansible.builtin.assert:
        that:
          - claude_code_defaults_post_cmds | select('search', 'squad_pr') | select('search', 'gh') | list | length == 1
          - claude_code_defaults_post_cmds | select('search', 'squad_commit') | select('search', 'git') | list | length == 1
          - claude_code_defaults_pre_cmds | select('search', 'squad_pr') | list | length == 1
          - claude_code_defaults_pre_cmds | select('search', 'no-verify') | list | length == 1
          - claude_code_defaults_settings.attribution.pr == ''
        fail_msg: "Default hooks are missing post_pr_check, post_commit_check, or forbidden_content"
        success_msg: "Default hooks cover PR bodies, commit messages, and literal commands"

    - name: Run post_pr_check against a PR body carrying the Claude Code footer
      ansible.builtin.shell: |
        set -o pipefail
        tmp=$(mktemp -d)
        cat > "$tmp/gh" <<'GH'
        #!/bin/sh
        printf '%s' '{"title":"docs: x","body":"body\n\nGenerated with [Claude Code](https://claude.com/claude-code)"}'
        GH
        chmod +x "$tmp/gh"
        cat > "$tmp/hook.sh" <<'HOOK'
        {{ claude_code_defaults_post_cmds | select('search', 'squad_pr') | first }}
        HOOK
        printf '%s' '{"tool_input":{"command":"squad_pr"},"cwd":"/tmp"}' | PATH="$tmp:$PATH" sh "$tmp/hook.sh" 2>"$tmp/err"
        rc=$?
        cat "$tmp/err"
        rm -rf "$tmp"
        exit $rc
      args:
        executable: /bin/bash
      register: claude_code_post_pr_check_positive
      changed_when: false
      failed_when: false

    - name: Assert post_pr_check blocks a PR body carrying the footer
      ansible.builtin.assert:
        that:
          - claude_code_post_pr_check_positive.rc == 2
          - "'forbidden content' in claude_code_post_pr_check_positive.stdout"
        fail_msg: "post_pr_check did not block: rc={{ claude_code_post_pr_check_positive.rc }} out={{ claude_code_post_pr_check_positive.stdout }}"
        success_msg: "post_pr_check blocks attribution in PR bodies"

    - name: Run post_pr_check against a clean PR body
      ansible.builtin.shell: |
        set -o pipefail
        tmp=$(mktemp -d)
        cat > "$tmp/gh" <<'GH'
        #!/bin/sh
        printf '%s' '{"title":"docs: x","body":"a clean body"}'
        GH
        chmod +x "$tmp/gh"
        cat > "$tmp/hook.sh" <<'HOOK'
        {{ claude_code_defaults_post_cmds | select('search', 'squad_pr') | first }}
        HOOK
        printf '%s' '{"tool_input":{"command":"squad_pr"},"cwd":"/tmp"}' | PATH="$tmp:$PATH" sh "$tmp/hook.sh"
        rc=$?
        rm -rf "$tmp"
        exit $rc
      args:
        executable: /bin/bash
      register: claude_code_post_pr_check_negative
      changed_when: false
      failed_when: false

    - name: Assert post_pr_check passes a clean PR body
      ansible.builtin.assert:
        that:
          - claude_code_post_pr_check_negative.rc == 0
        fail_msg: "post_pr_check blocked a clean PR: {{ claude_code_post_pr_check_negative.stderr }}"
        success_msg: "post_pr_check passes clean PR bodies"

    # post_commit_check: same line-anchored rule, exercised in a throwaway git repo
    - name: Check whether git is available for the post_commit_check tests
      ansible.builtin.command: which git
      register: claude_code_git_check
      changed_when: false
      failed_when: false

    - name: Run post_commit_check against a commit carrying a Claude trailer
      ansible.builtin.shell: |
        set -o pipefail
        tmp=$(mktemp -d)
        export HOME="$tmp" GIT_AUTHOR_NAME=t GIT_AUTHOR_EMAIL=t@example.com GIT_COMMITTER_NAME=t GIT_COMMITTER_EMAIL=t@example.com
        git init -q "$tmp/repo" && cd "$tmp/repo" && echo x > f && git add f
        printf '%s\n' 'fix: thing' '' '- did it' '' 'Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>' | git commit -q --no-verify --cleanup=verbatim -F -
        cat > "$tmp/hook.sh" <<'HOOK'
        {{ claude_code_defaults_post_cmds | select('search', 'squad_commit') | first }}
        HOOK
        printf '%s' "{\"tool_input\":{\"command\":\"squad_commit\"},\"cwd\":\"$tmp/repo\"}" | sh "$tmp/hook.sh" 2>"$tmp/err"
        rc=$?
        cat "$tmp/err"
        rm -rf "$tmp"
        exit $rc
      args:
        executable: /bin/bash
      register: claude_code_post_commit_check_positive
      changed_when: false
      failed_when: false
      when: claude_code_git_check.rc == 0

    - name: Assert post_commit_check blocks a commit carrying a Claude trailer
      ansible.builtin.assert:
        that:
          - claude_code_post_commit_check_positive.rc == 2
          - "'forbidden content' in claude_code_post_commit_check_positive.stdout"
        fail_msg: "post_commit_check did not block: rc={{ claude_code_post_commit_check_positive.rc }} out={{ claude_code_post_commit_check_positive.stdout }}"
        success_msg: "post_commit_check blocks attribution trailers"
      when: claude_code_git_check.rc == 0

    - name: Run post_commit_check against a commit that only describes the footer
      ansible.builtin.shell: |
        set -o pipefail
        tmp=$(mktemp -d)
        export HOME="$tmp" GIT_AUTHOR_NAME=t GIT_AUTHOR_EMAIL=t@example.com GIT_COMMITTER_NAME=t GIT_COMMITTER_EMAIL=t@example.com
        git init -q "$tmp/repo" && cd "$tmp/repo" && echo x > f && git add f
        printf '%s\n' 'feat: add post_pr_check hook' '' '- blocks on "Generated with Claude Code" footer lines and Co-Authored-By: Claude trailers' | git commit -q --no-verify --cleanup=verbatim -F -
        cat > "$tmp/hook.sh" <<'HOOK'
        {{ claude_code_defaults_post_cmds | select('search', 'squad_commit') | first }}
        HOOK
        printf '%s' "{\"tool_input\":{\"command\":\"squad_commit\"},\"cwd\":\"$tmp/repo\"}" | sh "$tmp/hook.sh"
        rc=$?
        rm -rf "$tmp"
        exit $rc
      args:
        executable: /bin/bash
      register: claude_code_post_commit_check_prose
      changed_when: false
      failed_when: false
      when: claude_code_git_check.rc == 0

    - name: Assert post_commit_check passes a commit that only describes the footer
      ansible.builtin.assert:
        that:
          - claude_code_post_commit_check_prose.rc == 0
        fail_msg: "post_commit_check blocked a legitimate message: {{ claude_code_post_commit_check_prose.stderr }}"
        success_msg: "post_commit_check passes prose mentions"
      when: claude_code_git_check.rc == 0
