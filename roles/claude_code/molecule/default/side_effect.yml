---
# side_effect.yml - Tests non-idempotent scenarios like MCP removal
- name: Side Effect - Test MCP server removal
  hosts: all
  tasks:
    - name: Set container variables based on distribution  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        container_user: "{{ ansible_facts['distribution'] | lower }}"

    - name: Set container home  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        container_home: "/home/{{ container_user }}"

    - name: Ensure test user and home directory exist
      ansible.builtin.user:
        name: "{{ container_user }}"
        shell: /bin/bash
        create_home: true
        home: "{{ container_home }}"
      become: true

    - name: Set home directory fact  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        ansible_env:
          HOME: "{{ container_home }}"

    - name: Include default variables
      ansible.builtin.include_vars:
        file: "../../defaults/main.yml"

    # Test MCP server removal (state: absent)
    # NOTE: claude_code_manage_settings: false prevents overwriting hooks
    - name: Test MCP server removal
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.claude_code
      vars:
        claude_code_username: "{{ container_user }}"
        claude_code_user_home: "{{ container_home }}"
        claude_code_config_dir: "{{ container_home }}/.claude"
        claude_code_manage_settings: false
        claude_code_mcp_servers:
          - name: chrome-devtools
            scope: user
            state: absent

    - name: Verify MCP server was removed  # noqa: var-naming[no-role-prefix]
      ansible.builtin.command:
        cmd: claude mcp list
      environment:
        HOME: "{{ container_home }}"
        PATH: "{{ container_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
      register: mcp_list_result
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ container_user }}"

    - name: Assert MCP server was removed
      ansible.builtin.assert:
        that:
          - "'chrome-devtools' not in mcp_list_result.stdout"
        fail_msg: "MCP server 'chrome-devtools' should have been removed but found in: {{ mcp_list_result.stdout }}"
        success_msg: "MCP server 'chrome-devtools' was successfully removed (state: absent works)"

    # Back up settings.json only when a run changes it. The same hooks twice must
    # leave no backup; three changes with a retention of 2 must leave the two
    # newest. verify.yml checks the surviving copies.
    - name: Render settings.json twice with the same hooks
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.claude_code
      vars:
        claude_code_username: "{{ container_user }}"
        claude_code_user_home: "{{ container_home }}"
        claude_code_config_dir: "{{ container_home }}/.claude-backup"
        claude_code_install: false
        claude_code_manage_mcp_servers: false
        claude_code_settings_backup_keep: 2
        claude_code_advanced_hooks: []
        claude_code_simple_hooks:
          - name: "Backup marker"
            action: notify
            message: "backup-marker-{{ claude_code_backup_version }}"
      loop:
        - v1
        - v1
      loop_control:
        loop_var: claude_code_backup_version

    - name: Check for a backup directory after unchanged runs
      ansible.builtin.stat:
        path: "{{ container_home }}/.claude-backup/backups"
      register: claude_code_unchanged_backup_dir
      become: true

    - name: Assert unchanged runs took no backup
      ansible.builtin.assert:
        that:
          - not claude_code_unchanged_backup_dir.stat.exists
        fail_msg: "A run that left settings.json unchanged still created a backup"
        success_msg: "Unchanged runs leave no backup behind"

    - name: Render settings.json with changing hooks
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.claude_code
      vars:
        claude_code_username: "{{ container_user }}"
        claude_code_user_home: "{{ container_home }}"
        claude_code_config_dir: "{{ container_home }}/.claude-backup"
        claude_code_install: false
        claude_code_manage_mcp_servers: false
        claude_code_settings_backup_keep: 2
        claude_code_advanced_hooks: []
        claude_code_simple_hooks:
          - name: "Backup marker"
            action: notify
            message: "backup-marker-{{ claude_code_backup_version }}"
      loop:
        - v2
        - v3
        - v4
      loop_control:
        loop_var: claude_code_backup_version
