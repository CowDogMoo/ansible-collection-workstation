---
- name: Prepare
  hosts: all
  gather_facts: true
  vars:
    container_user: "{{ ansible_facts['distribution'] | lower }}"
    container_home: "/home/{{ container_user }}"
  tasks:
    - name: Create test user
      ansible.builtin.user:
        name: "{{ container_user }}"
        shell: /bin/bash
        create_home: true
      become: true

    - name: Set home directory fact  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        ansible_env:
          HOME: "{{ container_home }}"

    # Node comes from the distro rather than NodeSource. The NodeSource signing key
    # URL began returning 403 to every client, which broke prepare outright, and the
    # packaged versions already clear Claude Code's >=18 floor (Ubuntu 24.04 ships
    # 18.19, Kali ships 24.18). Dropping the third-party repo also drops a network
    # dependency that CI cannot control.
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - nodejs
        state: present
        update_cache: true
      become: true
