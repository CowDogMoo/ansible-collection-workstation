---
- name: Set claude_code username for Kali systems
  ansible.builtin.set_fact:
    claude_code_username: "kali"
  when: ansible_facts['distribution_release'] == "kali-rolling" and claude_code_username is not defined

- name: Ensure claude_code user home directory exists
  ansible.builtin.stat:
    path: "{{ claude_code_user_home }}"
  register: claude_code_home_stat
  changed_when: false

- name: Fail if user home directory doesn't exist
  ansible.builtin.fail:
    msg: "User home directory {{ claude_code_user_home }} does not exist"
  when: not claude_code_home_stat.stat.exists

- name: Install Claude Code on macOS
  ansible.builtin.include_tasks: install-macos.yml
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - claude_code_install | bool

- name: Install Claude Code on Linux
  ansible.builtin.include_tasks: install-linux.yml
  when:
    - ansible_facts['os_family'] != 'Darwin'
    - ansible_facts['os_family'] != 'Windows'
    - claude_code_install | bool

- name: Install Claude Code on Windows
  ansible.builtin.include_tasks: install-windows.yml
  when:
    - ansible_facts['os_family'] == 'Windows'
    - claude_code_install | bool

- name: Create Claude Code configuration directory
  ansible.builtin.file:
    path: "{{ claude_code_config_dir }}"
    state: directory
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    mode: "0755"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"

- name: Install global CLAUDE.md instructions
  ansible.builtin.copy:
    src: "{{ claude_code_rules_src if (claude_code_rules_content | default('') | length == 0) else omit }}"
    content: "{{ claude_code_rules_content if (claude_code_rules_content | default('') | length > 0) else omit }}"
    dest: "{{ claude_code_rules_file }}"
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    mode: "0644"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when:
    - claude_code_manage_settings | bool
    - (claude_code_rules_src | default('') | length > 0) or (claude_code_rules_content | default('') | length > 0)

- name: Create Claude Code rules directory
  ansible.builtin.file:
    path: "{{ claude_code_rules_dir }}"
    state: directory
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    mode: "0755"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when: claude_code_manage_rules | bool

- name: Install Claude Code rules
  ansible.builtin.copy:
    src: "{{ claude_code_rules_src_dir | regex_replace('/+$', '') }}/"
    dest: "{{ claude_code_rules_dir }}/"
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    directory_mode: "0755"
    mode: "0644"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when:
    - claude_code_manage_rules | bool
    - claude_code_rules_src_dir | default('') | length > 0

- name: Create Claude Code scripts directory
  ansible.builtin.file:
    path: "{{ claude_code_scripts_dir }}"
    state: directory
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    mode: "0755"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when: claude_code_manage_scripts | bool

- name: Install Claude Code scripts
  ansible.builtin.copy:
    src: "{{ claude_code_scripts_src_dir | regex_replace('/+$', '') }}/"
    dest: "{{ claude_code_scripts_dir }}/"
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    directory_mode: "0755"
    mode: "0755"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when:
    - claude_code_manage_scripts | bool
    - claude_code_scripts_src_dir | default('') | length > 0

# Both writers below replace settings.json wholesale, so dry-run them first and
# back up the current file whenever either would change it. A run that targets
# the wrong host (and so misses its host_vars) would otherwise silently drop
# every host-specific setting with no copy left to restore from.
- name: Check if custom settings.json from source will change (dry-run)
  ansible.builtin.copy:
    src: "{{ claude_code_settings_src }}"
    dest: "{{ claude_code_config_dir }}/settings.json"
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    mode: "0644"
  check_mode: true
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when:
    - claude_code_manage_settings | bool
    - claude_code_settings_src | default('') | length > 0
  register: claude_code_settings_src_check
  diff: false

- name: Check if settings.json will change (dry-run)
  ansible.builtin.template:
    src: settings.json.j2
    dest: "{{ claude_code_config_dir }}/settings.json"
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    mode: "0644"
  check_mode: true
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when:
    - claude_code_manage_settings | bool
    - claude_code_settings_src | default('') | length == 0
  register: claude_code_settings_check
  diff: false

- name: Back up existing settings.json before it is rewritten
  ansible.builtin.include_tasks: backup-settings.yml
  when:
    - claude_code_manage_settings | bool
    - claude_code_backup_settings | bool
    - (claude_code_settings_src_check is changed) or (claude_code_settings_check is changed)

- name: Install custom Claude Code settings.json from source
  ansible.builtin.copy:
    src: "{{ claude_code_settings_src }}"
    dest: "{{ claude_code_config_dir }}/settings.json"
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    mode: "0644"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when:
    - claude_code_manage_settings | bool
    - claude_code_settings_src | default('') | length > 0

- name: Generate Claude Code settings.json
  ansible.builtin.template:
    src: settings.json.j2
    dest: "{{ claude_code_config_dir }}/settings.json"
    owner: "{{ claude_code_username }}"
    group: "{{ claude_code_usergroup }}"
    mode: "0644"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and claude_code_username != ansible_facts['user_id'] }}"
  when:
    - claude_code_manage_settings | bool
    - claude_code_settings_src | default('') | length == 0
  register: claude_code_settings_result

- name: Manage MCP servers
  ansible.builtin.include_tasks: manage-mcp-servers.yml
  when:
    - claude_code_manage_mcp_servers | bool
    - claude_code_mcp_servers | length > 0

- name: Display configuration status
  ansible.builtin.debug:
    msg: >-
      Settings: {{ claude_code_config_dir }}/settings.json |
      Hooks: {{ (claude_code_simple_hooks | length) + (claude_code_advanced_hooks | length) }}
      ({{ claude_code_simple_hooks | length }} simple, {{ claude_code_advanced_hooks | length }} advanced)
      {% if (claude_code_backup_result | default({})).dest is defined %}| Backup: {{ claude_code_backup_result.dest }}{% endif %}
      | MCP Servers: {{ claude_code_mcp_servers | length }}
