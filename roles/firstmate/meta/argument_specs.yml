---
argument_specs:
  main:
    short_description: Install the firstmate agent distro and its dispatch gate
    description:
      - Clones the firstmate repository, which upstream documents as its install.
      - Installs the dispatch gate (crew-dispatch.json, ship-harnesses, the PreToolUse hook and its test) into gitignored paths of the checkout and merges the hook entry into .claude/settings.local.json.
      - Never starts or restarts firstmate sessions, and leaves the checkout's tracked files untouched unless firstmate_update is set.
    options:
      firstmate_username:
        type: str
        description: User who owns the firstmate checkout.
      firstmate_user_home:
        type: str
        description: Home directory of firstmate_username.
      firstmate_repo_url:
        type: str
        default: https://github.com/kunchenguid/firstmate.git
        description: Git repository firstmate is cloned from.
      firstmate_version:
        type: str
        default: main
        description: Branch, tag, or commit checked out on the initial clone.
      firstmate_install_dir:
        type: str
        description: Where the firstmate checkout lives.
      firstmate_update:
        type: bool
        default: false
        description: Fetch and check out firstmate_version on an existing checkout.
      firstmate_manage_dependencies:
        type: bool
        default: true
        description: Install firstmate_dependencies with the system package manager (Linux only).
      firstmate_dependencies:
        type: list
        elements: str
        description: Packages installed when firstmate_manage_dependencies is true.
      firstmate_manage_dispatch_gate:
        type: bool
        default: true
        description: Install the dispatch gate files and merge its hook into .claude/settings.local.json.
      firstmate_ship_harnesses:
        type: list
        elements: str
        description: Harnesses allowed to run ship tasks, rendered to config/ship-harnesses.
      firstmate_crew_dispatch_src:
        type: str
        default: crew-dispatch.json
        description: Role file or controller path installed as config/crew-dispatch.json.
      firstmate_dispatch_gate_hook:
        type: dict
        description: PreToolUse entry merged into .claude/settings.local.json when none of its commands is present.
