---
- name: Converge
  hosts: all
  vars:
    container_user: "{{ ansible_facts['distribution'] | lower }}"
    container_home: "/home/{{ container_user }}"
  tasks:
    # Installs the checkout and its dispatch gate; no session is started.
    - name: Include role under test
      ansible.builtin.include_role:
        name: cowdogmoo.workstation.firstmate
      vars:
        firstmate_username: "{{ container_user }}"
        firstmate_user_home: "{{ container_home }}"
