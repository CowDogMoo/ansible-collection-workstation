---
- name: Prepare
  hosts: all
  gather_facts: true
  vars:
    container_user: "{{ ansible_facts['distribution'] | lower }}"
    container_home: "/home/{{ container_user }}"
  tasks:
    - name: Create test user
      ansible.builtin.user:
        name: "{{ container_user }}"
        shell: /bin/bash
        create_home: true
        home: "{{ container_home }}"
      become: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - sudo
        state: present
        update_cache: true
      become: true
