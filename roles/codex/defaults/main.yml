---
codex_username: "{{ ansible_facts['user_id'] | default(ansible_facts['user']) }}"
codex_usergroup: "{{ (ansible_facts['user_gid'] | default('staff')) if ansible_facts['os_family'] == 'Darwin' else codex_username }}"
codex_user_home: >-
  {{ (ansible_facts['user_dir'] | default(ansible_facts['env']['HOME']))
     if (codex_username == (ansible_facts['user_id'] | default(ansible_facts['user']) | default('')))
     else ((ansible_facts['os_family'] == 'Darwin') | ternary('/Users/' + codex_username,
           (codex_username == 'root') | ternary('/root', '/home/' + codex_username))) }}

# Codex's home directory (CODEX_HOME). Codex reads AGENTS.md, rules/*.rules,
# hooks.json, and config.toml from here.
codex_home: "{{ codex_user_home }}/.codex"

# Homebrew prefix (varies by OS/architecture)
codex_homebrew_prefix: >-
  {{ (ansible_facts['os_family'] == 'Darwin') | ternary(
       (ansible_facts['architecture'] == 'arm64') | ternary('/opt/homebrew', '/usr/local'),
       '/home/linuxbrew/.linuxbrew') }}

# PATH for the codex and npm commands the role runs. The mise shims are on it
# because a per-user node, and the codex its npm installs, are only reachable there.
codex_path: "{{ codex_homebrew_prefix }}/bin:{{ codex_user_home }}/.local/bin:{{ codex_user_home }}/.local/share/mise/shims:/usr/local/bin:/usr/bin:/bin"

# Whether to install the Codex CLI when no working `codex` is on codex_path. An
# existing install is never upgraded or replaced.
codex_install: true

# macOS installs the Homebrew cask. Linux installs the npm package globally as
# codex_username, with the npm found on codex_path: the mise-managed node the
# workstation playbook provides. Without a working npm there, the role says so
# and configures Codex without installing it.
codex_homebrew_cask: codex
codex_npm_package: "@openai/codex"

# npm version to install on Linux; empty installs the latest release.
codex_npm_version: ""

# Global instructions file. Codex loads $CODEX_HOME/AGENTS.md into every session
# ahead of any project AGENTS.md.
codex_agents_md_file: "{{ codex_home }}/AGENTS.md"

# Source file for the global AGENTS.md. Defaults to AGENTS.md from the role's
# files/ directory. Point it at a custom path, or set codex_agents_md_content to
# supply the instructions per host or from a private playbook.
codex_agents_md_src: "AGENTS.md"

# Optional raw AGENTS.md content. If non-empty, it takes precedence over
# codex_agents_md_src.
codex_agents_md_content: ""

# Whether to manage the global AGENTS.md
codex_manage_instructions: true

# Execpolicy rules. Codex evaluates every *.rules file in $CODEX_HOME/rules for
# each shell command, and a `forbidden` decision rejects the command whatever the
# approval and sandbox settings: it still holds under
# --dangerously-bypass-approvals-and-sandbox and --disable hooks, which is how
# firstmate launches Codex crewmates. hooks.json does not fire there.
codex_manage_rules: true
codex_rules_dir: "{{ codex_home }}/rules"

# Rule files bundled with this role (files/rules/). squad-only.rules refuses
# hand-written commit and pull request text so it has to come from squad_commit
# and squad_pr. Never name one default.rules: Codex appends the commands a user
# approves with "always allow" to that file.
codex_bundled_rules:
  - squad-only.rules

# Check each installed rule file with the installed codex binary: the file must
# parse (a parse error in any rules file makes Codex drop every user rule) and
# each probe below must get the expected decision. Skipped in check mode, and
# when no working codex is on codex_path.
codex_validate_rules: true

# Probes for codex_validate_rules: whether `codex execpolicy check` must report
# each command as forbidden. A command that must not be forbidden may still match
# an allow rule (default.rules collects those).
codex_rules_probes:
  - argv: [git, commit, -m, x]
    forbidden: true
  - argv: [git, commit, --no-verify, -m, x]
    forbidden: true
  - argv: [gh, pr, create, --title, t, --body, b]
    forbidden: true
  - argv: [squad_commit]
    forbidden: false
  - argv: [squad_pr]
    forbidden: false
  - argv: [git, status]
    forbidden: false

# Hooks. Off by default, for two reasons. Firstmate launches Codex crewmates with
# --disable hooks, so the hook never runs for them and the rules above carry the
# squad-only guard. And Codex refuses to run a user hook it has not been told to
# trust: each new or changed entry opens the "hooks are new or changed" review at
# the next hooks-enabled launch, which parks an unattended session until someone
# answers it. Turn this on where an interactive Codex session should also get the
# hook's finer-grained checks (git -C, env prefixes, wrapped shells, redirects, the
# conflicted-merge exemption), then trust it once with /hooks.
codex_manage_hooks: false

# hooks.json is merged, not replaced: entries written by other tools (herdr's
# SessionStart hook, for example) are kept, and only the handlers this role wrote
# before are swapped for the current ones. It is rewritten only when that changes
# the hooks in it, never because another tool saved it with different formatting.
codex_hooks_file: "{{ codex_home }}/hooks.json"

# Prefixed to every command this role writes into hooks.json, so a later run can
# find and replace its own handlers without touching anyone else's.
codex_hooks_marker: "# managed by cowdogmoo.workstation.codex:"

# Codex PreToolUse hooks use the Claude Code wire contract: tool_input.command and
# cwd arrive on stdin, and exit 2 with a reason on stderr blocks the call. Codex
# reports its shell tool to hooks as `Bash`.
codex_hooks_default:

  # forbidden_content: Commits and pull request text come from squad, full stop.
  #
  # The detector is the same code as the claude_code role's forbidden_content hook,
  # with Codex attribution added to the forbidden text. Keep the copies in step:
  # .hooks/tests/test-squad-only.py runs one matrix against all of them.
  forbidden_content:
    event: PreToolUse
    matcher: Bash
    command: |
      python3 -c "
      import json, os, re, shlex, subprocess, sys

      data = json.load(sys.stdin)
      cmd = data.get('tool_input', {}).get('command', '')
      cwd = data.get('cwd') or os.getcwd()

      SQUAD_ONLY = ('squad_commit', 'squad_pr')
      SHELLS = ('bash', 'sh', 'zsh', 'dash', 'ksh')
      SEPARATORS = '&|;()<>'
      GIT_OPTS_WITH_ARG = ('-C', '-c', '--git-dir', '--work-tree', '--namespace', '--super-prefix', '--config-env')
      PR_TEXT_FLAGS = ('-t', '--title', '-b', '--body', '-F', '--body-file')
      MERGE_TEXT_FLAGS = ('-t', '--subject', '-b', '--body', '-F', '--body-file')
      SEQUENCER = ('--continue', '--skip', '--abort', '--quit')
      API_BODY_FLAGS = ('-f', '-F', '--field', '--raw-field', '--input')
      API_OPTS_WITH_ARG = ('-H', '--header', '-q', '--jq', '-t', '--template', '-p', '--preview', '--hostname', '--cache')
      METHODS = ('GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD')
      PULLS = re.compile(r'^/?repos/[^/]+/[^/]+/pulls(/[^/?]+)?/?(\?.*)?\Z')
      PULL_MERGE = re.compile(r'^/?repos/[^/]+/[^/]+/pulls/[^/?]+/merge/?(\?.*)?\Z')
      HEREDOC = re.compile(r'(?<!<)<<(?!<)-?\s*([^\s;&|<>()]+)')

      def strip_heredocs(text):
          out, pending = [], []
          for line in text.split(chr(10)):
              if pending:
                  if line.strip() == pending[0]:
                      pending.pop(0)
                  continue
              out.append(line)
              pending = [d.strip(chr(39) + chr(34) + chr(92)) for d in HEREDOC.findall(line)]
          return chr(10).join(out)

      def tokenize(text):
          try:
              lexer = shlex.shlex(text, posix=True, punctuation_chars=True)
              lexer.whitespace_split = True
              return list(lexer)
          except ValueError:
              return text.split()

      def clauses(toks):
          out, cur = [], []
          for tok in toks:
              if tok and all(ch in SEPARATORS for ch in tok):
                  out.append(cur)
                  cur = []
              else:
                  cur.append(tok)
          out.append(cur)
          return out

      def word(tok):
          return tok.split('/')[-1]

      def merge_in_progress(workdir):
          try:
              return subprocess.run(
                  ['git', '-C', workdir, 'rev-parse', '-q', '--verify', 'MERGE_HEAD'],
                  capture_output=True, timeout=5,
              ).returncode == 0
          except Exception:
              return False

      def git_commit(args, workdir):
          j = 0
          while j < len(args) and args[j].startswith('-'):
              if args[j] == '-C' and j + 1 < len(args):
                  workdir = os.path.join(workdir, os.path.expanduser(args[j + 1]))
              j += 2 if args[j] in GIT_OPTS_WITH_ARG else 1
          if j >= len(args):
              return None
          sub, rest = args[j], args[j + 1:]
          if sub in ('commit', 'commit-tree'):
              quiet = [a for a in rest if a not in ('-q', '--quiet')]
              if sub == 'commit' and quiet == ['--no-edit'] and merge_in_progress(workdir):
                  return None
              return 'git ' + sub
          if sub == 'merge' and any(a[:2] in ('-m', '-F', '-e') or a.split('=')[0] in ('--message', '--file', '--edit') for a in rest):
              return 'git merge'
          if sub == 'rebase' and any(a[:2] == '-x' or a.split('=')[0] == '--exec' for a in rest):
              return 'git rebase --exec'
          if sub in ('revert', 'cherry-pick'):
              if any(a in ('-e', '--edit') for a in rest):
                  return 'git ' + sub
              if not any(a in SEQUENCER + ('-n', '--no-commit') for a in rest):
                  return 'git ' + sub
          return None

      def gh_api(args):
          method, body, positional, j = None, False, [], 0
          while j < len(args):
              a = args[j]
              if a in ('-X', '--method'):
                  method = args[j + 1] if j + 1 < len(args) else None
                  j += 2
                  continue
              if a.startswith(('--method=', '-X=')):
                  method = a.split('=', 1)[1]
              elif a.startswith('-X') and len(a) > 2:
                  method = a[2:]
              elif a in API_BODY_FLAGS:
                  body = True
                  j += 2
                  continue
              elif a.startswith(('--field=', '--raw-field=', '--input=')) or (a[:2] in ('-f', '-F') and len(a) > 2):
                  body = True
              elif a in API_OPTS_WITH_ARG:
                  j += 2
                  continue
              elif not a.startswith('-'):
                  positional.append(a)
              j += 1
          if positional and positional[0].upper() in METHODS:
              method = positional.pop(0)
          endpoint = positional[0] if positional else ''
          method = (method or ('POST' if body else 'GET')).upper()
          joined = ' '.join(args)
          if method in ('POST', 'PATCH', 'PUT') and PULLS.match(endpoint):
              return 'gh api ' + method + ' ' + endpoint
          if method == 'PUT' and PULL_MERGE.match(endpoint) and re.search(r'\bcommit_(title|message)=', joined):
              return 'gh api PUT ' + endpoint
          if endpoint == 'graphql' and re.search(r'\b(create|update)PullRequest\b|\bcommit(Headline|Body)\b', joined):
              return 'gh api graphql pull request mutation'
          return None

      def gh_pr_text(args):
          if args[:1] == ['api']:
              return gh_api(args[1:])
          if args[:1] != ['pr'] or len(args) < 2:
              return None
          if args[1] in ('create', 'new'):
              return 'gh pr ' + args[1]
          if args[1] == 'edit' and any(a.split('=')[0] in PR_TEXT_FLAGS for a in args[2:]):
              return 'gh pr edit'
          if args[1] == 'merge' and any(a.split('=')[0] in MERGE_TEXT_FLAGS for a in args[2:]):
              return 'gh pr merge'
          return None

      def check(clause, workdir):
          for i, tok in enumerate(clause):
              name = word(tok)
              hit = None
              if name == 'git':
                  hit = git_commit(clause[i + 1:], workdir)
              elif name in ('gh', 'gh-axi'):
                  hit = gh_pr_text(clause[i + 1:])
                  if hit and name == 'gh-axi':
                      hit = 'gh-axi' + hit[2:]
              if hit:
                  return hit
          return None

      def scan(text, workdir, depth=0):
          for clause in clauses(tokenize(strip_heredocs(text))):
              if clause[:1] == ['cd'] and len(clause) > 1:
                  workdir = os.path.join(workdir, os.path.expanduser(clause[1]))
                  continue
              hit = check(clause, workdir)
              if hit:
                  return hit
              if depth:
                  continue
              for i, tok in enumerate(clause):
                  name, rest = word(tok), clause[i + 1:]
                  if name == 'eval':
                      hit = scan(' '.join(rest), workdir, depth + 1)
                  elif name in SHELLS:
                      payload = next((rest[j + 1] for j, arg in enumerate(rest)
                                      if arg.startswith('-') and arg.endswith('c')
                                      and j + 1 < len(rest)), None)
                      hit = scan(payload, workdir, depth + 1) if payload else None
                  else:
                      continue
                  if hit:
                      return hit
          return None

      USE_SQUAD = (
          '✅ Use ONLY squad output:\\n'
          '  Commits: squad_commit\\n'
          '  PRs:     squad_pr  (opens the PR, or regenerates the title and body of an open one)'
      )

      op = scan(cmd, cwd)
      if op:
          sys.stderr.write(
              f'❌ BLOCKED: {op!r} writes commit or pull request text by hand.\\n\\n'
              'Commits and PR titles/bodies come only from squad. Use squad_commit or squad_pr.\\n'
              + ('Run it with --no-commit (-n), then squad_commit.\\n' if op.endswith(('revert', 'cherry-pick')) else '')
              + USE_SQUAD + '\\n'
          )
          sys.exit(2)

      forbidden = [
          '🤖',
          'Generated with',
          'Co-Authored-By: Claude',
          'Co-authored-by: Claude',
          'claude.com/claude-code',
          'noreply@anthropic.com',
          'Co-Authored-By: Codex',
          'Co-authored-by: Codex',
          'noreply@openai.com',
      ]

      git_writes = ['git commit', 'git revert', 'git cherry-pick', 'git rebase', 'git merge', 'git tag', 'git notes']
      gh_writes = ['gh pr create', 'gh pr edit', 'gh pr comment', 'gh issue create', 'gh issue edit', 'gh issue comment', 'gh release create', 'gh release edit']

      triggered = next((f for f in forbidden if f in cmd), None)
      write_op = next((g for g in git_writes + gh_writes if g in cmd), None)

      if triggered and write_op:
          sys.stderr.write(f'❌ BLOCKED: forbidden content {triggered!r} in {write_op!r} command.\\n\\n' + USE_SQUAD + '\\n')
          sys.exit(2)
      sys.exit(0)
      "

# Per-host overrides merged into codex_hooks_default (recursive). Set a key to
# null to drop a default hook, or add a new key for a host-specific one.
codex_hooks_overrides: {}

# Final assembled map: defaults plus overrides, null entries removed.
codex_hooks: >-
  {{
    (codex_hooks_default | combine(codex_hooks_overrides, recursive=True))
    | dict2items | rejectattr('value', 'none') | items2dict
  }}
