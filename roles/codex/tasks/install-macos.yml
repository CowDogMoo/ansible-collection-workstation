---
- name: Check if codex is already installed
  ansible.builtin.command: which codex
  environment:
    PATH: "{{ codex_path }}"
  register: codex_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the Codex cask
  community.general.homebrew_cask:
    name: "{{ codex_homebrew_cask }}"
    state: present
  when: codex_check.rc != 0

- name: Read the codex version
  ansible.builtin.command: codex --version
  environment:
    PATH: "{{ codex_path }}"
  register: codex_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Display the codex version
  ansible.builtin.debug:
    msg: "Codex installed: {{ codex_version.stdout }}"
  when: codex_version.rc == 0
