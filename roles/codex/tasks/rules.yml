---
- name: Create the Codex rules directory
  ansible.builtin.file:
    path: "{{ codex_rules_dir }}"
    state: directory
    owner: "{{ codex_username }}"
    group: "{{ codex_usergroup }}"
    mode: "0755"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and codex_username != ansible_facts['user_id'] }}"

# Codex only loads files whose extension is exactly `rules`, so the `~`-suffixed
# copies `backup` leaves next to a replaced file are never read as policy.
- name: Install bundled rule files
  ansible.builtin.copy:
    src: "rules/{{ item }}"
    dest: "{{ codex_rules_dir }}/{{ item }}"
    owner: "{{ codex_username }}"
    group: "{{ codex_usergroup }}"
    mode: "0644"
    backup: true
  loop: "{{ codex_bundled_rules }}"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and codex_username != ansible_facts['user_id'] }}"

- name: Install extra rule files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ codex_rules_dir }}/{{ item | basename }}"
    owner: "{{ codex_username }}"
    group: "{{ codex_usergroup }}"
    mode: "0644"
    backup: true
  loop: "{{ codex_rules_extra }}"
  become: "{{ ansible_facts['os_family'] != 'Darwin' and codex_username != ansible_facts['user_id'] }}"

- name: Refuse a managed rule file named default.rules
  ansible.builtin.assert:
    that:
      - "'default.rules' not in (codex_bundled_rules + (codex_rules_extra | map('basename') | list))"
    fail_msg: >-
      default.rules belongs to Codex, which appends the commands a user approves with
      "always allow" to it. Give the managed rule file another name.
    quiet: true

- name: Validate the installed rules with codex
  ansible.builtin.include_tasks: validate-rules.yml
  when:
    - codex_validate_rules | bool
    - not ansible_check_mode
