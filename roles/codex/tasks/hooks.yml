---
- name: Check for an existing hooks.json
  ansible.builtin.stat:
    path: "{{ codex_hooks_file }}"
  register: codex_hooks_stat
  become: "{{ ansible_facts['os_family'] != 'Darwin' and codex_username != ansible_facts['user_id'] }}"

- name: Read the existing hooks.json
  ansible.builtin.slurp:
    src: "{{ codex_hooks_file }}"
  register: codex_hooks_slurp
  when: codex_hooks_stat.stat.exists
  become: "{{ ansible_facts['os_family'] != 'Darwin' and codex_username != ansible_facts['user_id'] }}"

# A file that does not parse fails the play here instead of being rewritten, which
# would throw away whatever its owner meant to put there.
- name: Parse the existing hooks.json
  ansible.builtin.set_fact:
    codex_hooks_existing: >-
      {{ (codex_hooks_slurp.content | b64decode | from_json)
         if codex_hooks_stat.stat.exists else {} }}

# codex_hooks_merged is the document to write. Every handler whose command starts
# with codex_hooks_marker was written by an earlier run of this role and is
# dropped; everything else, including other top-level keys, is kept as it was.
# The current codex_hooks are then appended, each to its event's list, with the
# marker as a leading shell comment so the next run can find them.
#
# It is a task variable, not a fact, so it is rendered once each time it is read:
# ansible-core before 2.19 templates a stored fact again, and a hook command may
# hold text that looks like a Jinja expression.
#
# It is compared with the existing file as data, not bytes: another tool that
# saves the same hooks with its own formatting (herdr writes raw UTF-8 with no
# trailing newline) has changed nothing, so the file is left as that tool wrote
# it.
- name: Write the merged hooks.json
  ansible.builtin.template:
    src: hooks.json.j2
    dest: "{{ codex_hooks_file }}"
    owner: "{{ codex_username }}"
    group: "{{ codex_usergroup }}"
    mode: "0644"
    backup: true
  register: codex_hooks_result
  when: codex_hooks_merged != codex_hooks_existing
  become: "{{ ansible_facts['os_family'] != 'Darwin' and codex_username != ansible_facts['user_id'] }}"
  vars:
    codex_hooks_merged: >-
      {%- set doc = codex_hooks_existing if codex_hooks_existing is mapping else {} -%}
      {%- set out = {} -%}
      {%- for key, value in doc.items() if key != 'hooks' -%}
      {%-   set _ = out.update({key: value}) -%}
      {%- endfor -%}
      {%- set events = {} -%}
      {%- for event, groups in (doc.get('hooks') or {}).items() -%}
      {%-   set kept = [] -%}
      {%-   for group in groups -%}
      {%-     set handlers = [] -%}
      {%-     for handler in group.get('hooks', []) -%}
      {%-       if not ((handler.get('command') or '') is string and (handler.get('command') or '').startswith(codex_hooks_marker)) -%}
      {%-         set _ = handlers.append(handler) -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-     if handlers | length > 0 -%}
      {%-       set kept_group = {} -%}
      {%-       set _ = kept_group.update(group) -%}
      {%-       set _ = kept_group.update({'hooks': handlers}) -%}
      {%-       set _ = kept.append(kept_group) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   if kept | length > 0 -%}
      {%-     set _ = events.update({event: kept}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- for name, hook in codex_hooks.items() -%}
      {%-   set event = hook.event | default('PreToolUse') -%}
      {%-   set handler = {'type': 'command', 'command': codex_hooks_marker ~ ' ' ~ name ~ '\n' ~ hook.command} -%}
      {%-   if hook.timeout is defined -%}
      {%-     set _ = handler.update({'timeout': hook.timeout}) -%}
      {%-   endif -%}
      {%-   set group = {'hooks': [handler]} -%}
      {%-   if hook.matcher is defined -%}
      {%-     set _ = group.update({'matcher': hook.matcher}) -%}
      {%-   endif -%}
      {%-   set _ = events.update({event: (events.get(event, []) + [group])}) -%}
      {%- endfor -%}
      {%- set _ = out.update({'hooks': events}) -%}
      {{ out }}
