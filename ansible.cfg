[defaults]
host_key_checking = False
retry_files_enabled = False
# log_plays writes one file per inventory host under log_folder, which the
# Alloy agent tails and ships to Loki for the Ansible dashboard. Ansible reads
# only one config file, so this repeats what ~/.ansible.cfg enables: without
# it, runs started from the repo root never reach the dashboard.
# Molecule ignores this file (it points ANSIBLE_CONFIG at its own generated
# config). To keep an ad-hoc test run off the dashboard, override the list:
#   ANSIBLE_CALLBACKS_ENABLED=ansible.posix.profile_tasks ansible-playbook ...
callbacks_enabled = community.general.log_plays, ansible.posix.profile_tasks
roles_path = ~/.ansible/roles:./roles
collections_path = ~/.ansible/collections/ansible_collections
log_path = ~/.ansible/workstation.log
no_log = False

[callback_log_plays]
log_folder = ~/ansible-logs/hosts
