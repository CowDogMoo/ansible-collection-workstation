---
name: Template Sync
on:
  # checkov:skip=CKV_GHA_7: "Workflow dispatch inputs are required for manual debugging"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.hooks/**'
      - 'Taskfile.yaml'
      - '.editorconfig'
      - '.github/sync.yml'

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  sync:
    name: Sync infrastructure files to consumer repos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate downstream token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.L50_BOT_APP_ID }}
          private-key: ${{ secrets.L50_BOT_APP_PRIVATE_KEY }}
          owner: l50
          repositories: |
            ansible-collection-arsenal
            ansible-collection-bulwark

      - name: Sync files
        uses: step-security/repo-file-sync-action@864be44bbed421c6313ecc45d2c79e89003f2bd5 # v1.21.4
        with:
          # Pass the app token as GH_PAT (with the oauth: URL prefix) so the
          # action force-pushes with git. Its GH_INSTALLATION_TOKEN API path
          # fails with "Reference already exists" whenever a sync PR branch is
          # already open: it compares the Octokit error message exactly, but the
          # bundled Octokit appends a documentation URL to that message.
          GH_PAT: ${{ steps.app-token.outputs.token }}
          IS_FINE_GRAINED: true
          GIT_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_USERNAME: github-actions[bot]
          COMMIT_PREFIX: "chore:"
          COMMIT_EACH_FILE: false
          PR_LABELS: sync,template,ansible
          PR_BODY: |
            Automated sync of shared infrastructure files from `CowDogMoo/ansible-collection-workstation`.

            Workflow files and `.pre-commit-config.yaml` are owned by Renovate and excluded here.
