group:
  repos: |
    l50/ansible-collection-arsenal
    l50/ansible-collection-bulwark
  files:
    - source: .hooks/
      dest: .hooks/
      deleteOrphaned: true
      # Exclude paths are relative to source. tests/ holds scripts that
      # exercise roles and workflows that exist only in this repo.
      exclude: |
        requirements.txt
        tests
    - source: Taskfile.yaml
      dest: Taskfile.yaml
    - source: .editorconfig
      dest: .editorconfig
