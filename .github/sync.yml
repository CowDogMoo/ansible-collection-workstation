group:
  repos: |
    l50/ansible-collection-arsenal
    l50/ansible-collection-bulwark
  files:
    - source: .hooks/
      dest: .hooks/
      deleteOrphaned: true
      # Exclude paths are relative to source. The test-*.py scripts exercise
      # roles and workflows that exist only in this repo.
      exclude: |
        requirements.txt
        test-dangerous-flags.py
        test-molecule-retry.py
        test-squad-only.py
    - source: Taskfile.yaml
      dest: Taskfile.yaml
    - source: .editorconfig
      dest: .editorconfig
