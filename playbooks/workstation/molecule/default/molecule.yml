---
# Use Ansible Galaxy to install dependencies
dependency:
  name: galaxy
  options:
    # Install required galaxy roles
    role-file: ../../requirements.yml
    # Install required collections
    requirements-file: ../../requirements.yml

# Run molecule inside of a docker container
driver:
  name: docker

platforms:
  - name: ubuntu-workstation
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: "" # necessary for systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

provisioner:
  name: ansible
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
  inventory:
    group_vars:
      all:
        # Pin the dotfiles clone so a commit landing on l50/dotfiles between
        # converge and idempotence can't fail the idempotence check. Bump by
        # hand: dotfiles' own Renovate pins this repo by digest, so having
        # Renovate track this SHA would make the two repos bump each other in
        # a loop.
        shell_functions_repo_version: 04ca4dadb5960eaef51b3dcb475e0075e5c294ea
        # The test container has no host_vars file; run on role defaults on
        # purpose rather than tripping the playbook's missing-host_vars guard.
        workstation_allow_missing_host_vars: true

verifier:
  name: ansible
