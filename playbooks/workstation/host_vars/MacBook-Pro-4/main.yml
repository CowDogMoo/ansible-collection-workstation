---
# Fabric custom patterns configuration
fabric_install_custom_patterns: true
fabric_custom_patterns_repo: "~/cowdogmoo/fabric-patterns-hub"
fabric_custom_patterns_symlink: true
fabric_update_custom_patterns: true

# MCP Server configuration for Claude Code
claude_code_mcp_servers:

  # Grafana integration for dashboards, alerts, and observability
  - name: grafana
    scope: user
    command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mcp-grafana"
    env:
      GRAFANA_URL: "{{ grafana_url | default('https://grafana.techvomit.xyz') }}"
      GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ vault_grafana_api_token }}"

  # Warpgate for container/AMI image building
  - name: warpgate
    scope: user
    command: "{{ ansible_facts['env']['HOME'] }}/go/bin/warpgate-mcp-server"
    args:
      - stdio

claude_code_advanced_hooks:
  # Hook 1: Block commits/PRs with forbidden content (emojis/branding)
  - event: PreToolUse
    tool: Bash
    type: command
    command: |
      python3 -c "
      import json, sys

      data = json.load(sys.stdin)
      cmd = data.get('tool_input', {}).get('command', '')

      forbidden = ['🤖', 'Generated with', 'Co-Authored-By: Claude', 'claude.com/claude-code']

      msg = ''
      if 'git commit' in cmd and '-m' in cmd and any(f in cmd for f in forbidden):
          msg = '❌ BLOCKED: Forbidden content (emojis/branding)\\n\\n✅ Use ONLY fabric output\\nGenerate: git diff --staged | fabric --pattern commit'
      elif 'gh pr create' in cmd and '--body' in cmd and any(f in cmd for f in forbidden):
          msg = '❌ BLOCKED: Forbidden content (emojis/branding)\\n\\n✅ Use ONLY fabric output\\nGenerate: git diff main...HEAD | fabric --pattern pr'

      if msg:
          sys.stderr.write(msg + '\n')
          sys.exit(2)
      sys.exit(0)
      "

  # Hook 2: Block dangerous git flags that bypass safety checks
  - event: PreToolUse
    tool: Bash
    type: command
    command: |
      python3 -c "
      import json, sys, shlex, re

      data = json.load(sys.stdin)
      cmd = data.get('tool_input', {}).get('command', '')

      if 'git' not in cmd:
          sys.exit(0)

      # Block an option only where a real git invocation would receive it as argv, so
      # searching for or documenting a flag is left alone. Disabling hooks by another
      # name is the same shortcut, so it is caught here too.
      #
      # Deliberately out of scope: anything that has to be constructed to slip past
      # this - a payload nested two levels down, a flag pasted together at runtime
      # from variables or command substitution. Chasing those means reimplementing a
      # shell, and the guardrail is against a careless shortcut, not an adversary
      # who could just as easily edit this file.
      FLAGS = ['--no-verify', '--no-gpg-sign', '--no-post-rewrite']
      HOOK_ENV = ('SKIP', 'HUSKY', 'PRE_COMMIT_ALLOW_NO_CONFIG')
      SHELLS = ('bash', 'sh', 'zsh', 'dash', 'ksh')
      SEPARATORS = '&|;()<>'

      def tokenize(text):
          try:
              lexer = shlex.shlex(text, posix=True, punctuation_chars=True)
              lexer.whitespace_split = True
              return list(lexer)
          except ValueError:
              return text.split()

      def clauses(toks):
          out, cur = [], []
          for tok in toks:
              if tok and all(ch in SEPARATORS for ch in tok):
                  out.append(cur)
                  cur = []
              else:
                  cur.append(tok)
          out.append(cur)
          return out

      def check(clause):
          # The last git token is the invocation and the rest is its argv, which
          # covers exec-style prefixes - sudo, env, timeout, nohup - without
          # enumerating them.
          found = [i for i, tok in enumerate(clause) if tok.split('/')[-1] == 'git']
          if not found:
              return None
          args = clause[found[-1] + 1:]
          for tok in clause:
              if re.match('^(' + '|'.join(HOOK_ENV) + ')=', tok):
                  return tok.split('=')[0] + '='
          for arg in args:
              if arg.startswith('core.hooksPath='):
                  return 'core.hooksPath'
          for flag in FLAGS:
              if flag in args or any(arg.startswith(flag + '=') for arg in args):
                  return flag
          if 'commit' in args and '-n' in args:
              return '-n'
          return None

      def scan(text, depth=0):
          for clause in clauses(tokenize(text)):
              hit = check(clause)
              if hit:
                  return hit
              if depth:
                  continue
              # One level into eval and a shell -c payload. A wrapped command still
              # reads as an ordinary habit; deeper nesting does not.
              for i, tok in enumerate(clause):
                  word, rest = tok.split('/')[-1], clause[i + 1:]
                  if word == 'eval':
                      hit = scan(' '.join(rest), depth + 1)
                  elif word in SHELLS:
                      payload = next((rest[j + 1] for j, arg in enumerate(rest)
                                      if arg.startswith('-') and arg.endswith('c')
                                      and j + 1 < len(rest)), None)
                      hit = scan(payload, depth + 1) if payload else None
                  else:
                      continue
                  if hit:
                      return hit
          return None

      blocked_flag = scan(cmd)

      if blocked_flag:
          msg = f'❌ BLOCKED: Cannot use {blocked_flag} flag.\\n\\nThis flag bypasses important safety checks.\\nFix the underlying issues instead.'
          sys.stderr.write(msg + '\\n')
          sys.exit(2)
      sys.exit(0)
      "
  # Hook 3: Sound notification when Claude finishes a task
  - event: Stop
    tool: ""
    type: command
    command: "afplay \"$HOME/Jobs Done.mp3\""

  # Hook 4: Sound notification when Claude needs input
  - event: Notification
    tool: ""
    type: command
    command: "osascript -e 'beep 1'"

# Additional settings not covered by hooks
claude_code_additional_settings:
  enabledPlugins:
    frontend-design@claude-plugins-official: true
