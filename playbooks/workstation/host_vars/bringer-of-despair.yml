---
# The claude_code role renders settings.json from scratch, so anything not named
# here is dropped on the next converge. The keys below were previously only in
# ~/.claude/settings.json and would have been wiped.
#
# Claude Code writes most of these itself when you change a setting in the TUI
# (/config, the theme picker, the model picker). Change one in the app and this
# file is stale - a converge will put the old value back. Re-sync here when that
# matters; `--check --diff` shows the difference before anything is written.
# The role keeps Claude Code's bypass-permissions confirmation on by default;
# this host opts out of it.
claude_code_skip_dangerous_mode_permission_prompt: true

claude_code_additional_settings:
  model: "opus[1m]"
  effortLevel: xhigh
  modelSettings:
    claude-fable-5-1:
      effortLevel: high
  theme: dark
  tui: fullscreen
  inputNeededNotifEnabled: true
  agentPushNotifEnabled: true
  enabledPlugins: {}
  extraKnownMarketplaces:
    cowdogmoo:
      source:
        source: github
        repo: CowDogMoo/squad-skills

# Hooks that belong to this machine only, adopted into Ansible so a converge stops
# wiping them. Before this, they lived only in ~/.claude/settings.json and the
# claude_code role - which treats that file as generated output - dropped all of
# them on every run.
#
# Every entry uses `tool: ""`, the role's convention for a hook that is not scoped
# to one tool: it renders as an empty matcher, which Claude Code reads as "every
# tool". The cc-status hooks previously carried no matcher key at all; empty and
# absent both mean the same thing here.
claude_code_advanced_hooks_overrides:

  # iTerm2 status line. One hook per lifecycle event, all running the same script,
  # which reads the event off stdin and repaints the bar.
  iterm2_status_notification:
    event: Notification
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_permission_request:
    event: PermissionRequest
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_pre_tool_use:
    event: PreToolUse
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_post_tool_use:
    event: PostToolUse
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_session_start:
    event: SessionStart
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_session_end:
    event: SessionEnd
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_user_prompt_submit:
    event: UserPromptSubmit
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_stop:
    event: Stop
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_stop_failure:
    event: StopFailure
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  iterm2_status_subagent_stop:
    event: SubagentStop
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.config/iterm2/cc-status"

  # unlazy skill: its Stop hook decides whether the agent is actually finished.
  # Installed with the skill, not by this role, so it has to be named here to survive.
  unlazy_stop:
    event: Stop
    tool: ""
    type: command
    command: >-
      '{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims/node'
      '{{ ansible_facts['env']['HOME'] }}/.claude/skills/unlazy/scripts/stop-hook.mjs'
      --unlazy-hook-v2

  # AXI SessionStart hooks. Each prints a short self-description into the
  # session's context, so the binary behind it is pinned below in
  # mise_additional_packages and called through its mise shim, not resolved from
  # whatever `npm install -g` last put on PATH.
  gh_axi_session_start:
    event: SessionStart
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims/gh-axi"
    timeout: 10

  chrome_devtools_axi_session_start:
    event: SessionStart
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims/chrome-devtools-axi"
    timeout: 10

  lavish_axi_session_start:
    event: SessionStart
    tool: ""
    type: command
    command: "{{ ansible_facts['env']['HOME'] }}/.local/share/mise/shims/lavish-axi"
    timeout: 10

  # herdr's Claude integration: tells the herdr pane which session it hosts.
  # herdr owns the script and rewrites it on update; only the registration is here.
  herdr_agent_state:
    event: SessionStart
    tool: "^(startup|resume|clear|compact|fork)$"
    type: command
    command: "bash '{{ ansible_facts['env']['HOME'] }}/.claude/hooks/herdr-agent-state.sh' session"
    timeout: 10

# Tools that would otherwise come from `curl … | sh` installers and unpinned
# `npm install -g`. mise checks each github: download against the digest GitHub
# publishes for the release asset, and Renovate proposes bumps (never automerged).
mise_additional_packages:
  # renovate: datasource=npm depName=gh-axi
  - name: "npm:gh-axi"
    version: "0.1.38"
  # renovate: datasource=npm depName=chrome-devtools-axi
  - name: "npm:chrome-devtools-axi"
    version: "0.1.40"
  # Found on PATH by chrome-devtools-axi, which otherwise runs
  # `npx -y chrome-devtools-mcp@latest` on every launch.
  # renovate: datasource=npm depName=chrome-devtools-mcp
  - name: "npm:chrome-devtools-mcp"
    version: "1.10.1"
  # renovate: datasource=npm depName=lavish-axi
  - name: "npm:lavish-axi"
    version: "0.1.87"
  # renovate: datasource=npm depName=quota-axi
  - name: "npm:quota-axi"
    version: "0.1.61"
  # renovate: datasource=npm depName=tasks-axi
  - name: "npm:tasks-axi"
    version: "0.2.6"
  # renovate: datasource=github-releases depName=kunchenguid/no-mistakes extractVersion=^v(?<version>.*)$
  - name: "github:kunchenguid/no-mistakes"
    version: "1.84.0"
  # renovate: datasource=github-releases depName=kunchenguid/treehouse extractVersion=^v(?<version>.*)$
  - name: "github:kunchenguid/treehouse"
    version: "3.1.2"

# Opt-outs for tools above. Both telemetry clients post usage events to
# a.kunchenguid.com unless told not to, and no-mistakes' own update check is
# moot when mise owns its version. ~/.zshenv rather than ~/.zshrc: the
# no-mistakes daemon imports its environment from a login shell at startup, so
# this reaches it even after it rewrites its own LaunchAgent plist.
zsh_setup_zshenv_exports:
  NO_MISTAKES_TELEMETRY: "off"
  NO_MISTAKES_NO_UPDATE_CHECK: "1"
  LAVISH_AXI_TELEMETRY: "off"
